[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-stack"
version = "0.2.1"  # x-release-please-version
description = "Train and run models across every machine on your network."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "a member" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
# ml_stack.installed reads the pins with Requirement, SpecifierSet and Version.
dependencies = ["packaging>=22", "psutil>=7.2.2"]

# Nothing below is needed to find the other machines and pass work between them.
# Each extra is what one part of ml_stack needs to do its own job.
[project.optional-dependencies]
privacy = ["presidio-analyzer>=2.2.364", "spacy>=3.8"]
# presidio over a transformers NER model rather than spaCy's own
privacy-transformers = ["ml-stack[privacy]", "presidio-analyzer[transformers]>=2.2.364"]
test = ["pytest>=9.1.1", "pytest-xdist>=3.8.0", "pytest-testmon>=2.2", "pyyaml>=6.0"]

claude = ["claude-agent-sdk>=0.1"]
arrays = ["numpy>=1.24"]
torch = ["torch>=2.14"]
transformers = ["transformers>=5.17"]
mlx = ["mlx>=0.32.2"]
# `ml_stack.spec`: tree speculative decoding over mlx-lm's hybrid models, which it drives
# through their own layer classes
spec = ["mlx>=0.32.2", "mlx-lm>=0.31.3", "mlx-vlm>=0.7.1", "numpy>=1.24", "huggingface_hub>=1.32"]
train = ["numpy>=1.24", "safetensors>=0.4"]
# a LoRA rather than a full fine-tune: two small matrices on each projection, the
# base frozen. What makes an 8B tool caller trainable on one machine, where a full
# fine-tune of it would need ~128G of optimizer state.
train-lora = ["ml-stack[train,torch,transformers]", "peft>=0.21.0"]
# a daemon on the LAN makes its own TLS certificate with this (or with openssl on PATH)
fleet-tls = ["cryptography>=50"]
# adding a machine with a short code (`ml-stack-fleet listen` / `pair`): SPAKE2 from the
# maintained `spake2` package, Ed25519 signing from cryptography, the signing key in the OS
# keystore through `keyring`
fleet-onboard = ["cryptography>=50", "spake2>=0.9", "keyring>=24"]
# `ml-stack-speech`: faster-whisper transcribes, piper speaks. A piper voice is a
# pair of files named by MLSTACK_PIPER_VOICE; `ml-stack-speech providers` says what
# each engine still wants
speech = ["faster-whisper>=1.2.1", "piper-tts>=1.8.0"]
gguf = ["gguf>=0.10", "numpy>=1.24"]
graph = ["numpy>=1.24"]
# `ml-stack-decide`: the embed backend's head
decide = ["numpy>=1.24", "safetensors>=0.4"]
# the pointer backend runs a released checkpoint on torch; its files are downloaded only on request
decide-pointer = ["ml-stack[decide]", "torch>=2.14", "transformers>=5.17", "peft>=0.21.0",
                  "huggingface_hub>=1.32"]
# an embedded property graph: one file on disk, native Cypher, no server.
# tests/test_graph_engine_contract.py is what a bump is measured against
store = ["ladybug>=0.20.4,<0.21"]
# a browser that remembers who you are; needs `playwright install chromium` too
scrape = ["playwright>=1.40"]
# searching the web beside the graph: ddgs is keyless and rate-limited, SearXNG is not
web = ["ddgs>=9", "trafilatura>=2"]
# ml-stack-models fetch and hub.located read and fill the Hub cache through this
hub = ["huggingface_hub>=1.32"]
vision = ["numpy>=1.24", "pillow>=10.0"]
# a book is a source like any other: `ml_stack.sources.pdf` reads one into sections through
# pdfminer.six (MIT), which gives text with the font it was set in -- how a heading is found in a
# PDF with no outline -- and the position of every picture; Pillow renders the pictures. The
# reading runs in a bounded child process (`ml_stack.net.pdfread`).
pdf = ["pdfminer.six>=20260107", "pillow>=10.0"]
# MuPDF is AGPL-3.0 (or Artifex's commercial licence): a network service built on it must offer
# its source. It is NOT in `pdf`, `all` or `redteam`; install it only on purpose, and select it
# with ML_STACK_PDF_ENGINE=pymupdf. The datasheet pin tables and page pictures need it.
pdf-agpl = ["pymupdf>=1.24"]
# `ml-stack-bench animate`: a comparison of builds as an animated graphic
viz = ["manim>=0.19"]
# `ml-stack-serve fit --plot` draws two panels to a png/svg. Only this needs it: the bench's
# own --plot writes hand-built SVG with no library, so it opens on a machine with no packages
plot = ["matplotlib>=3.11.2"]
testing = ["numpy>=1.24", "pytest>=9.1.1"]
telemetry = ["metal-smi>=1.1.0; sys_platform == 'darwin'"]
# `ml-stack-mcp` speaks the protocol itself over stdio; with the SDK installed it uses that.
# `ml_stack.agent.McpTools` is an MCP client on the same SDK (2026-07-28 revision).
mcp = ["mcp>=2.3,<3"]
# NVIDIA NeMo Guardrails as one more rail over the built-in ones (`ml_stack.guard.nemo`); its
# rails call the llama.cpp server a configuration names. The built-in rails need no extra.
guardrails = ["nemoguardrails>=0.24.1,<0.25"]
# a prompt-injection classifier run on the CPU through onnxruntime (`ml_stack.guard.classifier`);
# the ONNX export of protectai/deberta-v3-base-prompt-injection-v2 is fetched once
guard-model = ["onnxruntime>=1.20", "tokenizers>=0.21", "numpy>=1.24", "huggingface_hub>=1.32"]
# `ml-stack-bench standard`: GSM8K, MMLU-Pro, IFEval and HumanEval through lm-evaluation-harness;
# `ifeval` brings langdetect, immutabledict and nltk
standard = ["lm-eval[ifeval]>=0.4"]
# `python -m ml_stack.redteam`: attacks on this library's own model-facing surfaces, sent through
# PyRIT: about 110 packages and 550 MB, installed in a virtualenv of its own.
redteam = ["ml-stack[web,pdf,testing]", "pyrit>=1.1,<2"]
all = [
    "ml-stack[train,gguf,graph,store,scrape,vision,pdf,testing,telemetry,plot,fleet-tls,fleet-onboard]",
]

[project.urls]
Homepage = "https://github.com/adammikulis/ml-stack"
Repository = "https://github.com/adammikulis/ml-stack"
Changelog = "https://github.com/adammikulis/ml-stack/blob/main/CHANGELOG.md"

[project.scripts]
# Every command this package installs starts with `ml-stack`, so `compgen -c ml-stack` (or a
# tab) lists the whole toolkit. That is not tidiness for its own sake: an agent that cannot
# enumerate these writes the command again by hand, which is how searching the Hub, timing a
# question set and picking a free port each got done twice before becoming commands.
#
# `ml-stack <command>` runs any `ml-stack-<command>` below; bare, it starts the daemon and
# opens the browser on it (`ml_stack.fleet.launch`).
ml-stack = "ml_stack.cli:main"
ml-stack-traind = "ml_stack.fleet.daemon:main"
ml-stack-peers = "ml_stack.fleet.peers:main"
# one command makes this machine a peer: checks, llama-server, passphrase, daemon, announce
ml-stack-fleet = "ml_stack.fleet.join:main"
# the same functions the commands call, as MCP tools over stdio, for an agent to drive
ml-stack-mcp = "ml_stack.mcp:main"
ml-stack-train-run = "ml_stack.train.run:main"
# a project's tools -> synthetic conversations -> a fine-tuned caller -> a GGUF
ml-stack-train-tools = "ml_stack.train.tools:main"
# choose one of a named set of options and say how sure: ask, score, calibrate, compare
ml-stack-decide = "ml_stack.decide_cli:main"
# a pointer-head decision model fine-tuned from labelled cases
ml-stack-train-decider = "ml_stack.train.decider:main"
# what this machine can do, and what it does without being asked; --checkouts adds the
# repositories and working state ml-stack-doctor checks on their own
ml-stack-setup = "ml_stack.setup:main"
ml-stack-doctor = "ml_stack.doctor:main"
# tokens and keys: set, list, unset; read from a prompt or stdin, kept in a 0600 file or the keychain
ml-stack-credentials = "ml_stack.credentials.cli:command"
# what this machine can hear and say: transcribe a file, say a line, find the speech in it
ml-stack-speech = "ml_stack.speech.cli:main"
ml-stack-serve = "ml_stack.serve.cli:main"
# what a change to the asking costs, and whether it was worth it
ml-stack-bench = "ml_stack.bench.run:main"
# find a model newer than anything the assistant remembers, and print how to serve it
ml-stack-models = "ml_stack.serve.models_cli:run"
ml-stack-store = "ml_stack.graph.store_cli:main"
# an invented organised group -- company, community, university, open-source, nonprofit --
# as a graph with people who could talk, and questions about it with known answers
ml-stack-world = "ml_stack.world.cli:main"
# documents read section by section into one graph, with what each cost
ml-stack-ingest = "ml_stack.ingest:main"
# the long commands this machine has recorded: what is running, waiting on one, stopping it
ml-stack-jobs = "ml_stack.jobs:main"
# agents coordinating: messages, notes, scratch folders and claims, all data and no authority
ml-stack-workspace = "ml_stack.workspace.cli:main"
ml-stack-suite = "ml_stack.train.suite:main"
ml-stack-claude = "ml_stack.claude:main"
ml-stack-agent = "ml_stack.harness:main"
# a rendered graph page served on loopback, with the model behind it
ml-stack-graph = "ml_stack.graph.serve:main"
# a task in words: a served model asks what is open, plans, asks go, then runs the commands
ml-stack-do = "ml_stack.do:main"
# what a draft head is worth for one model: no head, then the head at each depth
ml-stack-draft = "ml_stack.draft:main"
ml-stack-help = "ml_stack.cli:help_main"
# every command's --help and every safe command's output, written down to be diffed
ml-stack-surface = "ml_stack.surface.cli:main"
# every tracked file read for a person's details, reported and never blocked
ml-stack-audit = "ml_stack.redact.audit:main"
# open a page, click through its screens, screenshot each one and read what came back
ml-stack-walk = "ml_stack.walk.cli:main"
# what sentinel has seen and holds: events, quarantine, pins, the log's hash chain; and what
# came in from the internet: downloads, hosts, scanners
ml-stack-security = "ml_stack.net.cli:command"

# What the daemon reports about this box beyond what the standard library can see: the
# card, its vendor and its memory. Without it every machine reports no accelerator.
[project.entry-points."ml_stack.device_report"]
accelerator = "ml_stack.train.accelerator:report"

[tool.hatch.build.targets.sdist]
exclude = [".claude", "CLAUDE.md", "HANDOFF.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/ml_stack"]

# The contracts are ONE file on disk (repo-root `contracts/`), pulled into the wheel at
# build time. No copy is kept in the source tree, so there is nothing to drift.
[tool.hatch.build.targets.wheel.force-include]
"contracts" = "ml_stack/contracts/_data"
"patches" = "ml_stack/serve/_patches"

[tool.pytest.ini_options]
testpaths = ["tests"]
# how many workers is the broker's to say, so several suites at once do not each take every
# core (`tests/conftest.py`); `-n` on the command line is meant and is left alone, and `-n 0`
# runs them in one process when a failure needs a clean order
addopts = "--strict-markers"
# `slow` is a browser, a subprocess, a wheel build or a real network wait -- anything that
# costs more than about two seconds every time it runs, rather than once per worker.
# `-m "not slow"` is the subset to run while a bench has the GPU; the default runs everything.
markers = [
    "slow: needs a browser, a subprocess, a wheel build or a network timeout; left out unless --slow is given",
    "redteam: needs the redteam extra (PyRIT); left out unless --redteam is given",
    "live_api: calls a paid or quota-limited remote API; runs only when ML_STACK_LIVE_API=1",
    "live_net: reaches a public endpoint; runs only when ML_STACK_LIVE_NET=1",
    "heavy: runs in the default tier and costs seconds a test; `scripts/test fast` leaves it out",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# python with no .py on it: ruff matches by extension unless the name is spelled out
extend-include = ["scripts/budgets", "scripts/hooks/budgets",
                  "scripts/hooks/claude-bash-guard", "scripts/hooks/claude-edit-guard"]

[tool.ruff.lint]
select = [
    "B",       # bugbear
    "BLE",     # blind except
    "C4",      # comprehensions
    "E4", "E7", "E9",  # pycodestyle, ruff's own default
    "ERA",     # commented-out code
    "F",       # pyflakes, ruff's own default
    "I",       # import sorting
    "PLR0913", # too many arguments
    "PLR0915", # too many statements
    "PTH",     # os.path where pathlib reads better
    "RUF",     # ruff's own, including RUF100 for a noqa that suppresses nothing
    # T20 is scripts/gates/print_calls.py, which exempts the console-script modules
    "S",       # bandit
    "SIM",     # simplifications
    "UP",      # syntax the minimum Python already has
]
# S603 and S607 fire on every subprocess call and every argv[0] without a full path.
ignore = ["S603", "S607"]

[tool.ruff.lint.isort]
# The pre-commit gate lints a temporary tree holding only the staged files, where ml_stack
# is not on any path; without this it reads as third-party and every import block moves.
known-first-party = ["ml_stack"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # assert is what a test is written in
    "S105",  # invented credentials in fixtures
    "S106",
    "S107",
    "S108",  # /tmp paths in fixtures
    "S311",  # a seeded generator makes a fixture repeat
]
"src/ml_stack/decide/guards/*.py" = [
    "S104",  # the benchmark's tool calls are the dangerous strings it labels
    "S108",
]
"scripts/hooks/**" = [
    "BLE001",  # a guard that fails must let the command through, not block on its own error
]

# Checks that read the source alone. A check that reads a type out of an installed package
# counts differently on every machine.
[tool.pyright]
include = ["src/ml_stack"]
typeCheckingMode = "off"
reportAssertAlwaysTrue = "error"
reportInvalidStringEscapeSequence = "error"
reportNoOverloadImplementation = "error"
reportSelfClsParameterName = "error"
reportUnboundVariable = "error"
reportUndefinedVariable = "error"
reportUnsupportedDunderAll = "error"
reportUnusedCoroutine = "error"
reportUnusedExcept = "error"
