[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-stack"
version = "0.1.7"  # x-release-please-version
description = "Train and run models across every machine on your network."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "a member" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

# Nothing here is needed to find the other machines and pass work between them.
# Each extra is what one part of ml_stack needs to do its own job.
[tool.setuptools.package-data]
"ml_stack.graph" = ["web/*.html", "web/*.json"]

[project.optional-dependencies]
privacy = ["presidio-analyzer>=2.2", "spacy>=3.7"]
test = ["pytest>=8", "pytest-xdist>=3.5"]
app = ["pywebview>=5.0"]
arrays = ["numpy>=1.24"]
torch = ["torch>=2.2"]
mlx = ["mlx>=0.20"]
train = ["numpy>=1.24", "safetensors>=0.4"]
serve = ["psutil>=5.9"]
gguf = ["gguf>=0.10", "numpy>=1.24"]
graph = ["numpy>=1.24"]
# an embedded property graph: one directory on disk, native Cypher, no server
store = ["ladybug>=0.18"]
# a browser that remembers who you are; needs `playwright install chromium` too
scrape = ["playwright>=1.40"]
# searching the web beside the graph: ddgs is keyless and rate-limited, SearXNG is not
web = ["ddgs>=9", "trafilatura>=2"]
vision = ["numpy>=1.24", "pillow>=10.0"]
testing = ["numpy>=1.24", "pytest>=7"]
telemetry = ["darwin-perf>=0.1; sys_platform == 'darwin'"]
all = [
    "ml-stack[app,train,serve,gguf,graph,store,scrape,vision,testing,telemetry]",
]

[project.urls]
Homepage = "https://github.com/adammikulis/ml-stack"
Repository = "https://github.com/adammikulis/ml-stack"
Changelog = "https://github.com/adammikulis/ml-stack/blob/main/CHANGELOG.md"

[project.scripts]
# Every command this package installs starts with `ml-stack`, so `compgen -c ml-stack` (or a
# tab) lists the whole toolkit. That is not tidiness for its own sake: an agent that cannot
# enumerate these writes the command again by hand, which is how searching the Hub, timing a
# question set and picking a free port each got done twice before becoming commands.
#
# The one people double-click: starts the daemon and opens the browser on it.
ml-stack = "ml_stack.fleet.launch:main"
ml-stack-app = "ml_stack.fleet.app:main"
ml-stack-traind = "ml_stack.fleet.daemon:main"
ml-stack-peers = "ml_stack.fleet.peers:main"
ml-stack-train-run = "ml_stack.train.run:main"
# a project's tools -> synthetic conversations -> a fine-tuned caller -> a GGUF
ml-stack-train-tools = "ml_stack.train.tools:main"
# what this machine can do, and what it does without being asked
ml-stack-setup = "ml_stack.setup:main"
ml-stack-doctor = "ml_stack.doctor:main"
ml-stack-serve = "ml_stack.serve.cli:main"
# what a change to the asking costs, and whether it was worth it
ml-stack-bench = "ml_stack.graph.bench:main"
# find a model newer than anything the assistant remembers, and print how to serve it
ml-stack-models = "ml_stack.hub:main"
ml-stack-store = "ml_stack.graph.store_cli:main"
# an invented organised group -- company, community, university, open-source, nonprofit --
# as a graph with people who could talk, and questions about it with known answers
ml-stack-world = "ml_stack.world.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_stack"]

# The contracts are ONE file on disk (repo-root `contracts/`), pulled into the wheel at
# build time. No copy is kept in the source tree, so there is nothing to drift.
[tool.hatch.build.targets.wheel.force-include]
"contracts" = "ml_stack/contracts/_data"

[tool.pytest.ini_options]
testpaths = ["tests"]
# every core by default: 2054 tests took seven minutes serially (measured 2026-09-01);
# `-n 0` runs them in one process when a failure needs a clean order
addopts = "--strict-markers -n auto"
markers = ["slow: builds a wheel; skipped with -m 'not slow'"]

[tool.ruff]
line-length = 100
target-version = "py311"
