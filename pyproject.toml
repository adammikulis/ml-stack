# Workspace root. The installable packages are under packages/*; this file exists for
# the dev tooling only and is deliberately not a distribution.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["slow: builds a wheel; skipped with -m 'not slow'"]

[tool.ruff]
line-length = 100
target-version = "py311"
