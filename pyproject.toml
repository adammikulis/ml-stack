[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-stack"
version = "0.1.7"  # x-release-please-version
description = "Train and run models across every machine on your network."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "a member" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

# Nothing here is needed to find the other machines and pass work between them.
# Each extra is what one part of ml_stack needs to do its own job.
[tool.setuptools.package-data]
"ml_stack.graph" = ["web/*.html", "web/*.json"]

[project.optional-dependencies]
privacy = ["presidio-analyzer>=2.2", "spacy>=3.7"]
app = ["pywebview>=5.0"]
arrays = ["numpy>=1.24"]
torch = ["torch>=2.2"]
mlx = ["mlx>=0.20"]
train = ["numpy>=1.24", "safetensors>=0.4"]
serve = ["psutil>=5.9"]
gguf = ["gguf>=0.10", "numpy>=1.24"]
graph = ["numpy>=1.24"]
# an embedded property graph: one directory on disk, native Cypher, no server
store = ["ladybug>=0.18"]
# a browser that remembers who you are; needs `playwright install chromium` too
scrape = ["playwright>=1.40"]
vision = ["numpy>=1.24", "pillow>=10.0"]
testing = ["numpy>=1.24", "pytest>=7"]
telemetry = ["darwin-perf>=0.1; sys_platform == 'darwin'"]
all = [
    "ml-stack[app,train,serve,gguf,graph,store,scrape,vision,testing,telemetry]",
]

[project.urls]
Homepage = "https://github.com/adammikulis/ml-stack"
Repository = "https://github.com/adammikulis/ml-stack"
Changelog = "https://github.com/adammikulis/ml-stack/blob/main/CHANGELOG.md"

[project.scripts]
# The one people double-click: starts the daemon and opens the browser on it.
ml-stack = "ml_stack.fleet.launch:main"
ml-stack-app = "ml_stack.fleet.app:main"
ml-stack-traind = "ml_stack.fleet.daemon:main"
ml-stack-peers = "ml_stack.fleet.peers:main"
ml-stack-train-run = "ml_stack.train.run:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_stack"]

# The contracts are ONE file on disk (repo-root `contracts/`), pulled into the wheel at
# build time. No copy is kept in the source tree, so there is nothing to drift.
[tool.hatch.build.targets.wheel.force-include]
"contracts" = "ml_stack/contracts/_data"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["slow: builds a wheel; skipped with -m 'not slow'"]

[tool.ruff]
line-length = 100
target-version = "py311"
