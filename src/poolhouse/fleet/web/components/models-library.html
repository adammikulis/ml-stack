<style>
models-library{display:block;min-width:0}
models-library .library-heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:18px}
models-library .library-heading h2{font-size:21px;margin:0 0 6px}
models-library .library-heading p{margin:0;color:var(--muted);font-size:13px}
models-library .searchrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:0 0 24px}
models-library .searchrow>input{flex:1;min-width:160px;max-width:440px;padding:12px 16px;background:var(--bg-raised);border-radius:12px}
models-library .searchrow>label{margin:0;display:flex;align-items:center;gap:10px;font-size:12px}
models-library .searchrow>details{margin-left:auto;font-size:13px}
models-library .searchrow details[open]{flex-basis:100%;margin:0;padding:16px;background:var(--bg-raised);border:1px solid var(--line);border-radius:12px}
models-library .searchrow details label{display:inline-block;margin:12px 16px 0 0}
models-library .model-family{margin:24px 0}
models-library .model-family h3{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 12px}
models-library .model-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
models-library article{padding:22px;border:1px solid var(--line);border-radius:18px;background:var(--bg-raised);min-width:0;display:flex;flex-direction:column;gap:18px;position:relative}
models-library article[data-selected=true]{border-color:var(--poolhouse-orange);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 20%,transparent)}
models-library .model-card-heading{display:flex;gap:14px;align-items:start}
models-library .model-avatar{background:var(--poolhouse-orange,#ff8a3d);color:var(--poolhouse-orange-ink,var(--poolhouse-navy,#1b1f3a));border-radius:14px;width:46px;min-width:46px;height:46px;display:grid;place-items:center;font-size:19px;font-weight:750}
models-library .model-card-heading b{font-size:16px;line-height:1.4;overflow-wrap:anywhere;display:block}
models-library .model-card-heading small{display:block;color:var(--muted);font-size:12px;margin-top:4px;overflow-wrap:anywhere}
models-library .model-chips{display:flex;gap:6px;flex-wrap:wrap}
models-library .model-chips span{font-size:11px;padding:5px 8px;border-radius:6px;background:var(--bg-sunken);font-weight:650}
models-library .model-chips .model-running{background:color-mix(in srgb,var(--good) 16%,var(--bg-raised));color:var(--text)}
models-library .model-card-actions{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
models-library .model-card-actions button{border-radius:10px;padding:10px 14px;font-weight:650}
models-library .model-card-actions button:first-child:not(.ghost){background:var(--poolhouse-orange);color:var(--poolhouse-orange-ink,var(--poolhouse-navy,#1b1f3a));border-color:transparent}
models-library article details{font-size:12px;padding-top:14px;border-top:1px solid var(--line)}
models-library article summary{color:var(--muted);cursor:pointer}
models-library details code{display:block;overflow-wrap:anywhere;font-size:11px;padding:10px;border-radius:8px;background:var(--bg-sunken)}
models-library details .row{gap:8px;flex-wrap:wrap}
models-library .library-empty{padding:40px 24px;text-align:center;border:1px dashed var(--line);background:var(--bg-raised);border-radius:18px}
models-library .library-empty h3{font-size:20px;margin:0 0 8px}
</style>
<script>
(function(){const M=window.fleetModel,E=M.el;
class ModelsLibrary extends HTMLElement{
 connectedCallback(){
  if(this.wired)return;this.wired=true;this.filters={};
  this.append(E('div',{class:'library-heading'},E('div',{},E('h2',{},'Installed models'),E('p',{},'Ready when you are. Serve locally, then open a conversation.'))));
  const controls=E('div',{class:'searchrow'});this.append(controls);
  this.search=E('input',{type:'search',placeholder:'Search installed models','aria-label':'Search installed models',oninput:()=>this.draw()});controls.append(this.search);
  for(const field of ['family','format','quantization','kind','status']){
   const label={quantization:'Quantization',kind:'Capability'}[field]||field[0].toUpperCase()+field.slice(1);
   const select=E('select',{'aria-label':label,onchange:()=>this.draw()});this.filters[field]=select;
   const advanced=this.advancedFilters||(this.advancedFilters=E('details',{'data-advanced':'',class:'aside'},E('summary',{},'Advanced library filters')));if(!advanced.isConnected)controls.append(advanced);advanced.append(E('label',{},label,select));
  }
  this.sort=E('select',{'aria-label':'Sort installed models',onchange:()=>this.draw()},
   E('option',{value:'name'},'Name'),E('option',{value:'size'},'Size · largest first'),E('option',{value:'recent'},'Recently installed'));
  controls.append(E('label',{},'Sort',this.sort));this.rows=E('div');this.append(this.rows);this.rows.append(E('p',{class:'model-loading',role:'status'},'Loading your installed models…'));
 }
 update(models,run,serve,halt){
  this.models=models;this.run=run;this.serve=serve;this.halt=halt;const key=JSON.stringify([models,run]);if(key===this.inventoryKey)return;this.inventoryKey=key;
  for(const [field,select] of Object.entries(this.filters)){
   const selected=select.value,values=[...new Set(models.map(row=>this.status(row,field)))].filter(Boolean).sort();
   select.replaceChildren(E('option',{value:''},'All'),...values.map(value=>E('option',{value},value)));
   select.value=values.includes(selected)?selected:'';
  }this.draw();
 }
 selectModel(value){this.target=value;for(const select of Object.values(this.filters))select.value='';this.search.value=value.name||value.path?.split('/').pop()||'';this.draw();}
 server(row){return (this.run.running||[]).find(server=>(server.models||[]).some(name=>name===row.path||name===row.path.split(/[\\/]/).pop()));}
 status(row,field){return field==='status'&&this.server(row)?'running':row[field];}
 draw(){
  if(!this.models)return;
  const search=this.search.value.trim().toLowerCase();
  const rows=this.models.filter(row=>(!search||[row.name,row.repo,row.family,row.quantization].join(' ').toLowerCase().includes(search))&&
   Object.entries(this.filters).every(([field,select])=>!select.value||this.status(row,field)===select.value));
  rows.sort((a,b)=>this.sort.value==='size'?b.size_bytes-a.size_bytes:this.sort.value==='recent'?b.mtime-a.mtime:a.name.localeCompare(b.name));
  const families=new Map();for(const row of rows){if(!families.has(row.family))families.set(row.family,[]);families.get(row.family).push(row);}
  this.rows.replaceChildren(...[...families].map(([family,models])=>E('section',{'data-family':family,class:'model-family'},E('h3',{},family),E('div',{class:'model-grid'},...models.map(row=>this.entry(row))))));
  if(!rows.length)this.rows.append(E('div',{class:'library-empty'},E('h3',{},this.models.length?'No matches':'Start your model library'),E('p',{class:'hint'},this.models.length?'No installed models match these filters.':'Add a model from Hugging Face or copy one from a device in your Pool.'),...(this.models.length?[]:[E('button',{onclick:()=>this.closest('models-view').querySelector('#add-model').click()},'Add your first model')])));
 }
 entry(row){
  const server=this.server(row),status=server?'running':row.status;
  const selected=this.target&&(this.target.path===row.path||this.target.id===row.id||this.target.name===row.name);
  const details=E('details',{'data-advanced':''},E('summary',{},'Files and model details'),E('p',{class:'why'},
   `${row.shards} shard${row.shards===1?'':'s'} expected · ${row.is_complete?'complete':'incomplete'} · ${M.fileSize(row.size_bytes)} total`),
   E('code',{},row.path),E('ul',{},...(row.files||[]).map(file=>E('li',{},file.name+' · '+M.fileSize(file.size_bytes)))));
  details.append(E('p',{class:'why'},[row.architecture,row.parameters?`${(row.parameters/1e9).toFixed(2)}B parameters`:'',row.context_length?`Context length: ${row.context_length.toLocaleString()} tokens`:'',row.source,row.repo].filter(Boolean).join(' · ')));
  if(row.companion)details.append(E('p',{},'Vision projector: '+row.companion.name));
  const components=E('div',{},E('button',{class:'ghost small',onclick:async()=>{
   components.replaceChildren(E('p',{},'Checking optional components…'));
   try{
    const result=await M.api('/ui/models/addons?name='+encodeURIComponent(row.path));
    if(result.error)throw new Error(result.error);
    components.replaceChildren(...(result.components||[]).map(component=>{
     const label=component.kind==='mtp'?'Multi-token prediction':'Vision';
     const status=component.status==='available'?M.fileSize(component.download_bytes)+' download':component.status;
     const line=E('div',{class:'row'},E('span',{},label+' · '+status));
     if(component.status==='available')line.append(E('button',{class:'ghost small',onclick:async()=>{
      if(line.dataset.pending)return;line.dataset.pending='true';line.querySelector('button').disabled=true;try{const installed=await M.api('/ui/models/addons',{method:'POST',body:JSON.stringify({name:row.path,kind:component.kind})});
      if(installed.error)throw Error(installed.error);line.replaceChildren(E('p',{role:'status'},'Download started. Progress appears in Downloads.'));}catch(error){line.append(E('p',{class:'err',role:'status'},error.message));line.querySelector('button').disabled=false;}finally{delete line.dataset.pending;}
     }},'Install '+label));
     if(component.error)line.append(E('span',{class:'why'},component.error));
     return line;
    }));
   }catch(error){components.replaceChildren(E('p',{class:'err'},error.message));}
  }},'Optional MTP and vision components'));
  if(row.servable)details.append(components);
  if(row.copies?.length)details.append(E('p',{},'Other copies: '+row.copies.join(', ')));
  const invoke=async(button,fn)=>{if(button.disabled)return;button.disabled=true;try{await fn();}catch(error){button.closest('article').append(E('p',{class:'err',role:'status'},error.message));}finally{button.disabled=false;}};
  const action=server?E('button',{class:'ghost small',onclick:event=>invoke(event.currentTarget,()=>this.halt(server.port))},'Stop server'):
   E('button',{class:'small',...(!row.servable||!this.run.can_serve?{disabled:'true'}:{}),onclick:event=>invoke(event.currentTarget,()=>this.serve(row.path,row.name))},'Serve model');
  const owner=this.closest('models-view');
  const chat=E('button',{class:'small',onclick:()=>owner.openChat((server.models||[]).find(name=>[row.path,row.path.split(/[\\/]/).pop()].includes(name)))},'Open chat');
  const heading=E('div',{class:'model-card-heading'},E('div',{class:'model-avatar','aria-hidden':'true'},(row.family||'M').slice(0,2).toUpperCase()),E('div',{},E('b',{},row.name),E('small',{},row.repo||row.architecture||row.family)));
  const chips=E('div',{class:'model-chips'},...[row.format.toUpperCase(),row.quantization,row.kind,M.fileSize(row.size_bytes)].filter(Boolean).map(value=>E('span',{},value)),E('span',{class:server?'model-running':''},server?'● Running':status));
  return E('article',{'data-model':row.id,'data-selected':String(!!selected),...(selected?{tabindex:'-1','aria-label':'Selected model '+row.name}:{})},heading,chips,E('div',{class:'model-card-actions'},...(server?[chat,action]:[action])),...(!row.servable?[E('p',{class:'hint'},'This model needs a compatible runtime before it can be served.')]:[]),details);
 }
}customElements.define('models-library',ModelsLibrary);})();
</script>
