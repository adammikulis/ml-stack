<template><div class="workspace-card" id="recordings-panel"><h2>Recorded trajectories and labels</h2><p class="intro">Review authoritative observations and assign native actions before exporting decision training data. Unreviewed steps stay out of the dataset.</p></div></template>
<script>
(function () {
  const M = window.fleetModel, W = window.workspaceModel, E = M.el;
  class GymRecordings extends HTMLElement {
    connectedCallback() {
      if (this.wired) return;
      this.wired = true;
      const box = this.querySelector('#recordings-panel');
      this.recording = W.field(box, 'Recorded session', 'select');
      this.steps = W.field(box, 'Recorded transition', 'select');
      this.label = W.field(box, 'Reviewed native action', 'select');
      this.output = W.field(box, 'Export dataset path', 'input', { placeholder: 'datasets/gym-reviewed.jsonl' });
      this.note = E('p', { class: 'status', role: 'status' });
      box.append(E('div', { class: 'workspace-actions' },
        W.button('Refresh recordings', () => this.load()),
        W.button('Open recording', () => { this.offset = 0; this.read(); }),
        W.button('Previous 100 steps', () => { this.offset = Math.max(0, (this.offset || 0) - 100); this.read(); }),
        W.button('Next 100 steps', () => { this.offset = (this.offset || 0) + 100; this.read(); }),
        W.button('Save reviewed label', () => this.review()),
        W.button('Skip uncertain step', () => {
          this.steps.selectedIndex = Math.min(this.steps.options.length - 1, this.steps.selectedIndex + 1);
          this.show();
        }), W.button('Export reviewed dataset', () => this.export())), this.note);
      this.recording.addEventListener('change', () => { this.offset = 0; this.read(); });
      this.steps.addEventListener('change', () => this.show());
      M.onRoute(route => { if (route === 'gym') this.load(); });
    }

    async load() {
      try {
        const result = await W.api('/ui/gym/recordings');
        const selected = this.recording.value;
        this.recording.replaceChildren(...result.recordings.map(row =>
          E('option', { value: row.id }, row.id + ' · ' + M.fileSize(row.bytes))));
        if (selected) this.recording.value = selected;
        this.note.textContent = result.recordings.length ? 'Choose a recording to review.' : 'Run a session to create a trajectory recording.';
      } catch (error) { W.status(this.note, error); }
    }

    async read() {
      try {
        const result = await W.api('/ui/gym/recordings/' + this.recording.value + '?offset=' + (this.offset || 0));
        this.rows = result.steps;
        this.steps.replaceChildren(...this.rows.map((row, index) => E('option', { value: index },
          `Trajectory ${row.episode_id} · step ${row.sequence} · reward ${row.reward.toFixed(3)}${row.label ? ' · reviewed' : ''}`)));
        this.note.textContent = this.rows.length + ' transitions on this page.';
        if (this.rows.length) await this.show();
      } catch (error) { W.status(this.note, error); }
    }

    async show() {
      try {
        const row = this.rows[Number(this.steps.value)];
        if (!row) return;
        this.label.replaceChildren(E('option', { value: '' }, 'Choose a reviewed action'),
          ...row.actions.map(action => E('option', { value: action }, action)));
        this.label.value = row.label || '';
        const snapshot = await W.api('/ui/gym/recordings/' + this.recording.value + '/frame?sequence=' + row.sequence);
        const gym = this.closest('gym-view');
        if (gym.session) await gym.control('pause');
        gym.replaying = true;
        gym.draw(snapshot, false);
        gym.note.textContent = 'Reviewing recording ' + this.recording.value + ' · step ' + row.sequence;
      } catch (error) { W.status(this.note, error); }
    }

    async review() {
      try {
        const row = this.rows[Number(this.steps.value)];
        if (!row || !this.label.value) throw Error('Choose a transition and native action label.');
        await W.post('/ui/gym/recordings/' + this.recording.value + '/review',
          { episode_id: row.episode_id, sequence: row.sequence, label: this.label.value });
        row.label = this.label.value;
        this.note.textContent = 'Reviewed label saved.';
      } catch (error) { W.status(this.note, error); }
    }

    async export() {
      try {
        const result = await W.post('/ui/gym/recordings/' + this.recording.value + '/export', { path: this.output.value });
        sessionStorage.setItem('poolhouse-dataset', result.path);
        this.note.replaceChildren(E('span', {}, `${result.cases} reviewed cases exported to ${result.path}. `),
          W.button('Fine-tune decision model', () => {
            M.go('training');
            const training = document.querySelector('training-view');
            training.mode.value = 'decider';
            training.buildOptions();
            training.data.value = result.path;
          }));
      } catch (error) { W.status(this.note, error); }
    }
  }
  customElements.define('gym-recordings', GymRecordings);
})();
</script>
