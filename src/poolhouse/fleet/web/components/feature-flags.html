<!-- feature-flags: the experimental features with their stage, risk and state; changed by `poolhouse features` -->
<style>
feature-flags { display: block; }
feature-flags ul { list-style: none; margin: 8px 0; padding: 0; }
feature-flags li { margin: 10px 0; }
feature-flags .stage { text-transform: uppercase; font-size: 0.75em; margin-left: 8px; }
</style>
<script>
(function () {
  const { el, api } = window.fleetModel;
  class FeatureFlags extends HTMLElement {
    connectedCallback() {
      if (this.wired) return;
      this.wired = true;
      this.load();
    }

    async load() {
      const r = await api("/ui/features");
      if (r.error || !r.features) { this.replaceChildren(el("div", { class: "err" }, r.error || "Features are unavailable.")); return; }
      this.replaceChildren(
        el("p", { class: "hint" }, "Each is off until turned on at a terminal: poolhouse features enable NAME."),
        el("ul", {}, ...r.features.map((f) => el("li", { "data-feature": f.name },
          el("strong", {}, f.name), el("span", { class: "stage" }, f.stage), " ",
          el("span", { class: f.enabled ? "ok" : "hint" }, f.enabled ? "on" : "off"),
          el("div", {}, f.about), el("div", { class: "hint" }, "Risk: " + f.risk)))));
    }
  }
  customElements.define("feature-flags", FeatureFlags);
})();
</script>
