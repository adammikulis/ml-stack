<!-- settings-view: what this machine does, what it can train with, and taking it off again -->
<style>
settings-view .settings-toolbar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:0 0 24px; }
settings-view .settings-toolbar button { width:auto; margin:0; }
settings-view #settings-note { margin-top:12px; min-height:24px; }
settings-view #settings-libs .library-kind { display:inline-block; font-size:11px; border:1px solid var(--line); border-radius:20px; padding:2px 8px; margin:4px 0; }
settings-view #settings-libs { scroll-margin-top:20px; }
settings-view [aria-busy="true"] { opacity:.8; }
</style>
<template>
  <main id="settings" hidden>
    <h1>Settings</h1>
    <p class="sub" id="settings-sub"></p>
    <div class="settings-toolbar">
      <button class="ghost" id="settings-open-libraries" type="button">Libraries &amp; simulators</button>
      <span class="hint">Install capabilities once and reuse them across launches.</span>
    </div>
    <div class="two">
      <div id="settings-left"></div>
      <div id="settings-right">
        <div class="group" id="settings-chatting"></div>
        <div class="group" id="settings-updates"></div>
        <div id="settings-when"></div>
      </div>
    </div>
    <button id="settings-save">Save</button>
    <div class="group" id="settings-credentials"></div>
    <div class="group" id="settings-wired">
      <h2>GPU memory</h2>
      <wired-memory></wired-memory>
    </div>
    <details class="aside" id="settings-advanced">
      <summary>Advanced options: runtimes and maintenance</summary>
      <div class="group" id="settings-libs"></div>
      <div class="group" id="settings-again"></div>
      <div class="group" id="settings-removal"></div>
    </details>
    <div id="settings-note" role="status" aria-live="polite"></div>
  </main>
</template>
<script>
(function () {
  const M = window.fleetModel;
  const el = M.el;
  const api = M.api;
  const fileSize = M.fileSize;

  class SettingsView extends HTMLElement {
    connectedCallback() {
      if (this.wired) return;
      this.wired = true;
      this.box = this.querySelector("#settings");
      this.note = this.querySelector("#settings-note");
      this.save = this.querySelector("#settings-save");
      this.save.onclick = () => this.apply();
      this.querySelector("#settings-open-libraries").onclick = () => {
        this.querySelector("#settings-advanced").open = true;
        this.querySelector("#settings-libs").scrollIntoView({behavior:"smooth", block:"start"});
      };
      M.onRoute((route) => {
        const on = route === "settings";
        this.box.hidden = !on;
        if (on) this.loadSettings();
      });
    }

    loadSettings() {
      this.draw().catch(error => {
        this.note.replaceChildren(el("div", {class:"err"}, error.message),
          el("button", {class:"ghost small", onclick:() => this.loadSettings()}, "Retry loading settings"));
      });
    }

    radio(group, value, label, why) {
      const id = `${group}-${value}`;
      const input = el("input", { type: "radio", name: group, id,
                                  ...(this.pick[group] === value ? { checked: "1" } : {}) });
      input.onchange = () => { this.pick[group] = value; };
      return el("label", { class: "opt", for: id }, input, M.row(label, why));
    }

    check(key, label, why) {
      const input = el("input", { type: "checkbox", id: key,
                                  ...(this.pick[key] ? { checked: "1" } : {}) });
      input.onchange = () => { this.pick[key] = input.checked; };
      return el("label", { class: "opt", for: key }, input, M.row(label, why));
    }

    async draw() {
      this.save.disabled = true;
      this.note.textContent = "Loading preferences…";
      const s = await api("/ui/settings");
      if (M.refused(s)) return;
      if (!s.ok) throw Error(s.error || "Could not load preferences.");
      const cur = s.settings || {};
      M.group = s.group || "";
      this.pick = {
        labels: (cur.labels || []).join(","),
        autostart: (s.autostart || {}).mode || cur.autostart || "manual",
        on_paused: cur.on_paused || "stop",
        on_close: cur.on_close || "",
        auto_update: cur.auto_update !== false,
        autodownload_models: cur.autodownload_models !== false,
        download_sources: cur.download_sources || "",
        context: cur.context || 8192,
      };
      this.querySelector("#settings-sub").textContent =
        `${s.name}${s.machine?.gpu ? " — " + s.machine.gpu : ""}`;
      const nav = document.querySelector("fleet-nav");
      if (nav && nav.paint) nav.paint("settings");

      this.querySelector("#settings-left").replaceChildren(
        el("div", { class: "group" },
          el("h2", {}, "What this machine does"),
          this.radio("labels", "train", "Train models", ""),
          this.radio("labels", "prep", "Prepare data", ""),
          this.radio("labels", "train,prep", "Both", "")),
        el("div", { class: "group" },
          el("h2", {}, "Starting up"),
          this.radio("autostart", "login", "When I log in", ""),
          this.radio("autostart", "boot", "When the computer starts",
            "your computer will ask for your password"),
          this.radio("autostart", "manual", "Only when I open it", "")));

      this.querySelector("#settings-chatting").replaceChildren(
        el("h2", {}, "Model defaults"),
        el("h3", {}, "Download sources"),
        this.radio("download_sources", "internet", "Internet only", "Skip LAN model transfers."),
        this.radio("download_sources", "lan", "LAN only", "No Internet fallback for models or MTP heads."),
        this.radio("download_sources", "both", "Both", "Try your cluster first, then the Internet."),
        M.contextPicker(cur.context || 8192, (n) => { this.pick.context = n; }));

      const status = el("div", { class: "hint", style: "margin-top:10px" },
        el("span", { class: "spin" }), " Checking for updates…");
      this.querySelector("#settings-updates").replaceChildren(
        el("h2", {}, "Updates"),
        el("div", { class: "hint" }, `You have version ${s.version || "?"}.`),
        this.check("autodownload_models", "Get models automatically",
          "using the download sources selected above"),
        this.check("auto_update", "Download and install updates automatically",
          "checked once a day, put on when no job is running, and it restarts itself"),
        status);

      this.querySelector("#settings-when").replaceChildren(...M.kids(
        el("div", { class: "group" },
          el("h2", {}, "When you need the machine"),
          this.radio("on_paused", "stop", "Pausing stops what is running",
            "the run picks up from its last checkpoint"),
          this.radio("on_paused", "finish", "Pausing lets the current job finish", "")),
        el("div", { class: "group" },
          el("h2", {}, "Closing the window"),
          this.radio("on_close", "", "Ask me each time", ""),
          this.radio("on_close", "background", "Keep running in the background",
            "stays in the cluster"),
          this.radio("on_close", "quit", "Quit", "leaves the cluster")),
        (s.schedule?.windows || []).length
          ? el("div", { class: "group" },
              el("h2", {}, "Not available"),
              ...s.schedule.windows.map((w) =>
                el("div", { class: "label", style: "display:block;margin-bottom:4px" }, w)))
          : null));

      this.querySelector("#settings-again").replaceChildren(
        el("h2", {}, "Set this machine up again"),
        el("div", { class: "hint" },
          "Walks through naming it and choosing a passphrase, as it did the first time. "
          + "The clusters it is already in are left alone."),
        el("button", { class: "ghost small",
          onclick: () => M.go("first-run") }, "Run setup again"));

      this.save.disabled = false;
      this.note.replaceChildren();
      this.drawLibraries().catch(error => this.libraryError(error));
      this.drawCredentials().catch(error => {
        this.querySelector("#settings-credentials").replaceChildren(
          el("h2", {}, "API credentials"), el("div", {class:"err"}, error.message));
      });
      this.drawUpdates(status).catch(() => { status.textContent = "Could not check for updates right now."; });
      this.drawRemoval().catch(error => {
        this.querySelector("#settings-removal").replaceChildren(el("h2", {}, "Remove ml-stack"),
          el("div", {class:"err"}, error.message));
      });
    }

    async drawCredentials() {
      const target = this.querySelector("#settings-credentials");
      const result = await api("/ui/credentials");
      if (M.refused(result)) return;
      if (!result.ok) throw Error(result.error || "Could not load API credentials.");
      const rows = result.credentials || [];
      const name = el("input", {type:"text", autocomplete:"off", maxlength:"64", placeholder:"HF_TOKEN, ANTHROPIC_API_KEY, OPENAI_API_KEY"});
      const value = el("input", {type:"password", autocomplete:"new-password", placeholder:"Paste a token or API key"});
      const listed = el("div", {class:"hint"}, rows.length
        ? rows.map(row => `${row.name} · ${row.present ? row.source : "not set"}`).join("\n")
        : "No saved credentials.");
      const note = el("div", {role:"status", "aria-live":"polite"});
      const save = el("button", {class:"ghost small", type:"button"}, "Save credential");
      const remove = el("button", {class:"ghost small", type:"button"}, "Remove credential");
      save.onclick = async () => {
        save.disabled = true;
        try {
          const saved = await api("/ui/credentials", {method:"POST", body:JSON.stringify({name:name.value, value:value.value})});
          if (!saved.ok) throw Error(saved.error || "Could not save credential.");
          value.value = "";
          note.textContent = `${saved.saved} saved. The value is not shown again.`;
          await this.drawCredentials();
        } catch (error) { note.textContent = error.message; }
        finally { save.disabled = false; }
      };
      remove.onclick = async () => {
        remove.disabled = true;
        try {
          const deleted = await api("/ui/credentials", {method:"DELETE", body:JSON.stringify({name:name.value})});
          if (!deleted.ok) throw Error(deleted.error || "Could not remove credential.");
          note.textContent = deleted.removed ? `${deleted.name} removed.` : `${name.value} was not saved here.`;
          value.value = "";
          await this.drawCredentials();
        } catch (error) { note.textContent = error.message; }
        finally { remove.disabled = false; }
      };
      target.replaceChildren(el("h2", {}, "API credentials"),
        el("div", {class:"hint"}, "Save multiple named tokens or API keys for Hugging Face, Claude, Codex, and other providers. Values are stored locally and never displayed."),
        listed, el("label", {}, "Credential name", name), el("label", {}, "Token or API key", value),
        el("div", {class:"settings-toolbar"}, save, remove), note);
    }

    async apply() {
      this.save.disabled = true;
      this.save.textContent = "Saving…";
      this.box.setAttribute("aria-busy", "true");
      try {
        const result = await api("/ui/settings", {method:"POST", body:JSON.stringify({
          ...this.pick, labels:this.pick.labels ? this.pick.labels.split(",") : []})});
        if (!result.ok) throw Error(result.error || "Could not save preferences.");
        this.note.replaceChildren(result.manual
          ? el("div", {}, el("div", {class:"err"}, result.manual_why || "Needs permission."),
              el("pre", {class:"cmd"}, result.manual))
          : el("div", {class:"ok"}, "Preferences saved."));
      } catch (error) { this.note.replaceChildren(el("div", {class:"err"}, error.message)); }
      finally {
        this.save.disabled = false;
        this.save.textContent = "Save";
        this.box.setAttribute("aria-busy", "false");
      }
    }

    libraryError(error) {
      this.querySelector("#settings-libs").replaceChildren(el("h2", {}, "Libraries & simulators"),
        el("div", {class:"err", role:"status"}, error.message),
        el("button", {class:"ghost small", onclick:() => this.drawLibraries().catch(error => this.libraryError(error))}, "Retry"));
    }

    async drawLibraries() {
      const libs = this.querySelector("#settings-libs");
      libs.hidden = false;
      libs.replaceChildren(
        el("h2", {}, "Libraries & simulators"),
        el("div", { class: "hint" }, el("span", { class: "spin" }), " Looking…"));
      const L = await api("/ui/libraries");
      if (!L.ok) {
        libs.replaceChildren(el("h2", {}, "Libraries & simulators"),
          el("div", {class:"err", role:"status"}, L.error || "Could not load installed libraries."),
          el("button", {class:"ghost small", onclick:() => this.drawLibraries().catch(error => this.libraryError(error))}, "Retry"));
        return;
      }
      const want = new Set((L.libraries || []).filter((x) => x.installed).map((x) => x.name));
      const boxes = (L.libraries || []).map((lib) => {
        const input = el("input", { type: "checkbox", id: `lib-${lib.name}`,
                                    ...(lib.installed ? { checked: "1" } : {}) });
        input.onchange = () => {
          if (input.checked) want.add(lib.name); else want.delete(lib.name);
        };
        return el("label", { class: "opt", for: `lib-${lib.name}` }, input,
          el("span", {},
            el("b", {}, lib.title),
            el("span", {class:"library-kind"}, lib.installed ? "Installed" : "Available to install"),
            el("span", { class: "why" },
              `${lib.blurb} · ${lib.size_mb >= 1000
                ? (lib.size_mb / 1000).toFixed(1) + " GB" : lib.size_mb + " MB"}`
              + (lib.version ? ` · version ${lib.version}` : "")
              + (lib.python_version ? ` · Python ${lib.python_version}` : ""))));
      });

      const apply = el("button", { class: "ghost" }, "Apply library changes");
      const out = el("div", {role:"status", "aria-live":"polite"});
      apply.onclick = async () => {
        const before = new Set((L.libraries || []).filter((x) => x.installed).map((x) => x.name));
        const install = [...want].filter((n) => !before.has(n));
        const remove = [...before].filter((n) => !want.has(n));
        if (!install.length && !remove.length) {
          out.replaceChildren(el("div", { class: "hint" }, "Nothing to change."));
          return;
        }
        apply.disabled = true;
        apply.textContent = "Installing libraries…";
        for (const box of libs.querySelectorAll("input")) box.disabled = true;
        try {
          const result = await api("/ui/libraries", {method:"POST", body:JSON.stringify({install, remove})});
          if (!result.ok) throw Error(result.error || "Could not change installed libraries.");
          const watch = async () => {
            const changed = await M.followSetupJob(result.job, job => {
              out.replaceChildren(el("div", {class:"hint", role:"status"}, `${job.state}: ${job.note}`));
            });
            const failed = Object.entries(changed.changed || {}).filter(([, value]) => !value.ok);
            if (failed.length) throw Error(failed.map(([name, value]) => `${name}: ${value.error}`).join("; "));
            await this.drawLibraries();
            libs.append(el("div", {class:"ok", role:"status"}, "Library changes applied. Installed simulators are ready to reopen."));
          };
          watch().catch(error => out.replaceChildren(el("div", {class:"err", role:"status"}, error.message)));
        } catch (error) { out.replaceChildren(el("div", {class:"err"}, error.message)); }
        finally {
          apply.disabled = false; apply.textContent = "Apply library changes";
          for (const box of libs.querySelectorAll("input")) box.disabled = false;
        }
      };

      libs.replaceChildren(
        el("h2", {}, "Libraries & simulators"),
        el("div", { class: "hint" },
          (L.libraries || []).some(lib => lib.installed)
            ? "Installed in managed environments. Uncheck a library to remove it; shared dependencies are retained."
            : "Choose the capabilities you need. Simulator runtimes are remembered after installation."),
        ...boxes, apply, out);
    }

    async drawUpdates(status) {
      const u = await api("/ui/updates");
      if (!u.checked) {
        status.replaceChildren(document.createTextNode(
          "Could not check for updates right now."));
        return;
      }
      if (!u.known) {
        status.replaceChildren(document.createTextNode(
          "This copy does not say which version it is, so it will not update itself. "
          + `The newest is ${u.latest}.`));
        return;
      }
      if (!u.newer) {
        status.replaceChildren(document.createTextNode("This is the newest version."));
        return;
      }
      const go = el("button", {}, `Update to ${u.latest}`);
      go.onclick = async () => {
        go.disabled = true;
        go.innerHTML = '<span class="spin"></span> Downloading…';
        const r = await api("/ui/updates/install", { method: "POST" });
        status.replaceChildren(r.ok
          ? el("div", { class: "ok" },
              !r.installed ? "Already up to date."
                : r.restarting ? `Updated to ${r.version}. Starting it now…`
                : `Updated to ${r.version}. Open it again to use it.`)
          : el("div", { class: "err" }, r.error || "Could not install the update."));
      };
      status.replaceChildren(
        el("div", {}, `Version ${u.latest} is available`
          + (u.size ? ` (${(u.size / 1e6).toFixed(0)} MB)` : "") + "."),
        go);
    }

    async drawRemoval() {
      const removal = this.querySelector("#settings-removal");
      removal.replaceChildren(
        el("h2", {}, "Remove ml-stack"),
        el("div", { class: "hint" }, "Loading what is on this machine…"));
      const u = await api("/ui/uninstall");
      if (u.error) {
        removal.replaceChildren(el("h2", {}, "Remove ml-stack"),
          el("div", { class: "err" }, u.error));
        return;
      }
      const want = {};
      for (const it of u.items || []) want[it.key] = it.default;
      const boxes = (u.items || []).map((it) => {
        const box = el("input", { type: "checkbox", id: `rm_${it.key}`,
                                  ...(it.default ? { checked: "1" } : {}) });
        box.onchange = () => { want[it.key] = box.checked; };
        return el("label", { class: "opt", for: `rm_${it.key}` }, box,
          M.row(`${it.name} — ${fileSize(it.bytes)}`, it.why));
      });
      const out = el("div");
      const go = el("button", { class: "danger" }, "Remove");
      let armed = false;
      go.onclick = async () => {
        const chosen = Object.keys(want).filter((k) => want[k]);
        if (!armed) {
          armed = true;
          go.textContent = `Remove ${chosen.length} of these — click again`;
          out.replaceChildren(el("div", { class: "hint" }, "This cannot be undone."));
          return;
        }
        go.disabled = true;
        const r = await api("/ui/uninstall", { method: "POST",
          body: JSON.stringify({ remove: chosen }) });
        out.replaceChildren(...M.kids(
          el("div", { class: "ok" },
            `Removed ${(r.removed || []).length} of ${chosen.length}, freeing `
            + `${fileSize(r.freed || 0)}.`),
          r.app ? el("div", { class: "hint" },
            `Drag ${r.app} to the bin to finish.`) : null,
          Object.keys(r.failed || {}).length
            ? el("div", { class: "err" }, Object.values(r.failed).join("; "))
            : null));
      };
      removal.replaceChildren(
        el("h2", {}, "Remove ml-stack"),
        el("div", { class: "hint" },
          "Ticked items go. Your models and your own files are left unless you say "
          + "otherwise."),
        ...boxes, go, out);
    }
  }
  customElements.define("settings-view", SettingsView);
})();
</script>
