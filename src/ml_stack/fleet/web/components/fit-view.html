<!-- fit-view: the frame the three fit screens share, and "what fits" itself -->
<style>
  fit-model, fit-charts, rates-view, telemetry-view { display: contents; }

  fit-view header.fit-top {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    background: var(--bg-raised); position: sticky; top: 0; z-index: 20;
  }
  fit-view header.fit-top h1 { font-size: 17px; margin: 0; letter-spacing: -.01em; }
  fit-view header.fit-top .machine { color: var(--muted); font-family: var(--mono); font-size: 12px; }
  fit-view header.fit-top .spacer { flex: 1; }
  fit-view nav.views { display: flex; gap: 2px; }
  fit-view nav.views button {
    background: none; border: 0; border-bottom: 2px solid transparent; cursor: pointer;
    color: var(--muted); font: inherit; font-size: 13px; padding: 3px 10px 5px;
  }
  fit-view nav.views button.on { color: var(--text); border-bottom-color: var(--accent); }
  fit-view .wrap { max-width: 1500px; margin: 0 auto; padding: 0 20px 60px; width: 100%; }
  fit-view svg .point { stroke: var(--bg-raised); stroke-width: 1.2; }
  fit-view svg .front { fill: none; stroke: var(--good); stroke-width: 1.4; stroke-dasharray: 4 3; }
  fit-view table.fit td.mark { color: var(--good); }

  fit-view .controls {
    display: grid; gap: 18px 26px; padding: 16px 0 18px;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    border-bottom: 1px solid var(--line);
  }
  fit-view .ctl { min-width: 0; }
  fit-view .ctl > label.cap, fit-view .ctl > div.cap {
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
    font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted);
    margin-bottom: 5px;
  }
  fit-view .ctl .cap b { font-size: 13px; text-transform: none; letter-spacing: 0;
                color: var(--text); font-family: var(--mono); }
  fit-view .ctl input[type=range] { width: 100%; accent-color: var(--accent); }
  fit-view .ctl .pair { display: flex; gap: 6px; align-items: center; }
  fit-view .ctl select, fit-view .ctl input[type=number] {
    background: var(--bg-sunken); color: var(--text); border: 1px solid var(--line-bright);
    border-radius: 7px; padding: 5px 7px; font: inherit; min-width: 0; flex: 1;
  }
  fit-view .ctl .hint { color: var(--dim); font-size: 11px; margin-top: 4px; }
  fit-view .wide { grid-column: 1 / -1; }

  fit-view .models { display: flex; flex-wrap: wrap; gap: 4px 14px; }
  fit-view .models label {
    display: flex; align-items: center; gap: 6px; cursor: pointer;
    font-family: var(--mono); font-size: 12px; white-space: nowrap;
    margin: 0; color: var(--text);
  }
  fit-view .models label.off { opacity: .4; }
  fit-view .models input { accent-color: var(--accent); }
  fit-view i.sw { width: 11px; height: 11px; border-radius: 3px; display: inline-block; flex: none; }

  fit-view .toggle { display: flex; border: 1px solid var(--line-bright);
            border-radius: 7px; overflow: hidden; }
  fit-view .toggle button {
    flex: 1; background: var(--bg-sunken); color: var(--muted); border: 0;
    padding: 6px 8px; font: inherit; cursor: pointer; white-space: nowrap;
  }
  fit-view .toggle button.on { background: var(--accent-dim); color: var(--text); }

  fit-view table.fit { width: 100%; border-collapse: collapse; margin-top: 22px; font-size: 13px; }
  fit-view table.fit th, fit-view table.fit td { padding: 7px 10px; text-align: right;
                               border-bottom: 1px solid var(--line); }
  fit-view table.fit th { color: var(--muted); font-size: 11px; text-transform: uppercase;
                 letter-spacing: .06em; font-weight: 600; }
  fit-view table.fit th:first-child, fit-view table.fit td:first-child { text-align: left; }
  fit-view table.fit td { font-family: var(--mono); }
  fit-view table.fit tbody tr.hot { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  fit-view table.fit tbody tr.nofit td { color: var(--dim); }
  fit-view table.fit td.name { display: flex; align-items: center; gap: 7px; font-size: 12px; }
  fit-view table.fit .bad { color: var(--bad); }
  fit-view .stats { display: grid; gap: 12px; margin-top: 18px;
           grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  fit-view .stat { background: var(--bg-raised); border: 1px solid var(--line); border-radius: 9px;
          padding: 10px 12px; display: block; }
  fit-view .stat .cap { color: var(--muted); font-size: 11px; text-transform: uppercase;
               letter-spacing: .07em; }
  fit-view .stat .big { font-family: var(--mono); font-size: 19px; margin-top: 3px; }
  fit-view .stat .sub { color: var(--dim); font-size: 11px; margin-top: 2px; }
  fit-view .ctl button.go {
    background: var(--bg-sunken); color: var(--text); border: 1px solid var(--line-bright);
    border-radius: 7px; padding: 5px 12px; font: inherit; cursor: pointer;
  }
  fit-view .ctl input[type=text] {
    background: var(--bg-sunken); color: var(--text); border: 1px solid var(--line-bright);
    border-radius: 7px; padding: 5px 7px; font: inherit; width: 100%;
  }
  fit-view .note { color: var(--dim); font-size: 12px; margin-top: 14px; max-width: 82ch; }
  fit-view .empty { color: var(--muted); padding: 40px 0; }
</style>
<template>
  <div id="fit" hidden>
    <fit-model></fit-model>
    <fit-charts></fit-charts>
    <header class="fit-top">
      <h1 id="fit-heading">What fits</h1>
      <nav class="views" id="fit-views"></nav>
      <span class="machine" id="fit-machine"></span>
      <span class="spacer"></span>
    </header>
    <div class="wrap">
      <div class="controls" id="fit-controls"></div>
      <rates-view></rates-view>
      <telemetry-view></telemetry-view>
      <div id="fit-body"></div>
    </div>
  </div>
</template>
<script>
(function () {
  const M = window.fleetModel;
  const FM = window.fitModel;
  const el = M.el;
  const { GB, human, kTokens, commas, shortName, COLOURS } = FM;

  class FitView extends HTMLElement {
    connectedCallback() {
      if (this.wired) return;
      this.wired = true;
      this.box = this.querySelector("#fit");
      this.heading = this.querySelector("#fit-heading");
      this.ownControls = this.querySelector("#fit-controls");
      this.body = this.querySelector("#fit-body");
      this.ref = {};
      this.state = {
        records: [], room: 0, machineRoom: 0, name: "", steps: [], ladder: [],
        vram: [], ctx: 32768, users: 8, cacheType: "", drafted: "either",
        on: new Set(), hot: null, zoom: null,
      };
      this.buildViews();

      // painted once a view is actually ready to show, never before: a nav click that
      // still has to fetch leaves the old screen up until the new one can replace it whole
      FM.paintChrome = (view) => {
        for (const b of this.ref.viewButtons) b.classList.toggle("on", b.dataset.key === view);
        this.heading.textContent = FM.VIEWS.find(([k]) => k === view)[1];
        this.ownControls.hidden = view !== "fit";
        document.getElementById("rate-controls").hidden = view !== "rates";
        document.getElementById("tele-controls").hidden = view !== "telemetry";
      };

      FM.onView((view) => {
        if (view === "fit" && this.ready) this.draw();
      });

      M.onRoute((route) => {
        const on = route === "fit";
        this.box.hidden = !on;
        if (!on) return;
        if (this.ready) { if (FM.view === "fit") this.draw(); }
        else this.start();
      });
    }

    buildViews() {
      this.ref.viewButtons = FM.VIEWS.map(([key, said]) => {
        const b = el("button", { onclick: () => FM.showView(key) }, said);
        b.dataset.key = key;
        return b;
      });
      this.querySelector("#fit-views").replaceChildren(...this.ref.viewButtons);
    }

    async start() {
      try {
        await this.load();
      } catch (e) {
        this.body.replaceChildren(el("p", { class: "empty" },
          `Could not read the measurements: ${e.message}`));
        return;
      }
      this.ready = true;
      this.querySelector("#fit-machine").textContent =
        `${this.state.name} · ${human(this.state.machineRoom)} of room · `
        + `${this.state.records.length} measured`;
      this.buildControls();
      if (FM.view === "fit") this.draw();
    }

    // ------------------------------------------------------------------ the measurements
    //
    // Every number the fit view draws is worked out by `ml_stack.serve.fit` and read off
    // this route: what a model costs loaded, what one more user costs, how many fit at each
    // context on the ladder, and the longest context this many could each be given.

    async load() {
      const s = this.state;
      const r = await fetch(`/ui/fit.json?room=${s.room || 0}&users=${s.users}`,
                            { headers: M.headers });
      const got = await r.json();
      if (!r.ok) throw new Error(got.error || `the route answered ${r.status}`);
      const first = !s.records.length;
      s.records = (got.records || []).map((f, i) =>
        ({ ...f, i, colour: COLOURS[i % COLOURS.length] }));
      s.machineRoom = Number(got.room) || 0;
      s.room = Number(got.at_room) || 0;
      s.name = got.name || "this machine";
      s.vram = got.vram_gb || [];
      s.steps = got.steps || [];
      s.ladder = got.ladder || [];
      if (first) for (const f of s.records) s.on.add(f.i);
    }

    /** Where a context sits on the ladder the slots were worked out at. */
    rung(ctx) {
      const s = this.state;
      const step = Math.round(8 * Math.log2(Math.max(1, ctx) / s.ladder[0]));
      return Math.max(0, Math.min(s.ladder.length - 1, step));
    }

    /** How many users fit at that context, and the context it was answered for. */
    slots(f, ctx) { return f.slots[this.rung(ctx)]; }
    each(f, ctx) { return f.costs[this.rung(ctx)]; }
    read(ctx) { return this.state.ladder[this.rung(ctx)]; }

    /** Ask again for the room and head count the controls now stand at. */
    refresh() {
      clearTimeout(this.pending);
      this.pending = setTimeout(async () => {
        await this.load();
        this.draw();
      }, 80);
    }

    /** Every record the checkboxes, the cache select and the drafted toggle leave standing. */
    visible() {
      const s = this.state;
      return s.records.filter((f) => {
        if (!s.on.has(f.i)) return false;
        if (s.cacheType && f.cache_type !== s.cacheType) return false;
        if (s.drafted === "yes" && !f.spec) return false;
        if (s.drafted === "no" && f.spec) return false;
        return true;
      });
    }

    cacheTypes() { return [...new Set(this.state.records.map((f) => f.cache_type))].sort(); }

    /** Whether some model was measured both with a head and without, which is the only case
        where the toggle is worth showing. */
    draftedBothWays() {
      const bare = new Set(), drafted = new Set();
      for (const f of this.state.records) {
        (f.spec ? drafted : bare).add(f.model + "|" + f.cache_type);
      }
      return [...drafted].some((k) => bare.has(k));
    }

    // ------------------------------------------------------------------ the table
    table(rows) {
      const s = this.state;
      const body = el("tbody", {});
      for (const f of rows) {
        const fits = this.slots(f, s.ctx);
        const long = f.longest;
        const tr = el("tr", { class: fits ? "" : "nofit",
          onmouseenter: () => { s.hot = f.i; FM.charts.paintHot(this); },
          onmouseleave: () => { s.hot = null; FM.charts.paintHot(this); } },
          el("td", { class: "name" },
             el("i", { class: "sw", style: `background:${f.colour}` }), shortName(f)),
          el("td", {}, (f.loaded / GB).toFixed(2)),
          el("td", {}, (this.each(f, s.ctx) / GB).toFixed(3)),
          el("td", { class: fits ? "" : "bad" }, fits ? commas(fits) : "does not fit"),
          el("td", { class: long ? "" : "bad" }, long ? commas(long) : "does not fit"),
          el("td", {}, f.cache_type + (f.spec ? " +draft" : "")));
        tr.dataset.i = f.i;
        body.append(tr);
      }
      return el("table", { class: "fit" },
        el("thead", {}, el("tr", {},
          el("th", {}, "model"),
          el("th", {}, "loaded (GB)"),
          el("th", {}, `GB per user @ ${kTokens(s.ctx)}`),
          el("th", {}, "users that fit"),
          el("th", {}, `longest for ${commas(s.users)} (tokens)`),
          el("th", {}, "cache"))),
        body);
    }

    // ------------------------------------------------------------------ the controls
    //
    // Built once and left alone: a control rebuilt on every redraw loses the drag that is
    // moving it, and the whole page is a thing you drag.
    buildControls() {
      const s = this.state, ref = this.ref;
      const box = this.ownControls;

      ref.roomSaid = el("b", {});
      ref.roomPick = el("select", { onchange: (e) => {
        s.room = e.target.value === "machine" ? s.machineRoom : Number(e.target.value) * GB;
        s.zoom = null;
        ref.roomFree.value = (s.room / GB).toFixed(0);
        this.refresh();
      } });
      if (s.machineRoom) {
        ref.roomPick.append(el("option", { value: "machine" },
                               `${s.name} · ${human(s.machineRoom)}`));
      }
      for (const g of s.vram) ref.roomPick.append(el("option", { value: String(g) }, `${g} GB`));
      ref.roomPick.value = s.machineRoom ? "machine" : String(s.vram[0]);
      ref.roomFree = el("input", { type: "number", min: "1", max: "4096", step: "1",
        value: (s.room / GB).toFixed(0), oninput: (e) => {
          const g = Number(e.target.value);
          if (g > 0) { s.room = g * GB; s.zoom = null; this.refresh(); }
        } });
      box.append(el("div", { class: "ctl" },
        el("div", { class: "cap" }, el("span", {}, "room"), ref.roomSaid),
        el("div", { class: "pair" }, ref.roomPick, ref.roomFree),
        el("div", { class: "hint" },
           "what a model may actually use here — not the installed RAM")));

      ref.ctxSaid = el("b", {});
      ref.ctxSlider = el("input", { type: "range", min: "0", max: String(s.steps.length - 1),
        value: String(Math.max(0, s.steps.indexOf(s.ctx))),
        oninput: (e) => { s.ctx = s.steps[Number(e.target.value)]; s.zoom = null; this.draw(); } });
      box.append(el("div", { class: "ctl" },
        el("div", { class: "cap" }, el("span", {}, "context each user gets"), ref.ctxSaid),
        ref.ctxSlider,
        el("div", { class: "hint" }, "1k to 256k, doubling — a question with its tools, "
                                     + "up to a whole conversation kept open")));

      ref.usersSaid = el("b", {});
      ref.usersSlider = el("input", { type: "range", min: "1", max: "64",
        value: String(s.users),
        oninput: (e) => { s.users = Number(e.target.value); this.refresh(); } });
      box.append(el("div", { class: "ctl" },
        el("div", { class: "cap" }, el("span", {}, "users"), ref.usersSaid),
        ref.usersSlider,
        el("div", { class: "hint" }, "the last column answers the question the other way "
                                     + "round: the longest context this many could each be given")));

      const kinds = this.cacheTypes();
      if (kinds.length > 1) {
        const sel = el("select", { onchange: (e) => { s.cacheType = e.target.value; this.draw(); } },
          el("option", { value: "" }, "every cache type"),
          ...kinds.map((k) => el("option", { value: k }, k)));
        box.append(el("div", { class: "ctl" },
          el("div", { class: "cap" }, el("span", {}, "kv cache stored as")),
          el("div", { class: "pair" }, sel),
          el("div", { class: "hint" }, "what changes the per-token cost")));
      }

      if (this.draftedBothWays()) {
        ref.draftButtons = [];
        const mk = (key, said) => {
          const b = el("button", { onclick: () => { s.drafted = key; this.draw(); } }, said);
          b.dataset.key = key;
          ref.draftButtons.push(b);
          return b;
        };
        box.append(el("div", { class: "ctl" },
          el("div", { class: "cap" }, el("span", {}, "guessing ahead")),
          el("div", { class: "toggle" }, mk("either", "either"), mk("no", "no head"),
                                         mk("yes", "with a head")),
          el("div", { class: "hint" }, "a draft model keeps its own cache at the same "
                                       + "context, which is the real cost of serving one")));
      }

      ref.modelLabels = [];
      const boxes = el("div", { class: "models" }, ...s.records.map((f) => {
        const cb = el("input", { type: "checkbox", onchange: (e) => {
          if (e.target.checked) s.on.add(f.i); else s.on.delete(f.i);
          this.draw();
        } });
        cb.checked = true;
        const label = el("label", {
          onmouseenter: () => { s.hot = f.i; FM.charts.paintHot(this); },
          onmouseleave: () => { s.hot = null; FM.charts.paintHot(this); } },
          cb, el("i", { class: "sw", style: `background:${f.colour}` }), shortName(f));
        ref.modelLabels.push([f, label]);
        return label;
      }));
      box.append(el("div", { class: "ctl wide" },
        el("div", { class: "cap" }, el("span", {}, "models measured")), boxes));
    }

    /** What the controls say, after the state moved. Values, never structure. */
    paintControls() {
      const s = this.state, ref = this.ref;
      ref.roomSaid.textContent = human(s.room);
      ref.ctxSaid.textContent = `${kTokens(s.ctx)} tokens`;
      ref.usersSaid.textContent = commas(s.users);
      // the users slider reaches as far as the most generous model actually fits, so
      // dragging it never runs off into a range where every answer is "does not fit"
      const most = Math.max(1, ...this.visible().map((f) => this.slots(f, s.ctx)));
      const ceiling = Math.max(8, Math.min(1024, most));
      ref.usersSlider.max = String(ceiling);
      if (s.users > ceiling) { s.users = ceiling; ref.usersSlider.value = String(ceiling); }
      for (const b of (ref.draftButtons || [])) {
        b.classList.toggle("on", b.dataset.key === s.drafted);
      }
      for (const [f, label] of (ref.modelLabels || [])) {
        label.classList.toggle("off", !s.on.has(f.i));
      }
    }

    // ------------------------------------------------------------------ drawing it
    draw() {
      const s = this.state;
      FM.paintChrome("fit");
      s.hot = null;
      this.paintControls();
      const rows = this.visible();
      if (!rows.length) {
        this.body.replaceChildren(el("p", { class: "empty" },
          "Nothing to draw. Tick a model above, or measure one: "
          + "ml-stack-serve fit MODEL --measure"));
        return;
      }
      const tipA = el("div", { class: "tip" }), tipB = el("div", { class: "tip" });

      const a = el("div", { class: "panel" },
        el("h2", {}, "How many fit, and at what context"),
        el("div", { class: "sub" },
           `at ${human(s.room)} of room · both scales logarithmic · `
           + "the dashed line is where the context slider stands"));
      a.append(FM.charts.fits(this, rows, tipA), tipA);

      const b = el("div", { class: "panel" },
        el("div", { class: "zoomhint" }, "drag or wheel to zoom · double-click to reset"),
        el("h2", {}, "What it costs as they arrive"),
        el("div", { class: "sub" },
           `each user gets ${commas(s.ctx)} tokens · where a line leaves the red room line `
           + "is the last user that machine holds"));
      b.append(FM.charts.cost(this, rows, tipB), tipB);

      this.body.replaceChildren(
        el("div", { class: "panels" }, a, b),
        this.table(rows),
        el("p", { class: "note" },
          "Measured at load, never estimated: every record is what llama.cpp said it "
          + "allocated, read off its own log at -lv 4, and every answer here is worked out "
          + "by the same code the command prints. A line's intercept is the weights plus "
          + "the compute buffers — the part that does not grow — and its slope is one "
          + "user's cache. A heavy model with a cheap cache overtakes a light one with a "
          + "fat cache somewhere, and that crossing is the whole reason the second panel "
          + "is drawn from zero users."));
      FM.charts.paintHot(this);
    }
  }
  customElements.define("fit-view", FitView);
})();
</script>
