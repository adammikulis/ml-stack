<template><section class="workspace" hidden><h1>Benchmarks</h1><p class="intro">Measure models through the fleet and inspect recorded results.</p><div class="workspace-grid"><div class="workspace-card" id="config"></div><div class="workspace-card"><h2>Measurement status</h2><p id="summary" role="status">Loading measurement status…</p><details class="aside"><summary>Measurement details</summary><pre id="status"></pre></details><details class="aside"><summary>Run history</summary><pre id="history"></pre></details><workspace-jobs></workspace-jobs></div></div></section></template>
<script>
(function(){const M=window.fleetModel,W=window.workspaceModel,E=M.el;
class BenchmarksView extends HTMLElement{
 connectedCallback(){if(this.wired)return;this.wired=true;this.host=this.querySelector('section');const b=this.querySelector('#config');b.append(E('h2',{},'New measurement sweep'));this.models=W.field(b,'Models (one per line)','textarea');this.sample=W.field(b,'Questions per task (0 uses defaults)','input',{type:'number',min:'0',value:'0'});this.label=W.field(b,'Run label','input',{placeholder:'comparison'});const advanced=E('details',{class:'aside'},E('summary',{},'Advanced options'));b.append(advanced);this.extra=W.field(advanced,'Additional arguments as JSON array','textarea');this.extra.value='[]';this.note=E('p',{class:'status',role:'status'});this.preview=E('pre');this.previewDetails=E('details',{class:'aside'},E('summary',{},'Command preview'),this.preview);b.append(E('div',{class:'workspace-actions'},W.button('Review command',()=>this.start(true)),W.button('Start sweep',()=>this.start(false)),W.button('Stop sweep',()=>this.stop())),this.note,this.previewDetails,E('div',{class:'workspace-actions'},W.button('Accuracy and cost charts',()=>{M.go('fit');window.fitModel?.showView?.('rates');}),W.button('Capacity planner',()=>M.go('fit'))));W.route(this.host,'benchmarks',()=>this.load());this.timer=setInterval(()=>{if(!this.host.hidden)this.load();},4000);}
 disconnectedCallback(){clearInterval(this.timer);}
 async load(){try{const results=await Promise.allSettled([W.api('/ui/bench/status'),W.api('/ui/bench/history')]);if(results[0].status==='fulfilled'){this.state=results[0].value;this.querySelector('#status').textContent=W.json(this.state);this.querySelector('#summary').textContent=this.state.available===false?this.state.text:this.state.measuring?'A benchmark is running.':'No benchmark is running.';}else this.querySelector('#summary').textContent=results[0].reason.message;if(results[1].status==='fulfilled')this.querySelector('#history').textContent=W.json(results[1].value.history);else this.querySelector('#history').textContent=results[1].reason.message;}catch(e){W.status(this.note,e);}}
 async start(dry_run){try{const r=await W.post('/ui/bench/sweep',{models:this.models.value.split('\n').filter(Boolean),sample:Number(this.sample.value),label:this.label.value,extra:JSON.parse(this.extra.value),dry_run});this.preview.textContent=r.command||W.json(r);this.previewDetails.open=true;this.note.textContent=dry_run?'Command reviewed.':'Sweep started.';this.load();}catch(e){W.status(this.note,e);}}
 async stop(){try{const pid=this.state?.measuring?.pid;if(!pid)throw Error('No running sweep PID is reported.');await W.post('/ui/bench/stop',{pid});this.load();}catch(e){W.status(this.note,e);}}
}customElements.define('benchmarks-view',BenchmarksView);})();
</script>
