<template><section class="workspace" hidden><h1>Tools</h1><p class="intro">Decision models and specialist workflows. Commands run as monitored daemon jobs.</p><div class="workspace-grid"><div class="workspace-card" id="decision"></div><div class="workspace-card"><workspace-jobs></workspace-jobs></div></div><h2>Specialist command library</h2><input id="search" type="search" aria-label="Search tools" placeholder="Search graph, speech, ingest, security, workspace…"><div class="cards" id="catalogue"></div><div class="workspace-card" id="runner"></div></section></template>
<script>
(function(){const M=window.fleetModel,W=window.workspaceModel,E=M.el;
class ToolsView extends HTMLElement{
 connectedCallback(){if(this.wired)return;this.wired=true;this.host=this.querySelector('section');const b=this.querySelector('#decision');b.append(E('h2',{},'Decision model lab'));this.mode=W.field(b,'Operation','select');['ask','list','eval','calibrate','bench','fetch'].forEach(x=>this.mode.append(E('option',{value:x},x)));this.state=W.field(b,'State / situation','textarea');this.question=W.field(b,'Question','input',{value:'Which action should be taken?'});this.choices=W.field(b,'Options, one per line','textarea');this.choices.value='stop\nproceed';this.cases=W.field(b,'Evaluation cases (JSONL path or guards)','input',{value:'guards'});this.output=W.field(b,'Calibration / evaluation output','input',{value:'decisions/report.json'});this.backend=W.field(b,'Decision backend','select');['pointer','logprob','embed','rules'].forEach(x=>this.backend.append(E('option',{value:x},x)));this.pointer=W.field(b,'Registered decider or checkpoint (blank uses Strands 2B)','input');this.extra=W.field(b,'Advanced backend arguments as JSON array','textarea');this.extra.value='[]';this.note=E('p',{class:'status',role:'status'});b.append(E('div',{class:'workspace-actions'},W.button('Run operation',()=>this.decide()),W.button('Fine-tune',()=>{M.go('training');const t=document.querySelector('training-view');t.mode.value='decider';t.buildOptions();t.data.value=this.cases.value;})),this.note);const r=this.querySelector('#runner');r.append(E('h2',{},'Run specialist command'));this.command=W.field(r,'Installed command','select');this.args=W.field(r,'Arguments as JSON array','textarea');this.args.value='["--help"]';this.preview=E('pre',{},'Choose a tool above to inspect its help.');r.append(E('div',{class:'workspace-actions'},W.button('Review',()=>this.run(true)),W.button('Run command',()=>this.run(false))),this.preview);this.querySelector('#search').addEventListener('input',()=>this.draw());W.route(this.host,'tools',()=>this.load());}
 async load(){try{const r=await W.api('/ui/workspace/commands');this.commands=r.commands;this.command.replaceChildren(...r.commands.map(c=>E('option',{value:c.name},c.name)));this.draw();}catch(e){W.status(this.note,e);}}
 draw(){const q=this.querySelector('#search').value.toLowerCase();this.querySelector('#catalogue').replaceChildren(...(this.commands||[]).filter(c=>(c.name+' '+c.entry).includes(q)).map(c=>E('article',{class:'workspace-card'},E('h3',{},c.name),E('p',{},c.description||'Inspect options and run this specialist workflow.'),W.button('Open help',async()=>{this.command.value=c.name;this.args.value='["--help"]';await this.run(false);this.querySelector('workspace-jobs').scrollIntoView({block:'nearest'});})))) ;}
 async run(preview){try{const args=JSON.parse(this.args.value);const r=await W.post('/ui/workspace/jobs',{command:this.command.value,args,preview});this.preview.textContent=r.command||`Queued ${r.id}`;if(!preview){this.querySelector('workspace-jobs').selected=r.id;this.querySelector('workspace-jobs').refresh();}}catch(e){W.status(this.note,e);}}
 async decide(){try{const op=this.mode.value;let args=[op];if(op==='ask'){args.push(this.question.value,'--state',this.state.value,'--json');for(const choice of this.choices.value.split('\n').filter(Boolean))args.push('--option',choice);}else if(['eval','calibrate','bench'].includes(op)){args.push(this.cases.value,'--out',this.output.value);}if(!['list','fetch'].includes(op)){args.push('--backend',this.backend.value);if(this.pointer.value)args.push('--pointer',this.pointer.value);args.push(...JSON.parse(this.extra.value));}const r=await W.launch('ml-stack-decide',args,'Decision '+op);this.note.textContent=`Queued ${r.id}`;this.querySelector('workspace-jobs').selected=r.id;this.querySelector('workspace-jobs').refresh();}catch(e){W.status(this.note,e);}}
}customElements.define('tools-view',ToolsView);})();
</script>
