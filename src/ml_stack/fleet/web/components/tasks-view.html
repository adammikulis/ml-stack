<style>
tasks-view { display:contents; }
tasks-view .workspace { padding:calc(28px * var(--ui-density,1)) calc(32px * var(--ui-density,1)); }
tasks-view .work-heading { display:flex; justify-content:space-between; gap:24px; align-items:center; margin-bottom:24px; }

tasks-view .task-row { display:block; width:100%; text-align:left; margin:0 0 10px; padding:calc(16px * var(--ui-density,1)) calc(12px * var(--ui-density,1)); background:var(--bg-raised); color:var(--text); border:1px solid var(--line); border-radius:10px; box-shadow:0 2px 5px #1b1f3a05; }
tasks-view .task-row[aria-pressed=true] { border-color:var(--poolside-yellow-ink,var(--poolside-navy)); box-shadow:0 0 0 1px var(--poolside-navy); }

tasks-view .task-row .task-state { display:inline-block; margin-top:12px; font-size:0.714rem; background:var(--poolside-yellow); color:var(--poolside-yellow-ink,var(--poolside-navy)); padding:calc(3px * var(--ui-density,1)) calc(7px * var(--ui-density,1)); border-radius:5px; }
tasks-view .task-detail { background:var(--bg-raised); border:1px solid var(--line); border-radius:16px; padding:calc(24px * var(--ui-density,1)); min-height:300px; }
tasks-view .task-detail h2 { margin-top:0; }
tasks-view dl { display:grid; grid-template-columns:110px minmax(0,1fr); gap:8px; font-size:0.857rem; }
tasks-view dt { color:var(--muted); } tasks-view dd { margin:0; overflow-wrap:anywhere; }
tasks-view .task-metrics { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:12px; }
tasks-view .task-project-bar { display:flex; align-items:end; gap:18px; margin-bottom:22px; }
tasks-view .task-project-bar label { margin:0; min-width:240px; }
tasks-view .task-project-bar select { display:block; width:100%; margin-top:7px; }
tasks-view .task-project-bar p { margin:0 0 8px; }
tasks-view .task-overview { display:grid; grid-template-columns:220px minmax(0,1fr); gap:20px; margin-bottom:24px; }
tasks-view .task-remaining { padding:calc(24px * var(--ui-density,1)); border-radius:16px; background:var(--poolside-yellow); color:var(--poolside-yellow-ink); display:flex; flex-direction:column; justify-content:center; }
tasks-view .task-remaining strong { font-size:3rem; line-height:1; margin-bottom:10px; }
tasks-view .task-remaining span { font-size:1.2rem; font-weight:650; }
tasks-view .task-remaining p { margin:12px 0 0; font-size:.85rem; }
tasks-view .task-context { display:grid; grid-template-columns:250px minmax(0,1fr); gap:20px; margin-bottom:24px; }

tasks-view .task-context h2 { margin:0 0 14px; font-size:1rem; }
tasks-view .task-eta-value { font-size:1.6rem; font-weight:700; }
tasks-view .task-worker-list { display:grid; gap:8px; }
tasks-view .task-worker-list button { display:flex; flex-direction:column; align-items:start; background:var(--bg-sunken); color:var(--text); border:1px solid var(--line); border-radius:9px; padding:calc(12px * var(--ui-density,1)); width:100%; text-align:left; margin:0; overflow-wrap:anywhere; }
tasks-view .task-worker-list small { color:var(--muted); margin-top:6px; }
tasks-view .task-dependencies { display:grid; gap:6px; }
tasks-view .task-checkpoint { border-left:3px solid var(--poolside-yellow); padding:8px 14px; margin:12px 0; }

tasks-view .task-checkpoint p { margin:6px 0; }
@media(max-width:1100px) { tasks-view .task-metrics { grid-template-columns:repeat(3,1fr); } }
@media(max-width:700px) { tasks-view .task-overview,tasks-view .task-context { grid-template-columns:1fr; } tasks-view .task-project-bar { flex-wrap:wrap; } }
tasks-view .task-metrics > div { padding:calc(16px * var(--ui-density,1)); background:var(--bg-raised); border:1px solid var(--line); border-radius:12px; font-size:0.857rem; }
tasks-view .task-metrics strong { display:block; font-size:1.786rem; margin-bottom:6px; }
tasks-view details { margin:14px 0; } tasks-view summary { cursor:pointer; }
tasks-view .task-composer { background:var(--bg-raised); border:1px solid var(--line); border-radius:12px; padding:calc(16px * var(--ui-density,1)); }
@media(max-width:1100px) { tasks-view .task-layout { grid-template-columns:1fr; } }
@media(max-width:650px) { tasks-view .workspace { padding:calc(20px * var(--ui-density,1)); } tasks-view .task-list { grid-template-columns:1fr; } tasks-view .task-column { min-height:0; } tasks-view .task-metrics { grid-template-columns:repeat(2,1fr); } tasks-view .work-mark { display:none; } tasks-view .task-controls { flex-wrap:wrap; } }
</style>
<template>
<section class="workspace" hidden>
<header class="work-heading"><h1>Tasks</h1></header>
<div class="task-project-bar"><label>Project workspace<select class="task-project" aria-label="Task project workspace"><option value="">Loading projects…</option></select></label><p class="hint task-authority"></p></div>
<div class="task-overview"><section class="task-remaining" aria-label="Remaining tasks"><strong class="task-remaining-number">—</strong><span>tasks remaining</span><p class="task-total">Choose a project workspace</p></section><div class="task-metrics"></div></div>
<div class="task-context"><article><h2>Estimated completion</h2><div class="task-eta-value">Unknown</div><p class="hint task-eta-reason">Waiting for project task data.</p></article><article><h2>Current workers</h2><div class="task-worker-list"><p class="hint">Choose a project to inspect worker assignments.</p></div></article></div>
<div class="task-controls"><input aria-label="Search tasks" placeholder="Search tasks"><select aria-label="Task status"><option value="">All statuses</option></select><button class="task-refresh">Refresh</button></div>
<p class="status" role="status"></p>
<details class="task-composer"><summary>＋ Create a task</summary><form class="task-create"><label>Title<input name="title" required maxlength="200"></label><label>Description<textarea name="description" maxlength="20000"></textarea></label><label>Acceptance criteria, one per line<textarea name="acceptance" required></textarea></label><button>Create task</button></form></details>
<div class="task-layout"><div class="task-list"></div><article class="workspace-card task-detail"><p>Select a task to inspect its evidence.</p></article></div>
</section>
</template>
<script>
(function(){
const M=window.fleetModel,W=window.workspaceModel,E=M.el;
class TasksView extends HTMLElement{
 connectedCallback(){if(this.wired)return;this.wired=true;this.host=this.querySelector('section');this.note=this.querySelector('.status');this.rows=[];this.selected='';
 this.search=this.querySelector('input[aria-label="Search tasks"]');this.filter=this.querySelector('select[aria-label="Task status"]');this.project=this.querySelector('.task-project');this.project.onchange=()=>{this.reloadAfterLoad=this.loading;this.selected='';this.rows=[];this.overview=null;this.loadError='';this.detailKey='';this.paint();this.load();};
 for(const state of ['queued','working','review','accepted','completed','blocked','rejected'])this.filter.append(E('option',{value:state},state));
 this.search.oninput=this.filter.onchange=()=>this.paint();this.querySelector('.task-refresh').onclick=()=>this.load();
 this.querySelector('form').onsubmit=async event=>{event.preventDefault();const form=event.currentTarget;try{const row=await this.post(this.endpoint(),{spec:{title:form.elements.namedItem('title').value,description:form.elements.namedItem('description').value,acceptance:form.elements.namedItem('acceptance').value.split('\n').map(x=>x.trim()).filter(Boolean)}});this.selected=row.id;form.reset();await this.load();}catch(error){W.status(this.note,error);}};
 W.route(this.host,'tasks',()=>this.load());this.timer=setInterval(()=>{if(!this.host.hidden)this.load();},5000);}
 disconnectedCallback(){clearInterval(this.timer);}
 async post(path,body){if(this.submitting)throw Error('A task action is already in progress.');this.submitting=true;const buttons=[...this.querySelectorAll('form button')];buttons.forEach(button=>button.disabled=true);try{return await W.post(path,body);}finally{this.submitting=false;buttons.forEach(button=>button.disabled=false);}}
 endpoint(){if(!this.project.value)throw Error('Choose a project workspace first.');return `/ui/projects/${encodeURIComponent(this.project.value)}/tasks`;}
 async loadProjects(){
  const result=await W.api('/ui/projects');
  const projects=new Map();for(const row of result.workspaces||[])if(!projects.has(row.id)||row.is_self)projects.set(row.id,row);
  this.projects=[...projects.values()];const selected=this.project.value;
  this.project.replaceChildren(E('option',{value:''},'Choose a project'),...this.projects.map(row=>E('option',{value:row.id},row.name)));
  this.project.value=this.projects.some(row=>row.id===selected)?selected:(this.projects.find(row=>row.local_authority&&row.board_host)?.id||'');
  this.projectsLoaded=true;
 }
 async load(){
  if(this.loading||this.submitting)return;this.loading=true;let selected=this.project.value;
  try{
   if(!this.projectsLoaded)await this.loadProjects();
   if(!this.project.value){this.rows=[];this.overview=null;this.paint();this.note.replaceChildren(E('span',{},'Choose a project workspace. '),W.button('Open Projects',()=>M.go('projects')));return;}
   selected=this.project.value;this.note.textContent='Updating task overview…';
   const data=await W.api(this.endpoint());if(selected!==this.project.value)return;
   this.rows=data.tasks||[];this.metrics=data.metrics||{};this.overview=data.overview;this.loadError='';this.paint();
   this.note.textContent=`Updated ${new Date(this.overview.as_of*1000).toLocaleTimeString()}`;
   const project=this.projects.find(row=>row.id===selected);this.querySelector('.task-authority').textContent=project?`Canonical workspace · ${project.authority_machine||'authority not configured'}`:'';
  }catch(error){if(selected!==this.project.value)return;this.rows=[];this.overview=null;this.loadError=error.message||String(error);this.paint();this.note.replaceChildren(E('span',{},`Task data unavailable: ${this.loadError} Use Refresh to try again, or check the project workspace. `),W.button('Open Projects',()=>M.go('projects')));}
  finally{this.loading=false;if(this.reloadAfterLoad){this.reloadAfterLoad=false;this.load();}}
 }
 summary(){
  const value=this.overview,metrics=this.querySelector('.task-metrics');
  metrics.replaceChildren(...[['Queued','queued'],['Running','running'],['Blocked','blocked'],['Review','review'],['Done','done'],['Failed','failed']].map(([label,key])=>E('div',{'data-task-count':key},E('strong',{},value?String(value[key]):'—'),label)));
  this.querySelector('.task-remaining-number').textContent=value?String(value.remaining):'—';
  this.querySelector('.task-total').textContent=value?`${value.done} completed of ${value.total} tasks${value.awaiting_integration?` · ${value.awaiting_integration} awaiting integration`:''}`:this.loadError?'Task data unavailable':'Choose a project workspace';
  this.querySelector('.task-eta-value').textContent=value?.eta_seconds!=null?this.duration(value.eta_seconds):'Unknown';
  this.querySelector('.task-eta-reason').textContent=value?.eta_reason||(this.loadError?'Task data could not be loaded. Refresh to try again.':'Waiting for project task data.');
  const workers=this.querySelector('.task-worker-list');workers.replaceChildren(...(value?.workers||[]).map(worker=>E('button',{type:'button',onclick:()=>{this.selected=worker.task;this.paint();}},E('strong',{},worker.id),E('small',{},`${worker.device_id||'Device not recorded'} · ${worker.active?'Active lease':'Heartbeat expired'}${worker.heartbeat_age_seconds!=null?' · '+this.duration(worker.heartbeat_age_seconds)+' since heartbeat':''}`),E('small',{},worker.title))));
  if(!workers.children.length)workers.append(E('p',{class:'hint'},value?'No tasks currently assigned to a working agent.':this.loadError?'Worker assignments unavailable.':'Choose a project to inspect worker assignments.'));
  this.querySelector('.task-composer').hidden=!value;
 }
 duration(seconds){if(seconds<60)return `${Math.floor(seconds)}s`;if(seconds<3600)return `${Math.floor(seconds/60)}m`;return `${Math.floor(seconds/3600)}h ${Math.floor(seconds%3600/60)}m`;}
 paint(){this.summary();
 const layout=this.querySelector('.task-layout');layout.hidden=!this.overview;this.search.disabled=this.filter.disabled=!this.overview;
 if(!this.overview){this.querySelector('.task-list').replaceChildren();this.querySelector('.task-detail').replaceChildren();this.detailKey='';return;}
 const query=this.search.value.toLowerCase();const rows=this.rows.filter(row=>(!this.filter.value||row.state===this.filter.value)&&`${row.title} ${row.description} ${row.worker||''} ${row.base_id||''}`.toLowerCase().includes(query));
 const lanes=[['Ready',['queued']],['In progress',['working','blocked']],['Review & done',['review','accepted','completed','rejected']]];
 this.querySelector('.task-list').replaceChildren(...lanes.map(([label,states])=>{
  const matching=rows.filter(row=>states.includes(row.state));
  const lane=E('section',{class:'task-column','aria-label':label},E('h2',{},label,E('span',{},String(matching.length))));
  lane.append(...matching.map(row=>E('button',{class:'task-row',type:'button','aria-pressed':String(row.id===this.selected),onclick:()=>{this.selected=row.id;this.paint();}},row.title,E('small',{},row.worker||row.base_id||'Awaiting assignment'),E('span',{class:'task-state'},row.state))));
  if(!matching.length)lane.append(E('p',{class:'hint'},'No tasks here.'));
  return lane;
 }));
 if(!rows.length)this.querySelector('.task-list').prepend(E('p',{class:'hint'},'No matching tasks.'));
 const row=this.rows.find(row=>row.id===this.selected);if(row)this.details(row);else{this.detailKey='';this.querySelector('.task-detail').replaceChildren(E('p',{},'Select a task to inspect its evidence.'));}}
 field(list,label,value){if(value!==undefined&&value!==null&&value!=='')list.append(E('dt',{},label),E('dd',{},value instanceof Node?value:String(value)));}
 evidence(title,value){return E('details',{'data-advanced':''},E('summary',{},title),E('pre',{},W.json(value)));}
 details(row){const key=JSON.stringify(row);if(this.detailKey===key)return;const current=this.querySelector('.task-detail');if(current.dataset.task===row.id&&current.querySelector('form :focus'))return;const sameTask=current.dataset.task===row.id;const draft=sameTask?[...current.querySelectorAll('form input,form textarea,form select')].map(node=>({value:node.value,checked:node.checked})):[];const expanded=new Map(sameTask?[...current.querySelectorAll('details')].map(node=>[node.querySelector('summary')?.textContent,node.open]):[]);this.detailKey=key;current.dataset.task=row.id;const host=this.querySelector('.task-detail'),list=E('dl',{}),opened=new Set([...host.querySelectorAll('[data-publishing-key][open]')].map(node=>node.dataset.publishingKey));host.replaceChildren(E('h2',{},row.title),E('span',{class:'badge'},row.state),E('p',{},row.description),list);
 for(const [label,value] of [['Account',row.base_id],['Device',row.device_id],['Worker',row.worker],['Age',row.activity?this.duration(row.activity.age_seconds):null],['Last update',row.activity?.updated_at?new Date(row.activity.updated_at*1000).toLocaleString():null],['Estimated completion',row.activity?.eta_seconds!=null?this.duration(row.activity.eta_seconds):'Unknown'],['Task ID',row.id],['Blocked reason',row.blocked_reason],['Resource model',row.lease?.resource?.model],['Authorized project',window.taskPublishingProject(row.lease?.resource?.project,row.id)],['Lease expires',row.lease?.deadline?new Date(row.lease.deadline*1000).toLocaleString():null]])this.field(list,label,value);
 host.append(E('h3',{},'Acceptance criteria'),E('ul',{},...row.acceptance.map(item=>E('li',{},item))));
 if(row.dependencies?.length){const deps=E('div',{class:'task-dependencies'},E('h3',{},'Dependencies'));for(const dep of row.dependencies)deps.append(E('button',{type:'button',class:'ghost',onclick:()=>{this.selected=dep.id;this.paint();}},`${dep.title} · ${dep.state}`));host.append(deps);}
 if(row.activity?.verified_checks.total)host.append(E('p',{class:'hint'},`${row.activity.verified_checks.passed} of ${row.activity.verified_checks.total} criteria independently verified.`));
 if(row.checkpoints?.length){const log=E('details',{},E('summary',{},'Checkpoint log'));for(const item of row.checkpoints.slice().reverse())log.append(E('div',{class:'task-checkpoint'},E('time',{},new Date(item.at*1000).toLocaleString()),E('p',{},item.summary||'Checkpoint recorded'),item.progress?E('small',{class:'hint'},`Worker-reported progress: ${item.progress}`):null));host.append(log);}
 for(const [label,value] of [['Resource lease',row.lease],['Worker checkpoints',row.checkpoints],['Submitted proposal and artifact hashes',row.proposal],['Independent reviews',row.reviews]])if(value&&(Array.isArray(value)?value.length:true))host.append(this.evidence(label,value));
 host.append(window.taskPublishing(row));for(const node of host.querySelectorAll('[data-publishing-key]'))node.open=opened.has(node.dataset.publishingKey);
 if(row.state==='review')this.reviewForm(host,row);
 if(row.review)this.creditControl(host,row);
 if(row.state==='blocked'||row.state==='working'&&row.lease?.deadline*1000<Date.now())this.resumeForm(host,row);[...host.querySelectorAll('form input,form textarea,form select')].forEach((node,index)=>{if(draft[index]){node.value=draft[index].value;if(node.type==='checkbox'){node.checked=draft[index].checked;node.dispatchEvent(new Event('change'));}}});for(const node of host.querySelectorAll('details')){const title=node.querySelector('summary')?.textContent;if(expanded.has(title))node.open=expanded.get(title);}}
 resumeForm(host,row){const action=row.state==='blocked'?'resume':'recover',form=E('form',{}),reason=E('textarea',{required:true,'aria-label':'Continuation reason'});form.append(E('h3',{},action==='resume'?'Resolve blockage':'Recover expired lease'),E('p',{},'Explain the changed condition. Continuation still requires a fresh verified resource claim.'),reason,E('button',{},action==='resume'?'Authorize resume':'Recover expired lease'));form.onsubmit=async event=>{event.preventDefault();try{await this.post(this.endpoint(),{action,id:row.id,reason:reason.value});await this.load();}catch(error){W.status(this.note,error);}};host.append(form);}
 creditMessage(credit){this.note.textContent=credit.state==='pending'?'Review saved. Credit recording is pending; use Record verified outcome to retry.':credit.state==='blocked'?credit.reason:credit.credited?`${credit.total} credits recorded. Runs remain free.`:'Verified outcome already recorded; no duplicate credits awarded.';}
 creditControl(host,row){const button=E('button',{type:'button',onclick:async()=>{button.disabled=true;try{const result=await this.post(this.endpoint(),{action:'credit',id:row.id});this.creditMessage(result.credit);}catch(error){W.status(this.note,error);}finally{button.disabled=false;}}},'Record verified outcome');host.append(E('h3',{},'Verified credit'),E('p',{},'The independent reviewer can retry recording this outcome if the encrypted credit store was unavailable. Retries never award twice. Runs are free.'),button);}

 reviewForm(host,row){const box=E('details',{},E('summary',{},'Independently review this proposal')),form=E('form',{}),reason=E('textarea',{required:true,'aria-label':'Independent review reason'}),outcome=E('select',{'aria-label':'Review outcome'},...['accepted','rejected','blocked_infrastructure'].map(x=>E('option',{value:x},x.replaceAll('_',' '))));const checks=row.acceptance.map(name=>({name,input:E('input',{type:'checkbox'})}));form.append(E('label',{},'Outcome',outcome),E('label',{},'Review reason',reason),E('p',{},'Check only criteria you independently verified.'));
 for(const check of checks)form.append(E('label',{},check.input,' '+check.name));const quality=window.taskReviewQuality(row,checks);form.append(quality.node);form.append(E('button',{},'Record independent review'));form.onsubmit=async event=>{event.preventDefault();try{const result=await this.post(this.endpoint(),{action:'review',id:row.id,decision:{accepted:outcome.value==='accepted',outcome:outcome.value,reason:reason.value,checks:checks.map(check=>({name:check.name,passed:check.input.checked})),...quality.value(outcome.value)}});await this.load();if(result.credit)this.creditMessage(result.credit);}catch(error){W.status(this.note,error);}};box.append(form);host.append(box);}
}
customElements.define('tasks-view',TasksView);
})();
</script>
