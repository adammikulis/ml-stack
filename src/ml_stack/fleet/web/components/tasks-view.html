<style>
tasks-view { display:contents; }
tasks-view .workspace { padding:calc(28px * var(--ui-density,1)) calc(32px * var(--ui-density,1)); }
tasks-view .work-heading { display:flex; justify-content:space-between; gap:24px; align-items:center; margin-bottom:24px; }
tasks-view .work-heading h1 { margin:0 0 8px; }
tasks-view .work-heading p { margin:0; max-width:650px; }
tasks-view .work-mark { border-radius:16px; padding:calc(14px * var(--ui-density,1)) calc(18px * var(--ui-density,1)); background:var(--poolside-yellow); color:var(--poolside-yellow-ink,var(--poolside-navy)); font-weight:700; white-space:nowrap; }
tasks-view .task-controls { display:flex; gap:12px; align-items:center; margin:20px 0; }
tasks-view .task-controls input { flex:1; min-width:100px; }
tasks-view .task-layout { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr); gap:22px; align-items:start; }
tasks-view .task-list { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
tasks-view .task-column { background:var(--bg-sunken); border-radius:14px; padding:calc(12px * var(--ui-density,1)); min-height:300px; }
tasks-view .task-column h2 { display:flex; justify-content:space-between; font-size:0.929rem; margin:3px 0 14px; }
tasks-view .task-column h2 span { color:var(--muted); }
tasks-view .task-row { display:block; width:100%; text-align:left; margin:0 0 10px; padding:calc(16px * var(--ui-density,1)) calc(12px * var(--ui-density,1)); background:var(--bg-raised); color:var(--text); border:1px solid var(--line); border-radius:10px; box-shadow:0 2px 5px #1b1f3a05; }
tasks-view .task-row[aria-pressed=true] { border-color:var(--poolside-yellow-ink,var(--poolside-navy)); box-shadow:0 0 0 1px var(--poolside-navy); }
tasks-view .task-row small { display:block; color:var(--muted); margin-top:10px; font-size:0.786rem; overflow-wrap:anywhere; }
tasks-view .task-row .task-state { display:inline-block; margin-top:12px; font-size:0.714rem; background:var(--poolside-yellow); color:var(--poolside-yellow-ink,var(--poolside-navy)); padding:calc(3px * var(--ui-density,1)) calc(7px * var(--ui-density,1)); border-radius:5px; }
tasks-view .task-detail { background:var(--bg-raised); border:1px solid var(--line); border-radius:16px; padding:calc(24px * var(--ui-density,1)); min-height:300px; }
tasks-view .task-detail h2 { margin-top:0; }
tasks-view dl { display:grid; grid-template-columns:110px minmax(0,1fr); gap:8px; font-size:0.857rem; }
tasks-view dt { color:var(--muted); } tasks-view dd { margin:0; overflow-wrap:anywhere; }
tasks-view .task-metrics { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }
tasks-view .task-metrics > div { padding:calc(16px * var(--ui-density,1)); background:var(--bg-raised); border:1px solid var(--line); border-radius:12px; font-size:0.857rem; }
tasks-view .task-metrics strong { display:block; font-size:1.786rem; margin-bottom:6px; }
tasks-view details { margin:14px 0; } tasks-view summary { cursor:pointer; }
tasks-view .task-composer { background:var(--bg-raised); border:1px solid var(--line); border-radius:12px; padding:calc(16px * var(--ui-density,1)); }
@media(max-width:1100px) { tasks-view .task-layout { grid-template-columns:1fr; } }
@media(max-width:650px) { tasks-view .workspace { padding:calc(20px * var(--ui-density,1)); } tasks-view .task-list { grid-template-columns:1fr; } tasks-view .task-column { min-height:0; } tasks-view .task-metrics { grid-template-columns:repeat(2,1fr); } tasks-view .work-mark { display:none; } tasks-view .task-controls { flex-wrap:wrap; } }
</style>
<template>
<section class="workspace" hidden>
<header class="work-heading"><div><h1>Move work forward</h1><p class="intro">Give an agent a clear task. Follow its progress, inspect the evidence, and review the outcome.</p></div><span class="work-mark">Ideas → outcomes</span></header>
<div class="task-metrics"></div>
<div class="task-controls"><input aria-label="Search tasks" placeholder="Search tasks"><select aria-label="Task status"><option value="">All statuses</option></select><button class="task-refresh">Refresh</button></div>
<p class="status" role="status"></p>
<details class="task-composer"><summary>＋ Create a task</summary><form class="task-create"><label>Title<input name="title" required maxlength="200"></label><label>Description<textarea name="description" maxlength="20000"></textarea></label><label>Acceptance criteria, one per line<textarea name="acceptance" required></textarea></label><button>Create task</button></form></details>
<div class="task-layout"><div class="task-list"></div><article class="workspace-card task-detail"><p>Select a task to inspect its evidence.</p></article></div>
</section>
</template>
<script>
(function(){
const M=window.fleetModel,W=window.workspaceModel,E=M.el;
class TasksView extends HTMLElement{
 connectedCallback(){if(this.wired)return;this.wired=true;this.host=this.querySelector('section');this.note=this.querySelector('.status');this.rows=[];this.selected='';
 this.search=this.querySelector('input[aria-label="Search tasks"]');this.filter=this.querySelector('select');
 for(const state of ['queued','working','review','accepted','completed','blocked','rejected'])this.filter.append(E('option',{value:state},state));
 this.search.oninput=this.filter.onchange=()=>this.paint();this.querySelector('.task-refresh').onclick=()=>this.load();
 this.querySelector('form').onsubmit=async event=>{event.preventDefault();const form=event.currentTarget;try{const row=await this.post('/ui/tasks',{spec:{title:form.elements.namedItem('title').value,description:form.elements.namedItem('description').value,acceptance:form.elements.namedItem('acceptance').value.split('\n').map(x=>x.trim()).filter(Boolean)}});this.selected=row.id;form.reset();await this.load();}catch(error){W.status(this.note,error);}};
 W.route(this.host,'tasks',()=>this.load());this.timer=setInterval(()=>{if(!this.host.hidden)this.load();},5000);}
 disconnectedCallback(){clearInterval(this.timer);}
 async post(path,body){if(this.submitting)throw Error('A task action is already in progress.');this.submitting=true;const buttons=[...this.querySelectorAll('form button')];buttons.forEach(button=>button.disabled=true);try{return await W.post(path,body);}finally{this.submitting=false;buttons.forEach(button=>button.disabled=false);}}
 async load(){if(this.loading||this.submitting)return;this.loading=true;try{const data=await W.api('/ui/tasks');this.rows=data.tasks||[];this.metrics=data.metrics||{};this.paint();this.note.textContent=`${this.rows.length} tasks. Worker checkpoints are claims until independently verified.`;}catch(error){W.status(this.note,error);}finally{this.loading=false;}}
 paint(){const metrics=this.querySelector('.task-metrics');metrics.replaceChildren(...[['Accepted outcomes',this.metrics?.verified_outcomes],['Accepted artifacts',this.metrics?.accepted_artifacts],['Failures',this.metrics?.failures],['Blocked seconds',Math.round(this.metrics?.blocked_seconds||0)]].map(([label,value])=>E('div',{},E('strong',{},String(value||0)),label)));
 const query=this.search.value.toLowerCase();const rows=this.rows.filter(row=>(!this.filter.value||row.state===this.filter.value)&&`${row.title} ${row.description} ${row.worker||''} ${row.base_id||''}`.toLowerCase().includes(query));
 const lanes=[['Ready',['queued']],['In progress',['working','blocked']],['Review & done',['review','accepted','completed','rejected']]];
 this.querySelector('.task-list').replaceChildren(...lanes.map(([label,states])=>{
  const matching=rows.filter(row=>states.includes(row.state));
  const lane=E('section',{class:'task-column','aria-label':label},E('h2',{},label,E('span',{},String(matching.length))));
  lane.append(...matching.map(row=>E('button',{class:'task-row',type:'button','aria-pressed':String(row.id===this.selected),onclick:()=>{this.selected=row.id;this.paint();}},row.title,E('small',{},row.worker||row.base_id||'Awaiting assignment'),E('span',{class:'task-state'},row.state))));
  if(!matching.length)lane.append(E('p',{class:'hint'},'No tasks here.'));
  return lane;
 }));
 if(!rows.length)this.querySelector('.task-list').prepend(E('p',{class:'hint'},'No matching tasks.'));
 const row=this.rows.find(row=>row.id===this.selected);if(row)this.details(row);else{this.detailKey='';this.querySelector('.task-detail').replaceChildren(E('p',{},'Select a task to inspect its evidence.'));}}
 field(list,label,value){if(value!==undefined&&value!==null&&value!=='')list.append(E('dt',{},label),E('dd',{},value instanceof Node?value:String(value)));}
 evidence(title,value){return E('details',{'data-advanced':''},E('summary',{},title),E('pre',{},W.json(value)));}
 details(row){const key=JSON.stringify(row);if(this.detailKey===key)return;const current=this.querySelector('.task-detail');if(current.dataset.task===row.id&&current.querySelector('form :focus'))return;const sameTask=current.dataset.task===row.id;const draft=sameTask?[...current.querySelectorAll('form input,form textarea,form select')].map(node=>({value:node.value,checked:node.checked})):[];const expanded=new Map(sameTask?[...current.querySelectorAll('details')].map(node=>[node.querySelector('summary')?.textContent,node.open]):[]);this.detailKey=key;current.dataset.task=row.id;const host=this.querySelector('.task-detail'),list=E('dl',{}),opened=new Set([...host.querySelectorAll('[data-publishing-key][open]')].map(node=>node.dataset.publishingKey));host.replaceChildren(E('h2',{},row.title),E('span',{class:'badge'},row.state),E('p',{},row.description),list);
 for(const [label,value] of [['Account',row.base_id],['Device',row.device_id],['Worker',row.worker],['Task ID',row.id],['Blocked reason',row.blocked_reason],['Resource model',row.lease?.resource?.model],['Authorized project',window.taskPublishingProject(row.lease?.resource?.project,row.id)],['Lease expires',row.lease?.deadline?new Date(row.lease.deadline*1000).toLocaleString():null]])this.field(list,label,value);
 host.append(E('h3',{},'Acceptance criteria'),E('ul',{},...row.acceptance.map(item=>E('li',{},item))));
 if(row.dependencies?.length)host.append(this.evidence('Dependencies',row.dependencies));
 for(const [label,value] of [['Resource lease',row.lease],['Worker checkpoints',row.checkpoints],['Submitted proposal and artifact hashes',row.proposal],['Independent reviews',row.reviews]])if(value&&(Array.isArray(value)?value.length:true))host.append(this.evidence(label,value));
 host.append(window.taskPublishing(row));for(const node of host.querySelectorAll('[data-publishing-key]'))node.open=opened.has(node.dataset.publishingKey);
 if(row.state==='review')this.reviewForm(host,row);
 if(row.review)this.creditControl(host,row);
 if(row.state==='blocked'||row.state==='working'&&row.lease?.deadline*1000<Date.now())this.resumeForm(host,row);[...host.querySelectorAll('form input,form textarea,form select')].forEach((node,index)=>{if(draft[index]){node.value=draft[index].value;if(node.type==='checkbox'){node.checked=draft[index].checked;node.dispatchEvent(new Event('change'));}}});for(const node of host.querySelectorAll('details')){const title=node.querySelector('summary')?.textContent;if(expanded.has(title))node.open=expanded.get(title);}}
 resumeForm(host,row){const action=row.state==='blocked'?'resume':'recover',form=E('form',{}),reason=E('textarea',{required:true,'aria-label':'Continuation reason'});form.append(E('h3',{},action==='resume'?'Resolve blockage':'Recover expired lease'),E('p',{},'Explain the changed condition. Continuation still requires a fresh verified resource claim.'),reason,E('button',{},action==='resume'?'Authorize resume':'Recover expired lease'));form.onsubmit=async event=>{event.preventDefault();try{await this.post('/ui/tasks',{action,id:row.id,reason:reason.value});await this.load();}catch(error){W.status(this.note,error);}};host.append(form);}
 creditMessage(credit){this.note.textContent=credit.state==='pending'?'Review saved. Credit recording is pending; use Record verified outcome to retry.':credit.state==='blocked'?credit.reason:credit.credited?`${credit.total} credits recorded. Runs remain free.`:'Verified outcome already recorded; no duplicate credits awarded.';}
 creditControl(host,row){const button=E('button',{type:'button',onclick:async()=>{button.disabled=true;try{const result=await this.post('/ui/tasks',{action:'credit',id:row.id});this.creditMessage(result.credit);}catch(error){W.status(this.note,error);}finally{button.disabled=false;}}},'Record verified outcome');host.append(E('h3',{},'Verified credit'),E('p',{},'The independent reviewer can retry recording this outcome if the encrypted credit store was unavailable. Retries never award twice. Runs are free.'),button);}

 reviewForm(host,row){const box=E('details',{},E('summary',{},'Independently review this proposal')),form=E('form',{}),reason=E('textarea',{required:true,'aria-label':'Independent review reason'}),outcome=E('select',{'aria-label':'Review outcome'},...['accepted','rejected','blocked_infrastructure'].map(x=>E('option',{value:x},x.replaceAll('_',' '))));const checks=row.acceptance.map(name=>({name,input:E('input',{type:'checkbox'})}));form.append(E('label',{},'Outcome',outcome),E('label',{},'Review reason',reason),E('p',{},'Check only criteria you independently verified.'));
 for(const check of checks)form.append(E('label',{},check.input,' '+check.name));const quality=window.taskReviewQuality(row,checks);form.append(quality.node);form.append(E('button',{},'Record independent review'));form.onsubmit=async event=>{event.preventDefault();try{const result=await this.post('/ui/tasks',{action:'review',id:row.id,decision:{accepted:outcome.value==='accepted',outcome:outcome.value,reason:reason.value,checks:checks.map(check=>({name:check.name,passed:check.input.checked})),...quality.value(outcome.value)}});await this.load();if(result.credit)this.creditMessage(result.credit);}catch(error){W.status(this.note,error);}};box.append(form);host.append(box);}
}
customElements.define('tasks-view',TasksView);
})();
</script>
