<script>
(function () {
  const M = window.fleetModel;
  window.setupRecovery = function (group, done) {
    const note = M.el("div", { class: "hint", "aria-live": "polite" },
      "Ask a cluster owner to export a recovery file with ml-stack-cluster recovery export FILE. The file grants cluster access; choose it only if you trust its owner.");
    const file = M.el("input", { type: "file", id: "cluster-recovery-file", accept: ".json,.recovery,application/json,text/plain" });
    file.style.width = "100%"; file.style.minWidth = "0";
    const join = M.el("button", { disabled: true }, `Join ${group} with recovery file`);
    join.style.maxWidth = "100%"; join.style.whiteSpace = "normal";
    file.onchange = () => { join.disabled = !file.files.length; };
    join.onclick = async () => {
      join.disabled = true;
      try {
        const picked = file.files[0];
        if (!picked || picked.size > 8192) { note.textContent = "Choose a recovery file of at most 8192 bytes."; return; }
        note.textContent = "Authenticating cluster…";
        const result = await M.api("/ui/setup/recovery", { method: "POST", body: JSON.stringify({ group, recovery: await picked.text() }) });
        if (!result.ok) { note.textContent = result.error || "Could not join using this file."; return; }
        file.value = "";
        note.textContent = `Joined ${group}.`;
        await done();
      } catch { note.textContent = "Could not join. Check the file and connection, then try again."; }
      finally { join.disabled = !file.files.length; }
    };
    return M.el("div", { class: "card" }, M.el("h3", {}, `Join ${group}`), note,
      M.el("label", { for: "cluster-recovery-file" }, "Cluster recovery file"), file, join);
  };
})();
</script>
