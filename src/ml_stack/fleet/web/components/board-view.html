<style>
board-view { display:contents; }
board-view .board-workspace { padding:24px; width:100%; min-width:0; }
board-view .board-workspace h1 { margin:0 0 6px; }
board-view .board-workspace .sub { margin:0 0 18px; }
board-view ml-board { display:block; height:calc(100dvh - 188px); min-height:420px; }
@media(max-width:640px) { board-view .board-workspace { padding:16px; } board-view ml-board { height:72dvh; } }
.conversation-tabs { display:flex; gap:4px; padding:4px; border:1px solid var(--line); border-radius:12px; background:var(--bg); margin:12px 0; }
.conversation-tabs a { flex:1; padding:8px 12px; border-radius:8px; text-align:center; text-decoration:none; font-size:13px; color:var(--muted); }
.conversation-tabs a[aria-current=page] { color:var(--text); background:var(--bg-raised); box-shadow:0 1px 4px #0002; font-weight:600; }
.conversation-heading { display:flex; justify-content:space-between; gap:24px; align-items:center; }
@media(max-width:760px) { .conversation-heading { display:block; } }
</style>
<template>
  <section class="board-workspace" hidden>
    <header class="conversation-heading"><div><h1>Conversations</h1>
      <p class="sub">Team channels, project threads, and direct messages to agents.</p></div>
      <nav class="conversation-tabs" aria-label="Conversation spaces"><a href="#chat">Model chats</a><a href="#board" aria-current="page">Team channels</a></nav></header>
    <coordinator-control></coordinator-control>
    <details id="board-agents" data-advanced><summary>Local agents</summary><div id="agents-mount"></div></details>
    <div id="board-mount"></div>
  </section>
</template>
<script>
(function () {
  const M = window.fleetModel;
  class BoardView extends HTMLElement {
    connectedCallback() {
      if (this.wired) return;
      this.wired = true;
      this.host = this.querySelector('section');
      this.mount = this.querySelector('#board-mount');
      this.sharedRemote = null;
      this.addEventListener('coordination', event => {
        this.sharedRemote = event.detail.mode === 'remote';
        this.querySelector('#board-agents').hidden = this.sharedRemote;
        if (this.sharedRemote) this.viewer?.remove();
        else if (!this.host.hidden) this.showBoard();
      });
      this.querySelector('#board-agents').ontoggle = event => {
        if (event.target.open && !this.agents) {
          this.agents = M.el('ml-agents', {endpoint:'/ui/agents'});
          this.querySelector('#agents-mount').append(this.agents);
        }
      };
      M.onRoute(route => {
        this.host.hidden = route !== 'board';
        if (route === 'board') {
          if (this.sharedRemote === false) this.showBoard();
        } else this.viewer?.remove();
      });
    }
    showBoard() {
      this.viewer ||= M.el('ml-board', {endpoint:'/ui/board', 'channel-feed':''});
      this.mount.append(this.viewer);
    }
  }
  customElements.define('board-view', BoardView);
})();
</script>
