<!-- close-sheet: the question the native window asks when the close button is clicked -->
<template>
  <div class="sheet" id="close-sheet" hidden>
    <div class="sheet-card">
      <h1>Close ml-stack?</h1>
      <p class="sub" id="close-why"></p>
      <div class="choices">
        <button class="choice" id="close-background">
          <span class="t">Keep running in the background</span>
          <span class="d" id="close-background-d"></span>
        </button>
        <button class="choice" id="close-quit">
          <span class="t">Quit</span>
          <span class="d" id="close-quit-d"></span>
        </button>
      </div>
      <label class="opt" for="remember" style="margin-top:16px">
        <input type="checkbox" id="remember" checked="1">
        <span><b>Save my setting and don't ask again</b><span class="why">You can change it later under this machine's settings.</span></span>
      </label>
      <button class="ghost" id="close-cancel">Cancel</button>
    </div>
  </div>
</template>
<script>
(function () {
  // The native window around this page, or null when it is served to a browser.
  window.mlStackNative = function () {
    const core = window.__TAURI__ && window.__TAURI__.core;
    if (!core || typeof core.invoke !== "function") return null;
    return {
      closeChoice: (mode, remember) => core.invoke("close_choice", { mode, remember }),
    };
  };

  class CloseSheet extends HTMLElement {
    connectedCallback() {
      if (this.wired) return;
      this.wired = true;
      this.sheet = this.querySelector("#close-sheet");
      this.why = this.querySelector("#close-why");
      this.remember = this.querySelector("#remember");
      const choose = (mode) => async () => {
        this.sheet.hidden = true;
        const native = window.mlStackNative();
        if (native) await native.closeChoice(mode, this.remember.checked);
      };
      this.querySelector("#close-background").onclick = choose("background");
      this.querySelector("#close-quit").onclick = choose("quit");
      this.querySelector("#close-cancel").onclick = () => { this.sheet.hidden = true; };
      // Asked once, by the native window, when someone clicks the close button.
      window.mlStackAskOnClose = () => {
        this.remember.checked = true;
        const clustered = !!(window.fleetModel && window.fleetModel.inCluster);
        this.why.textContent = clustered
          ? "This machine is part of your cluster. Keeping it running lets the others "
            + "send it work while the window is shut."
          : "Keeping it running lets this machine answer, and lets the machines you add "
            + "later send it work while the window is shut.";
        this.querySelector("#close-background-d").textContent = clustered
          ? "Stays in the cluster. Open it again any time."
          : "Stays reachable. Open it again any time.";
        this.querySelector("#close-quit-d").textContent = clustered
          ? "Leaves the cluster until you open it again."
          : "Stops answering until you open it again.";
        this.sheet.hidden = false;
      };
    }
  }
  customElements.define("close-sheet", CloseSheet);
})();
</script>
