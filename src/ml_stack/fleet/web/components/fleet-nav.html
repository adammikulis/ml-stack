<style>
fleet-nav { display: contents; }
</style>
<template>
  <aside class="sidebar" aria-label="Workspace navigation">
    <a class="brand" href="#chat"><span class="dot"></span>ml-stack</a>
    <div class="sidebar-caption">Local intelligence studio</div>
    <nav class="tabs" id="nav-tabs" aria-label="Main navigation"></nav>
    <footer class="sidebar-footer">
      <div class="workspace-label"><span class="pulse"></span><span id="nav-group"></span></div>
      <a href="#sign-in" id="nav-signout">Sign out</a>
    </footer>
  </aside>
  <header class="workspace-header">
    <div><span class="eyebrow" id="nav-section"></span><strong id="nav-title"></strong></div>
    <span class="header-hint">Your models. Your machines.</span>
  </header>
</template>
<script>
(function () {
  const M = window.fleetModel;
  const el = M.el;
  const GROUPS = [
    ["Workspace", [["Chat", "chat", "Conversations"], ["Models", "models", "Browse & serve"],
      ["Data", "data", "Files & datasets"]]],
    ["Develop", [["Training", "training", "Recipes & runs"], ["Gym", "gym", "Environments & policies"],
      ["Benchmarks", "benchmarks", "Measure & compare"], ["Capacity", "fit", "Memory & throughput"]]],
    ["Manage", [["Fleet", "cluster", "Machines & clusters"], ["Tools", "tools", "Explore capabilities"],
      ["Settings", "settings", "Preferences & setup"]]],
  ];
  const here = ([, name]) => !!document.querySelector(`${name}-view`);

  class FleetNav extends HTMLElement {
    connectedCallback() {
      if (this.wired) return;
      this.wired = true;
      this.tabs = this.querySelector("#nav-tabs");
      this.group = this.querySelector("#nav-group");
      this.heading = this.querySelector("#nav-title");
      this.section = this.querySelector("#nav-section");
      this.querySelector("#nav-signout").onclick = M.signOut;
      const skip = document.querySelector(".skip-link");
      if (skip) skip.onclick = (e) => {
        e.preventDefault(); document.getElementById("workspace")?.focus();
      };
      M.onRoute((route) => this.paint(route));
    }

    paint(route) {
      this.group.textContent = M.group || (M.inCluster ? "Connected fleet" : "Local workspace");
      const groups = GROUPS.map(([label, entries]) => [label, entries.filter(here)])
        .filter(([, entries]) => entries.length);
      this.tabs.replaceChildren(...groups.map(([label, entries]) =>
        el("div", { class: "nav-section" }, el("span", { class: "nav-label" }, label),
          ...entries.map(([name, key, hint]) => {
            if (key === route) { this.heading.textContent = name; this.section.textContent = label; }
            return el("a", { class: `nav-link${key === route ? " on" : ""}`, href: `#${key}`,
              "aria-current": key === route ? "page" : null,
              onclick: (e) => { e.preventDefault(); M.go(key); } },
              el("span", { class: "nav-icon", "aria-hidden": "true" }, name.slice(0, 1)),
              el("span", {}, el("strong", {}, name), el("small", {}, hint)));
          }))));
    }
  }
  customElements.define("fleet-nav", FleetNav);
})();
</script>
