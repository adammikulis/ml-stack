<style>
fleet-nav { display: contents; }
.nav-search { width:100%; min-width:0; margin:12px 0; padding:9px 11px; background:var(--bg);
  color:var(--text); border:1px solid var(--line); border-radius:8px; }
.nav-empty { margin:8px 10px; color:var(--muted); font-size:12px; line-height:1.6; }
@media(max-width:640px) {
  fleet-nav .sidebar { padding-top:14px; }
  fleet-nav .nav-search { margin:10px 0 0; }
  fleet-nav nav.tabs { overflow-x:auto; overflow-y:hidden; min-width:0; padding-bottom:4px; }
  fleet-nav .nav-link { min-height:44px; }
}
.workspace-jobs-indicator { font-size:12px; padding:6px 10px; border-radius:20px;
  width:auto; margin:0; white-space:nowrap; background:var(--bg); color:var(--muted); border:1px solid var(--line); }
</style>
<template>
  <aside class="sidebar" aria-label="Workspace navigation">
    <a class="brand" href="#chat"><span class="dot"></span>Poolside</a>
    <div class="sidebar-caption">Intelligence workspace</div>
    <input class="nav-search" id="nav-search" type="search" aria-label="Find a page"
      placeholder="Find a page…" aria-keyshortcuts="Control+k Meta+k">
    <nav class="tabs" id="nav-tabs" aria-label="Main navigation"></nav>
    <p class="nav-empty" id="nav-empty" role="status" hidden>No pages match. Press Escape to clear.</p>
    <footer class="sidebar-footer">
      <div class="workspace-label"><span class="pulse"></span><span id="nav-group"></span></div>
      <a href="#sign-in" id="nav-signout">Sign out</a>
    </footer>
  </aside>
  <header class="workspace-header">
    <div><span class="eyebrow" id="nav-section"></span><strong id="nav-title"></strong></div>
    <button class="ghost workspace-guide" id="nav-guide" type="button">Demo guide <span aria-hidden="true">↗</span></button>
    <button class="workspace-jobs-indicator" id="nav-jobs" type="button" hidden>Jobs</button>
  </header>
  <dialog id="nav-demo" aria-labelledby="demo-title">
    <div class="demo-heading"><div><span class="eyebrow">Ten ways to explore</span><h1 id="demo-title">Your intelligence workspace</h1></div>
      <button class="ghost small" id="demo-close" type="button" aria-label="Close demo guide">Close</button></div>
    <p class="sub">Start a conversation, train a model or connect a team. Each stop opens a working part of the workspace.</p>
    <div class="demo-grid" id="demo-slices"></div>
  </dialog>
</template>
<script>
(function () {
  const M = window.fleetModel;
  const el = M.el;
  const GROUPS = [
    ["Conversations", [["Chat", "chat", "Talk with your models"], ["Board", "board", "Channels, threads & agents"]]],
    ["Models", [["Models", "models", "Discover, download & serve"], ["Tools", "tools", "Connected capabilities"]]],
    ["Work", [["Tasks", "tasks", "Plan, assign & review"], ["Projects & agents", "projects", "Team workspaces"],
      ["Training", "training", "Fine-tuning recipes & runs"], ["Gym", "gym", "RL scenarios & policies"],
      ["Benchmarks", "benchmarks", "Measure & compare"], ["History", "history", "Activity & evidence"]]],
    ["Knowledge", [["Graph inspector", "knowledge", "Explore facts & relationships"], ["Data", "data", "Files & datasets"]]],
    ["Pool", [["Devices", "cluster", "Machines & live resources"], ["Capacity", "fit", "Model fit & throughput"],
      ["Settings", "settings", "Workspace preferences & setup"]]],
  ];
  const DEMOS = [
    ["Chat with a model", "chat", "Choose a served model, send a question and watch its response arrive."],
    ["Bring a team together", "board", "Follow channels, open threads and coordinate people and agents."],
    ["Find the right model", "models", "Browse models, inspect variants and prepare a model for serving."],
    ["Explore connected knowledge", "knowledge", "Inspect graph facts and follow their relationships."],
    ["Turn plans into work", "tasks", "Inspect task claims, evidence and independent reviews."],
    ["Fine-tune a model", "training", "Choose a recipe and dataset, then follow a training run."],
    ["Train in a simulated world", "gym", "Explore an RL scenario, policy controls and recordings."],
    ["Measure model quality", "benchmarks", "Run a benchmark and compare measured results."],
    ["Explore your pool", "cluster", "Inspect connected machines and their available resources."],
    ["Prepare your workspace", "settings", "Configure preferences, libraries and advanced options."],
  ];
  const here = ([, name]) => !!document.querySelector(`${name}-view`);

  class FleetNav extends HTMLElement {
    connectedCallback() {
      if (this.wired) return;
      this.wired = true;
      this.tabs = this.querySelector("#nav-tabs");
      this.group = this.querySelector("#nav-group");
      this.heading = this.querySelector("#nav-title");
      this.section = this.querySelector("#nav-section");
      this.search = this.querySelector("#nav-search");
      this.search.oninput = () => this.paint(M.route);
      this.empty = this.querySelector("#nav-empty");
      this.search.onkeydown = (event) => {
        if (event.key === "Escape") { this.search.value = ""; this.paint(M.route); }
        if (event.key === "Enter" || event.key === "ArrowDown") {
          const first = this.tabs.querySelector("a");
          if (first) { event.preventDefault(); event.key === "Enter" ? first.click() : first.focus(); }
        }
      };
      this.guide = this.querySelector("#nav-demo");
      this.querySelector("#nav-guide").onclick = () => {
        this.querySelector("#demo-slices").replaceChildren(...DEMOS.filter(([, route]) => here(["", route]))
          .map(([title, route, description], index) => el("button", {class:"demo-slice", type:"button",
            onclick: () => { this.guide.close(); M.go(route); }},
            el("span", {class:"demo-number"}, String(index + 1).padStart(2, "0")),
            el("strong", {}, title), el("span", {class:"demo-description"}, description))));
        this.guide.showModal();
      };
      this.querySelector("#demo-close").onclick = () => this.guide.close();
      this.jobs = this.querySelector("#nav-jobs");
      this.jobs.onclick = () => M.go("training");
      this.onKey = (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key === "k") {
          event.preventDefault(); this.search.focus(); this.search.select();
        }
      };
      document.addEventListener("keydown", this.onKey);
      this.querySelector("#nav-signout").onclick = M.signOut;
      const skip = document.querySelector(".skip-link");
      if (skip) skip.onclick = (e) => {
        e.preventDefault(); document.getElementById("workspace")?.focus();
      };
      M.onRoute((route) => { this.paint(route); this.refreshJobs(); });
      this.timer = setInterval(() => this.refreshJobs(), 5000);
    }

    disconnectedCallback() { clearInterval(this.timer); document.removeEventListener("keydown", this.onKey); }

    async refreshJobs() {
      if (!document.querySelector("training-view") || document.querySelector("#app")?.hidden || this.refreshing) return;
      this.refreshing = true;
      try {
        const result = await M.api("/ui/workspace/jobs");
        if (!result.ok) return;
        const jobs = result.jobs || [];
        const running = jobs.filter((job) => job.state === "running").length;
        const queued = jobs.filter((job) => job.state === "queued").length;
        this.jobs.textContent = `${running} running · ${queued} queued`;
        this.jobs.hidden = false;
      } catch { this.jobs.hidden = true; }
      finally { this.refreshing = false; }
    }

    paint(route) {
      this.group.textContent = M.group || (M.inCluster ? "Connected fleet" : "Local workspace");
      const active = GROUPS.flatMap(([label, entries]) => entries.map(entry => [label, entry])).find(([, entry]) => entry[1] === route);
      if (active) { this.heading.textContent = active[1][0]; this.section.textContent = active[0]; }
      const query = this.search.value.trim().toLowerCase();
      const groups = GROUPS.map(([label, entries]) => [label, entries.filter(here)
        .filter((entry) => !query || `${label} ${entry.join(" ")}`.toLowerCase().includes(query))])
        .filter(([, entries]) => entries.length);
      this.empty.hidden = groups.length !== 0;
      this.tabs.replaceChildren(...groups.map(([label, entries]) =>
        el("div", { class: "nav-section" }, el("span", { class: "nav-label" }, label),
          ...entries.map(([name, key, hint]) => {
            return el("a", { class: `nav-link${key === route ? " on" : ""}`, href: `#${key}`,
              "aria-current": key === route ? "page" : null,
              onclick: (e) => { e.preventDefault(); M.go(key); } },
              el("span", { class: "nav-icon", "aria-hidden": "true" }, name.slice(0, 1)),
              el("span", {}, el("strong", {}, name), el("small", {}, hint)));
          }))));
    }
  }
  customElements.define("fleet-nav", FleetNav);
})();
</script>
