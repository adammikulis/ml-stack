<style>
history-view { display:contents; }
history-view .workspace { padding:calc(28px * var(--ui-density,1)) calc(32px * var(--ui-density,1)); }
history-view .activity-heading { display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; }
history-view .activity-heading h1 { margin:0 0 8px; } history-view .activity-heading p { margin:0; }
history-view .activity-heading > span { background:var(--poolside-yellow); color:var(--poolside-yellow-ink,var(--poolside-navy)); padding:calc(14px * var(--ui-density,1)) calc(18px * var(--ui-density,1)); border-radius:12px; font-weight:600; }
history-view .history-controls { background:var(--bg-raised); border:1px solid var(--line); border-radius:14px; padding:calc(18px * var(--ui-density,1)); }
history-view .activity-reputation { margin:24px 0; padding:calc(18px * var(--ui-density,1)); background:var(--bg-raised); border:1px solid var(--line); border-radius:12px; }
history-view .activity-reputation > summary { font-weight:600; }
history-view .history-agent { border:1px solid var(--line); background:var(--bg-raised); border-radius:14px; padding:calc(20px * var(--ui-density,1)); }

history-view .history-controls { display:flex; flex-wrap:wrap; gap:12px; align-items:end; margin-bottom:16px; }
history-view .history-controls label { margin:0; flex:1 1 180px; }
history-view .history-controls input,history-view .history-controls select { display:block; width:100%; margin-top:6px; }
history-view .history-economy { display:flex; flex-wrap:wrap; gap:12px; margin:12px 0; }
history-view .history-metric { min-width:140px; padding:calc(12px * var(--ui-density,1)); background:var(--panel); border:1px solid var(--line); border-radius:8px; }
history-view .history-metric strong { display:block; font-size:1.571rem; }
history-view .history-agent { margin-bottom:16px; }
history-view .history-agent>summary { font-size:1.286rem; padding:calc(4px * var(--ui-density,1)) 0; }
history-view .history-count { color:var(--muted); font-size:0.929rem; margin-left:10px; }
history-view .history-action { border-top:1px solid var(--line); padding:calc(12px * var(--ui-density,1)) 0; }
history-view summary { cursor:pointer; overflow-wrap:anywhere; }
history-view .history-action summary { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
history-view .history-action summary:before { content:'▸'; }
history-view .history-action[open] summary:before { content:'▾'; }
history-view time { color:var(--muted); font-size:0.857rem; }
history-view .history-action dl { display:grid; grid-template-columns:110px minmax(0,1fr); gap:8px; font-size:0.929rem; }
history-view dt { color:var(--muted); }
history-view dd { margin:0; overflow-wrap:anywhere; white-space:pre-wrap; }
history-view .history-links { display:flex; flex-wrap:wrap; gap:12px; margin-top:12px; }
@media(max-width:640px){history-view .history-action dl{grid-template-columns:80px minmax(0,1fr)}}
</style>
<template>
<section class="workspace" hidden>
  <header class="activity-heading"><div><h1>What’s happening</h1><p class="intro">Follow your team’s activity. Open an action to inspect its recorded evidence.</p></div><span>Activity</span></header>
  <p class="intro"><strong>Runs are free.</strong> Credits record earned work; running an agent does not spend them. Credits and ratings do not restrict access.</p>
  <div class="history-controls">
    <label>Agent<select id="history-agent"><option value="">All agents</option></select></label>
    <label>Search actions<input id="history-search" type="search" placeholder="Tool, model, task, or status…"></label>
    <button id="history-refresh" type="button">Refresh</button>
  </div>
  <p class="status" id="history-status" role="status">Loading activity…</p>
  <details class="activity-reputation"><summary>Credits &amp; work reputation</summary><section aria-label="Agent credits and work reputation"><div id="history-credits"></div></section></details>
  <h2>Recent actions</h2>
  <div id="history-list"></div>
  <p class="intro">Shows up to 500 recent recorded actions. Prompts, tool arguments, outputs, and message bodies are omitted from the activity log.</p>
</section>
</template>
<script>
(function(){
 const M=window.fleetModel,W=window.workspaceModel,E=M.el;
 class HistoryView extends HTMLElement {
  connectedCallback(){
   if(this.wired)return;this.wired=true;
   this.host=this.querySelector('section');this.note=this.querySelector('#history-status');
   this.list=this.querySelector('#history-list');this.credits=this.querySelector('#history-credits');this.agent=this.querySelector('#history-agent');
   this.search=this.querySelector('#history-search');this.refresh=this.querySelector('#history-refresh');
   this.events=[];this.openActions=new Set();this.closedAgents=new Set();this.openReputation=new Set();
   this.agent.onchange=()=>this.paint();this.search.oninput=()=>this.paint();this.refresh.onclick=()=>this.load();
   W.route(this.host,'history',()=>this.load());
   this.timer=setInterval(()=>{if(!this.host.hidden)this.load();},10000);
  }
  disconnectedCallback(){clearInterval(this.timer);}
  actor(event){return event.refs?.agent||event.refs?.from||event.actor||'Unattributed';}
  async load(){
   if(this.loading)return;this.loading=true;this.refresh.disabled=true;
   try{
    const data=await W.api('/ui/history/events');this.events=data.events||[];this.data=data;
    const selected=this.agent.value;
    this.agent.replaceChildren(E('option',{value:''},'All agents'),...[...new Set(this.events.map(e=>this.actor(e)))].sort().map(name=>E('option',{value:name},name)));
    this.agent.value=selected;this.paint();
    const reputation=await W.api('/ui/work-reputation/standings').catch(()=>null);
    this.reputation=reputation;
    const agents=new Set([...this.events.map(e=>this.actor(e)),...(reputation?.team||[]).map(item=>item.agent)]);
    this.agent.replaceChildren(E('option',{value:''},'All agents'),...[...agents].sort().map(name=>E('option',{value:name},name)));
    this.agent.value=selected;this.paint();
   }catch(error){W.status(this.note,error);}
   finally{this.loading=false;this.refresh.disabled=false;}
  }
  paint(){
   const query=this.search.value.trim().toLowerCase(),groups=new Map();
   for(const event of this.events){
    const actor=this.actor(event);
    if(this.agent.value&&actor!==this.agent.value&&!(this.reputation?.team||[]).some(item=>this.matches(item,actor)&&this.matches(item,this.agent.value)))continue;
    if(query&&!JSON.stringify(event).toLowerCase().includes(query))continue;
    if(!groups.has(actor))groups.set(actor,[]);groups.get(actor).push(event);
   }
   this.list.replaceChildren(...[...groups].map(([actor,events])=>{
    const card=E('details',{class:'workspace-card history-agent',open:!this.closedAgents.has(actor)},
      E('summary',{},actor,E('span',{class:'history-count'},`${events.length} actions`)),...events.map(event=>this.action(event)));
    card.ontoggle=()=>card.open?this.closedAgents.delete(actor):this.closedAgents.add(actor);return card;
   }));
   const team=(this.reputation?.team||[]).filter(item=>!this.agent.value||this.matches(item,this.agent.value));
   this.credits.replaceChildren(...team.map(item=>this.standing(item)),...(team.length?[]:[E('p',{class:'intro'},this.reputation?'No recorded standings match this agent.':'Credit and reputation records are unavailable.')]));
   const count=[...groups.values()].reduce((sum,events)=>sum+events.length,0);
   this.note.textContent=count?`${count} actions · newest first · refreshed ${new Date().toLocaleTimeString()}`:this.events.length?'No actions match these filters.':'No activity has been recorded yet.';
   if(this.data?.unreadable)this.note.textContent+=` · ${this.data.unreadable} unreadable records`;
   if(this.data?.drops?.dropped)this.note.textContent+=` · ${this.data.drops.dropped} dropped records`;
  }
  matches(item,actor){return item.agent===actor||`agent:${item.agent}`===actor||[...(item.aliases||[]),...(item.members||[])].includes(actor.replace(/^agent:/,''));}
  metric(label,value){return E('div',{class:'history-metric'},E('strong',{},String(value)),E('span',{},label));}
  standing(standing){
   const actor=standing.agent,economy=standing.economy,display=standing.label||actor;
   const title=economy?`${display} · ${economy.balance} credits`:`${display} · ${standing.verified_tasks} verified tasks`;
   const box=E('details',{class:'workspace-card history-action',open:this.openReputation.has(actor)},E('summary',{},title));
   box.ontoggle=()=>box.open?this.openReputation.add(actor):this.openReputation.delete(actor);
   box.append(E('p',{class:'intro'},`Account identity: ${actor}${standing.account_type==='model_family'?' · Model family across devices':''}`));
   if(standing.devices?.length)box.append(E('details',{},E('summary',{},`${standing.devices.length} contributing devices`),...standing.devices.map(id=>E('p',{class:'intro'},id))));
   if(standing.members?.length)box.append(E('p',{class:'intro'},`Workers: ${standing.members.join(', ')}`));
   const metrics=E('div',{class:'history-economy'});
   if(economy)metrics.append(this.metric('Credit balance',economy.balance),this.metric('Credits earned',economy.earned),this.metric('Completion credits',economy.completion_credits),this.metric('Quality bonus credits',economy.quality_credits));
   metrics.append(this.metric('Verified tasks',standing.verified_tasks));box.append(metrics);
   if(standing.work_reputation)box.append(this.reputationDetails(standing.work_reputation));
   else box.append(E('p',{class:'intro'},'Work reputation: no independent quality or reliability assessment recorded.'));
   const usage=economy?.usage;
   if(usage?.recorded&&usage.tasks)box.append(E('p',{class:'intro'},`Recorded compute usage · ${usage.tasks} tasks${usage.tokens_in!=null?` · ${usage.tokens_in} input tokens`:''}${usage.tokens_out!=null?` · ${usage.tokens_out} output tokens`:''}${usage.wall_seconds!=null?` · ${Number(usage.wall_seconds).toFixed(1)} seconds`:''}`));
   if(standing.evidence_held)box.append(E('p',{class:'intro'},`${standing.evidence_held} earlier verifications remain in the encrypted ledger.`));
   for(const evidence of standing.evidence||[])box.append(this.evidence(evidence));
   if(standing.evidence_held)box.append(W.button('Load earlier verification evidence',async()=>{
    const more=await W.api(`/ui/work-reputation/standings?agent=${encodeURIComponent(actor)}&offset=${standing.evidence.length}`);
    const next=more.team.find(item=>item.agent===actor);
    if(next){standing.evidence.push(...next.evidence);standing.evidence_held=next.evidence_held;this.paint();}
   }));
   return box;
  }
  reputationDetails(reputation){
   const section=E('section',{'aria-label':'Work reputation'},E('h3',{},'Work reputation'));
   const qualitySamples=reputation.quality_samples??reputation.samples??0,reliabilitySamples=reputation.reliability_samples??reputation.samples??0;
   const metrics=E('div',{class:'history-economy'});
   metrics.append(this.metric('Quality · out of 100',qualitySamples?reputation.quality:'Not yet rated'),this.metric('Reliability · out of 100',reliabilitySamples?reputation.reliability:'Not yet rated'));
   section.append(metrics,E('p',{class:'intro'},`${qualitySamples} independent reviews · ${reliabilitySamples} accepted or rejected outcomes · ${Math.round((reputation.confidence||0)*100)}% confidence. Quality requires independent review; reliability uses actual task outcomes. Infrastructure blockage does not lower reliability.`));
   if(reputation.outcomes)section.append(E('p',{class:'intro'},`${reputation.outcomes.accepted||0} accepted · ${reputation.outcomes.rejected||0} rejected · ${reputation.outcomes.blocked_infrastructure||0} infrastructure blockages`));
   return section;
  }
  evidence(evidence){
   const detail=E('details',{open:this.openActions.has(evidence.id)},E('summary',{},`Task ${evidence.task} · verified by ${evidence.verifier}`));
   detail.ontoggle=()=>detail.open?this.openActions.add(evidence.id):this.openActions.delete(evidence.id);
   if(evidence.award){
    const award=evidence.award;
    detail.append(E('p',{},`${award.total} credits earned · ${award.base} completion + ${award.quality_bonus} quality bonus`));
    const labels={validated:'Validated result',regression:'Regression coverage',impact:'Verified impact'};
    for(const quality of award.quality||[])detail.append(E('section',{},E('h4',{},labels[quality.kind]||quality.kind),E('p',{},quality.reason),E('p',{class:'intro'},`Checks: ${(quality.checks||[]).join(', ')||'Not recorded'}`),E('p',{class:'intro'},`Artifacts: ${(quality.artifacts||[]).join(', ')||'Not recorded'}`)));
   }
   if(evidence.review)detail.append(E('h4',{},'Independent review'),E('p',{},`Quality ${evidence.review.quality}/100 · Reliability ${evidence.review.reliability}/100`),E('p',{},evidence.review.reason));
   const fields=E('dl');
   for(const [key,value]of Object.entries(evidence))if(key!=='award'&&key!=='review')fields.append(E('dt',{},key.replaceAll('_',' ')),E('dd',{},typeof value==='object'?W.json(value):String(value)));
   detail.append(E('h4',{},'Verification evidence'),fields);return detail;
  }
  action(event){
   const refs=event.refs||{},meta=event.meta||{},time=new Date(event.ts*1000);
   const summary=E('summary',{},E('strong',{},event.subject||event.kind),E('span',{class:'badge'},event.outcome||event.kind),meta.model?E('span',{class:'history-count'},meta.model):null,E('time',{datetime:time.toISOString()},time.toLocaleString()));
   const values={Action:event.kind,Status:event.outcome||'Not recorded',Actor:event.actor,Session:event.session,Record:event.id,...Object.fromEntries(Object.entries(refs).map(([key,value])=>[`Reference · ${key}`,value])),...Object.fromEntries(Object.entries(meta).map(([key,value])=>[`Detail · ${key}`,value]))};
   const fields=E('dl');for(const [key,value]of Object.entries(values))fields.append(E('dt',{},key),E('dd',{},typeof value==='object'?W.json(value):String(value??'')));
   const links=E('div',{class:'history-links'},E('a',{href:'#board'},'Open board'));
   for(const [key,value]of Object.entries({...refs,...meta})){
    if(!/url|issue|task/.test(key)||typeof value!=='string')continue;
    try{const url=new URL(value);if(url.protocol==='https:'||url.protocol==='http:')links.append(E('a',{href:url.href,target:'_blank',rel:'noopener noreferrer'},key.replaceAll('_',' ')));}catch{}
   }
   const row=E('details',{class:'history-action',open:this.openActions.has(event.id)},summary,fields,links);
   row.ontoggle=()=>row.open?this.openActions.add(event.id):this.openActions.delete(event.id);return row;
  }
 }
 customElements.define('history-view',HistoryView);
})();
</script>
