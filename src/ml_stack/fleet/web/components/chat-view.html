<!-- chat-view: the kept conversations, and one put to whatever is serving a model -->
<template>
  <main class="chatmain" id="chat" hidden>
    <div class="chats" id="chat-list"></div>
    <div class="talk">
      <div class="pickrow" id="chat-pickrow" hidden>
        <label for="model">Model</label>
        <select id="model"></select>
      </div>
      <div class="hint" id="chat-none" hidden>
        No model is running yet. Start one on the Models screen, or leave another
        machine on your network serving one.
      </div>
      <div class="messages" id="chat-messages"></div>
      <div id="chat-note"></div>
      <div class="askrow" id="chat-askrow" hidden>
        <textarea id="ask" rows="3" placeholder="Ask it something" aria-label="Message" aria-describedby="chat-shortcut"></textarea>
        <button id="chat-send" title="Enter to send · Shift+Enter for a new line">Send</button>
        <button id="chat-cancel" class="ghost" hidden>Stop generating</button>
      </div>
      <p class="hint" id="chat-shortcut">Enter to send · Shift+Enter for a new line</p>
    </div>
  </main>
</template>
<script>
(function () {
  const M = window.fleetModel;
  const el = M.el;
  const api = M.api;

  class ChatView extends HTMLElement {
    connectedCallback() {
      if (this.wired) return;
      this.wired = true;
      this.box = this.querySelector("#chat");
      this.sidebar = this.querySelector("#chat-list");
      this.picker = this.querySelector("#model");
      this.pickrow = this.querySelector("#chat-pickrow");
      this.none = this.querySelector("#chat-none");
      this.list = this.querySelector("#chat-messages");
      this.note = this.querySelector("#chat-note");
      this.askrow = this.querySelector("#chat-askrow");
      this.input = this.querySelector("#ask");
      this.send = this.querySelector("#chat-send");
      this.cancelButton = this.querySelector("#chat-cancel");
      this.cancelButton.onclick = () => this.controller?.abort();
      this.requestSeq = 0;
      this.open = null;
      this.send.onclick = () => this.ask();
      this.input.onkeydown = (e) => {
        if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
          e.preventDefault(); this.ask();
        }
      };
      M.onRoute((route) => {
        const on = route === "chat";
        this.box.hidden = !on;
        if (on) this.draw();
      });
    }

    /** One message in the transcript; returns the node the reply streams into. */
    say(role, text, reasoning = "") {
      const node = el("div", { class: `msg ${role}` });
      if (role === "assistant") {
        const details = el("details", { class: "model-reasoning" }, el("summary", {}, "Model reasoning"),
          el("pre", { class: "reasoning-text" }, reasoning));
        details.hidden = !reasoning;
        node.append(details, el("div", { class: "answer-text" }, text),
          el("span", { class: "reply-activity", role: "status" }));
      } else node.textContent = text;
      this.list.append(node);
      this.list.scrollTop = this.list.scrollHeight;
      return node;
    }

    async draw() {
      const where = await api("/ui/chat");
      if (M.refused(where)) return;
      const available = where.models || [];
      this.picker.replaceChildren(...available.map((m) =>
        el("option", { value: m.model }, m.local ? m.model : `${m.model} — on ${m.peer}`)));
      this.pickrow.hidden = !available.length;
      this.askrow.hidden = !available.length;
      this.none.hidden = !!available.length;
      await this.paintList();
      if (this.open) this.load(this.open);
    }

    async paintList() {
      const saved = await api("/ui/conversations");
      const rows = saved.conversations || [];
      this.sidebar.replaceChildren(
        el("button", { class: "ghost small",
          onclick: () => { this.cancelForSwitch(); this.open = null; this.list.replaceChildren(); this.paintList(); } },
          "New chat"),
        ...rows.map((c) =>
          el("div", { class: `chatrow${c.id === this.open ? " on" : ""}` },
            el("a", { href: "#",
              onclick: (e) => { e.preventDefault(); this.load(c.id).then(() => this.paintList()); } },
              c.title || "New chat"),
            el("button", { class: "ghost small",
              onclick: async () => {
                await api(`/ui/conversations/${c.id}`, { method: "DELETE" });
                if (this.open === c.id) { this.open = null; this.list.replaceChildren(); }
                this.paintList();
              } }, "Delete"))));
    }

    async load(id) {
      this.cancelForSwitch();
      const sequence = this.loadSeq = (this.loadSeq || 0) + 1;
      this.open = id;
      this.note.textContent = "Opening conversation…";
      const one = await api(`/ui/conversations/${id}`);
      if (sequence !== this.loadSeq) return;
      this.list.replaceChildren();
      for (const m of one.messages || []) this.say(m.role, m.content, m.reasoning || "");
      if (one.model) this.picker.value = one.model;
      this.note.textContent = one.error || "";
    }

    cancelForSwitch() {
      this.controller?.abort();
      this.controller = null;
      this.requestSeq++;
      this.send.disabled = false;
      this.cancelButton.hidden = true;
      this.list.removeAttribute("aria-busy");
    }

    async ask() {
      const text = this.input.value.trim();
      if (!text || this.send.disabled || !this.picker.value) return;
      this.list.setAttribute("aria-busy", "true");
      this.input.value = "";
      this.note.replaceChildren();
      this.send.disabled = true;
      this.cancelButton.hidden = false;
      this.controller = new AbortController();
      const sequence = ++this.requestSeq;
      this.say("user", text);
      const reply = this.say("assistant", "");
      const activity = reply.querySelector(".reply-activity");
      activity.textContent = "Waiting for model…";
      try {
        if (!this.open) {
          const made = await api("/ui/conversations", { method: "POST",
            body: JSON.stringify({ model: this.picker.value }) });
          if (sequence !== this.requestSeq) return;
          if (made.error || !made.id) throw new Error(made.error || "Could not create the conversation.");
          this.open = made.id;
        }
        const r = await fetch("/ui/chat", { method: "POST", headers: M.headers,
          signal: this.controller.signal,
          body: JSON.stringify({ conversation: this.open, model: this.picker.value,
            stream: true, messages: [{ role: "user", content: text }] }) });
        if (!r.ok) {
          const why = await r.json().catch(() => ({}));
          reply.remove();
          this.note.replaceChildren(el("div", { class: "err" },
            why.error || "That did not go through."));
          return;
        }
        const result = await M.readChatStream(r, (delta) => {
          if (delta.activity) activity.textContent = delta.activity;
          if (delta.reasoning) {
            const details = reply.querySelector(".model-reasoning");
            details.hidden = false;
            details.querySelector(".reasoning-text").append(document.createTextNode(delta.reasoning));
          }
          if (delta.content) reply.querySelector(".answer-text").append(document.createTextNode(delta.content));
          this.list.scrollTop = this.list.scrollHeight;
        });
        if (!result.content) throw new Error("The model returned no answer. Try again or choose another model.");
      } catch (error) {
        if (sequence === this.requestSeq) this.controller?.abort();
        if (sequence === this.requestSeq) this.note.replaceChildren(el("div", {
          class: error.name === "AbortError" ? "hint" : "err",
        }, error.name === "AbortError" ? "Generation cancelled." : error.message));
      } finally {
        if (reply) reply.querySelector(".reply-activity").textContent = "";
        if (sequence === this.requestSeq) {
          this.list.removeAttribute("aria-busy");
          this.send.disabled = false;
          this.cancelButton.hidden = true;
          this.controller = null;
          this.paintList();
        }
      }
    }


  }
  customElements.define("chat-view", ChatView);
})();
</script>
