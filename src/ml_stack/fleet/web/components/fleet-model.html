<!-- fleet-model: the daemon's routes, the pieces every screen builds out of, and which screen is showing -->
<style>
cluster-view, chat-view, models-view, settings-view, fit-view, data-view, training-view, gym-view, benchmarks-view, tools-view { display: contents; }
[hidden] { display: none !important; }
</style>
<script>
(function () {
  const M = window.fleetModel = {};
  const H = M.headers = { "X-ML-Stack-UI": "1", "Content-Type": "application/json" };

  let releaseBoot;
  const bootReady = new Promise(resolve => { releaseBoot = resolve; });

  M.MIN_PASS = 5;

  M.downloadMessage = function (g) {
    if (g.error) return g.error;
    const parts = [g.note || (g.phase === "mtp" ? "Downloading MTP head" : "Downloading model")];
    if (g.speed_bps > 0) parts.push(`${M.fileSize(g.speed_bps)}/s`);
    if (g.eta_s !== null && g.eta_s !== undefined) {
      parts.push(`about ${Math.max(1, Math.ceil(g.eta_s / 60))} min left`);
    }
    return parts.join(" · ");
  };

  /** One call to the daemon: `{ok, status, ...body}`. */
  async function request(path, opts = {}) {
    const r = await fetch(path, { ...opts, headers: { ...H, ...(opts.headers || {}) } });
    let body = {};
    try { body = await r.json(); } catch { /* an empty body is fine */ }
    return { ok: r.ok, status: r.status, ...body };
  }

  M.api = async function (path, opts = {}) {
    const signal = opts.signal;
    signal?.throwIfAborted();
    let aborted;
    try {
      await (signal ? Promise.race([bootReady, new Promise((_, reject) => {
        aborted = () => reject(signal.reason);
        signal.addEventListener("abort", aborted, {once:true});
      })]) : bootReady);
    } finally {
      if (aborted) signal.removeEventListener("abort", aborted);
    }
    signal?.throwIfAborted();
    return request(path, opts);
  };

  /** One element, its attributes and its children. */
  M.el = function (tag, attrs = {}, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") n.className = v;
      else if (k === "html") n.innerHTML = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else if (["disabled", "checked", "selected", "hidden", "required", "multiple", "readonly", "open"].includes(k) && typeof v === "boolean") n.toggleAttribute(k, v);
      else if (v !== null && v !== undefined) n.setAttribute(k, v);
    }
    for (const kid of kids.flat()) {
      if (kid === null || kid === undefined || kid === false) continue;
      n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return n;
  };
  const el = M.el;

  M.preferences = {always_show_advanced:false};
  M.applyAdvanced = function (root = document) {
    const details = [...root.querySelectorAll("details")];
    if (root.matches?.("details")) details.unshift(root);
    for (const node of details) {
      if (!node.hasAttribute("data-advanced") && !/advanced/i.test(node.querySelector(":scope > summary")?.textContent || "")) continue;
      node.setAttribute("data-advanced", "");
      if (M.preferences.always_show_advanced) node.open = true;
    }
  };
  M.setPreferences = function (settings) {
    const previous = M.preferences.always_show_advanced;
    M.preferences = {...settings, always_show_advanced:settings.always_show_advanced === true};
    if (previous && !M.preferences.always_show_advanced) {
      for (const node of document.querySelectorAll("details[data-advanced]")) node.open = false;
    }
    M.applyAdvanced();
    window.dispatchEvent(new CustomEvent("fleet-preferences", {detail:M.preferences}));
  };
  new MutationObserver(records => {
    for (const record of records) for (const node of record.addedNodes) {
      if (node.nodeType === Node.ELEMENT_NODE) M.applyAdvanced(node);
    }
  }).observe(document.documentElement, {childList:true, subtree:true});
  document.addEventListener("toggle", event => {
    if (M.preferences.always_show_advanced && event.target.matches?.("details[data-advanced]") && !event.target.open) event.target.open = true;
  }, true);
  M.loadPreferences = async function () {
    const result = await request("/ui/settings");
    if (result.ok && !result.error) M.setPreferences(result.settings || {});
  };

  /** An ml-ui element with its properties set; a property set before the element is defined
      is kept by the element when it upgrades. */
  M.ui = function (tag, props = {}) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) if (v !== null && v !== undefined) n[k] = v;
    return n;
  };

  /** The children that are there: `replaceChildren` writes the word "null" for a gap. */
  M.kids = (...nodes) => nodes.flat()
    .filter((n) => n !== null && n !== undefined && n !== false);

  M.row = (label, why) => el("span", {},
    el("b", {}, label), why ? el("span", { class: "why" }, why) : null);

  M.gb = (n) => (n === undefined || n === null ? null : `${Number(n).toFixed(1)} GB`);

  M.fileSize = (n) => {
    if (n >= 1e9) return `${(n / 1e9).toFixed(1)} GB`;
    if (n >= 1e6) return `${Math.round(n / 1e6)} MB`;
    if (n >= 1e3) return `${Math.round(n / 1e3)} KB`;
    return `${n || 0} bytes`;
  };

  // The badge has to be right: torch's ROCm build answers True to every CUDA question,
  // so the daemon reports vendor separately and this only renders what it is told.
  M.vendorOf = function (d = {}) {
    if (d.rocm || d.vendor === "amd") return { key: "amd", text: "AMD · ROCm" };
    if (d.cuda || d.vendor === "nvidia") return { key: "nvidia", text: "NVIDIA · CUDA" };
    if (d.vendor === "apple") return { key: "apple", text: "Apple · Metal" };
    return { key: "cpu", text: `${d.cpus || "?"} CPU` };
  };

  const CTX_STEPS = M.CTX_STEPS = [2048, 4096, 8192, 16384, 32768, 65536, 131072, 262144, 524288, 1048576];
  const KV_MB_PER_TOKEN = 17 * 4 * 256 * 2 * (34 / 32) / (1024 * 1024);

  M.ctxWords = (tokens) => `${Number(tokens).toLocaleString()} tokens`;

  M.contextPicker = function (start, onPick) {
    const slider = M.ui("ml-slider", {
      label: "Context length", stops: CTX_STEPS,
      value: CTX_STEPS.includes(start) ? start : 8192,
      hint: "Maximum tokens in the model's context. Larger contexts require more memory." });
    slider.id = "ctx";
    const paint = (n) => {
      slider.valueText = `${new Intl.NumberFormat().format(n)} tokens`;
      slider.hint = n > 262144
        ? "Extended context: Qwen uses YaRN above its native 256K window. Larger contexts require more memory."
        : "Maximum tokens in the model’s context. Larger contexts require more memory.";
      onPick(n);
    };
    slider.addEventListener("input", (e) => {
      if (Number.isFinite(e.detail?.value)) paint(e.detail.value);
    });
    paint(slider.value);
    return el("div", { class: "meter" }, slider);
  };

  // ------------------------------------------------------------- which screen is showing
  const IN_APP = ["tasks", "history", "chat", "board", "projects", "models", "data", "training", "gym", "benchmarks", "cluster", "tools", "settings", "fit"];
  const available = (name) => IN_APP.includes(name) && !!document.querySelector(`${name}-view`);
  M.requestedRoute = "";
  const watchers = [];
  M.route = "";
  M.group = "";
  M.inCluster = false;
  M.signInMessage = "";

  /** Show one screen by name, and tell every component that is watching. */
  M.go = function (name, remember = true) {
    if (name === "cluster" && ["sign-in", "first-run"].includes(M.route) && available(M.requestedRoute)) {
      name = M.requestedRoute;
    }
    if (IN_APP.includes(name) && !available(name)) name = available("cluster") ? "cluster" : "fit";
    if (IN_APP.includes(name)) {
      M.requestedRoute = name;
      if (remember && location.hash !== `#${name}`) history.pushState(null, "", `#${name}`);
    }
    if (["sign-in", "first-run"].includes(M.route) && IN_APP.includes(name)) M.loadPreferences().catch(() => {});
    M.route = name;
    const app = document.getElementById("app");
    if (app) app.hidden = !IN_APP.includes(name);
    for (const fn of watchers) fn(name);
    const workspace = document.getElementById("workspace");
    if (workspace && IN_APP.includes(name)) workspace.scrollTop = 0;
  };

  function followLocation() {
    const name = location.hash.slice(1);
    if (!available(name)) return;
    M.requestedRoute = name;
    if (IN_APP.includes(M.route) && M.route !== name) M.go(name, false);
  }
  window.addEventListener("popstate", followLocation);
  window.addEventListener("hashchange", followLocation);

  /** Run `fn` whenever the screen changes, and now if one is already showing. */
  M.onRoute = function (fn) {
    watchers.push(fn);
    if (M.route) fn(M.route);
  };

  /** Ask for the passphrase, saying why. */
  M.signIn = function (message) {
    M.signInMessage = message || "";
    M.go("sign-in");
  };

  /** True when the route refused for want of a session, and the screen has been changed. */
  M.refused = function (r) {
    if (r && r.status === 401) {
      if (M.route !== "first-run") M.signIn();
      return true;
    }
    return false;
  };

  M.signOut = async function (e) {
    if (e) e.preventDefault();
    await M.api("/ui/session", { method: "DELETE" });
    M.signIn();
  };

  /** What to show when the page opens: setup, sign in, or a screen. */
  M.boot = async function () {
    try {
      const launchURL = new URL(location.href);
      const ticket = launchURL.searchParams.get("launch_ticket");
      if (ticket !== null) {
        launchURL.searchParams.delete("launch_ticket");
        history.replaceState(null, "", launchURL.pathname + launchURL.search + launchURL.hash);
        if (location.hostname === "127.0.0.1" || location.hostname === "localhost" || location.hostname === "[::1]") {
          try { await request("/ui/session", {method:"POST", body:JSON.stringify({ticket})}); }
          catch (_) { /* The ordinary sign-in view handles expired tickets. */ }
        }
      }
      const hash = location.hash.slice(1);
      const asked = available(hash) ? hash
        : (location.pathname.replace(/\/$/, "") === "/ui/fit" ? "fit" : "cluster");
      const opened = document.querySelector(`${asked}-view`) ? asked
        : (IN_APP.find((n) => document.querySelector(`${n}-view`)) || asked);
      M.requestedRoute = opened;
      const setup = await request("/ui/setup");
      M.group = setup.group || "";
      M.inCluster = !!setup.needs_password;
      if (setup.needs_setup && document.querySelector("first-run")) { releaseBoot(); return M.go("first-run"); }
      if (!setup.needs_password) { await M.loadPreferences(); releaseBoot(); return M.go(opened); }
      if (setup.cluster_mode === "dev" && ["127.0.0.1", "localhost", "[::1]"].includes(location.hostname)) {
        await request("/ui/setup/local-session", { method: "POST" });
      }
      const s = await request("/ui/session");
      if (s.signed_in) await M.loadPreferences();
      releaseBoot();
      return s.signed_in ? M.go(opened) : M.signIn();
    } finally {
      releaseBoot();
    }
  };

  M.followSetupJob = async function (job, onUpdate = () => {}) {
    let current = job;
    while (true) {
      onUpdate(current);
      if (current.state === "done") return current.result || {};
      if (current.state === "failed") throw new Error(current.error || current.note || "Installation failed.");
      await new Promise((resolve) => setTimeout(resolve, 1000));
      const response = await M.api("/ui/setup/jobs");
      if (response.error || response.status === 401) throw new Error(response.error || "Sign in to check installation status.");
      current = (response.jobs || []).find((candidate) => candidate.id === job.id);
      if (!current) throw new Error("Installation status is unavailable. Open settings to retry.");
    }
  };

  class FleetModel extends HTMLElement {
    connectedCallback() {
      if (this.wired) return;
      this.wired = true;
      M.boot();
    }
  }
  customElements.define("fleet-model", FleetModel);
})();
</script>
