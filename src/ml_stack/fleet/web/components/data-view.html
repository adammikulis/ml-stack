<style>
data-view #files .workspace-actions { margin:0; padding:10px 0; border-bottom:1px solid var(--line); }
data-view #files .workspace-actions > span { margin-left:auto; color:var(--muted); }
data-view #upload input:not([type=checkbox]) { width:100%; }
data-view #crumbs { display:flex; gap:8px; flex-wrap:wrap; }
</style>
<template><section class="workspace" hidden><h1>Datasets</h1><p class="intro">Prepare training examples, inspect their content, then send a dataset to the Training lab.</p><div class="workspace-grid"><div class="workspace-card" id="upload"></div><div class="workspace-card"><h2>Dataset library</h2><div id="crumbs"></div><p class="status" role="status" aria-live="polite"></p><div id="files"></div><pre id="preview">Select a file to preview it.</pre></div></div></section></template>
<script>
(function(){const M=window.fleetModel,W=window.workspaceModel,E=M.el;
class DataView extends HTMLElement{
 connectedCallback(){if(this.wired)return;this.wired=true;this.host=this.querySelector('section');this.note=this.querySelector('.status');this.path='';const box=this.querySelector('#upload');box.append(E('h2',{},'1 · Prepare a dataset'));this.name=W.field(box,'Destination relative to files root','input',{placeholder:'datasets/examples.jsonl'});this.file=W.field(box,'Choose a text / JSONL file','input',{type:'file',accept:'.jsonl,.json,.csv,.txt,.yaml,.yml'});this.text=W.field(box,'Or paste dataset content','textarea',{placeholder:'One JSON object per line'});this.uploadButton=W.button('Upload',()=>this.upload());box.append(E('div',{class:'workspace-actions'},this.uploadButton));box.append(E('p',{class:'intro'},'Uploads create a new file, up to 10 MB. Recipe training shows the required dataset fields before you start. Larger files can be transferred with ml-stack-peers in Tools.'));this.file.addEventListener('change',()=>{if(this.file.files[0]&&!this.name.value)this.name.value='datasets/'+this.file.files[0].name;});W.route(this.host,'data',()=>this.load());}
 async load(){try{const r=await W.api('/ui/workspace/files?path='+encodeURIComponent(this.path));this.note.textContent=r.root;this.querySelector('#crumbs').replaceChildren(W.button('Files root',()=>{this.path='';this.load();}),this.path?W.button('Parent folder',()=>{this.path=this.path.split('/').slice(0,-1).join('/');this.load();}):null);this.querySelector('#files').replaceChildren(...r.files.map(f=>E('div',{class:'workspace-actions'},W.button((f.directory?'Folder · ':'')+f.name,()=>this.open(f)),E('span',{},f.directory?'':M.fileSize(f.bytes)),f.directory?null:W.button('Use for training',()=>{sessionStorage.setItem('ml-stack-dataset',f.path);M.go('training');}))));if(!r.files.length)this.querySelector('#files').append(E('p',{},'This folder is empty. Upload a dataset to get started.'));}catch(e){W.status(this.note,e);}}
 async open(f){if(f.directory){this.path=f.path;return this.load();}try{const r=await W.api('/ui/workspace/file?path='+encodeURIComponent(f.path));this.querySelector('#preview').textContent=r.text+(r.truncated?'\n[Preview truncated]':'');}catch(e){W.status(this.note,e);}}
 async upload(){if(this.pending)return;try{const path=this.name.value.trim(),file=this.file.files[0];if(!path)throw Error('Choose a destination filename before uploading.');if(file&&file.size>10000000)throw Error('File exceeds the 10 MB upload limit.');if(!file&&!this.text.value.trim())throw Error('Choose a file or paste dataset content before uploading.');this.pending=true;this.uploadButton.disabled=true;this.uploadButton.textContent='Uploading…';this.note.textContent='Uploading dataset…';await W.post('/ui/workspace/file',{path,text:file?await file.text():this.text.value});this.path=path.split('/').slice(0,-1).join('/');await this.load();this.note.textContent='Dataset uploaded. Preview it, then choose Use for training.';}catch(e){W.status(this.note,e);}finally{this.pending=false;this.uploadButton.disabled=false;this.uploadButton.textContent='Upload';}}
}customElements.define('data-view',DataView);})();
</script>
