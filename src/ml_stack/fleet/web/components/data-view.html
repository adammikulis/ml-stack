<template><section class="workspace" hidden><h1>Data</h1><p class="intro">Browse daemon files, inspect datasets, and upload text or JSONL for training.</p><div class="workspace-grid"><div class="workspace-card" id="upload"></div><div class="workspace-card"><h2>Files</h2><div id="crumbs"></div><p class="status" role="status"></p><div id="files"></div><pre id="preview">Select a file to preview it.</pre></div></div></section></template>
<script>
(function(){const M=window.fleetModel,W=window.workspaceModel,E=M.el;
class DataView extends HTMLElement{
 connectedCallback(){if(this.wired)return;this.wired=true;this.host=this.querySelector('section');this.note=this.querySelector('.status');this.path='';const box=this.querySelector('#upload');box.append(E('h2',{},'Upload dataset'));this.name=W.field(box,'Destination relative to files root','input',{placeholder:'datasets/examples.jsonl'});this.file=W.field(box,'Choose a text / JSONL file','input',{type:'file',accept:'.jsonl,.json,.csv,.txt,.yaml,.yml'});this.text=W.field(box,'Or paste dataset content','textarea',{placeholder:'One JSON object per line'});box.append(E('div',{class:'workspace-actions'},W.button('Upload',()=>this.upload())));box.append(E('p',{class:'intro'},'Uploads create a new file, up to 10 MB. Larger files can be transferred with ml-stack-peers; open Tools for its commands.'));W.route(this.host,'data',()=>this.load());}
 async load(){try{const r=await W.api('/ui/workspace/files?path='+encodeURIComponent(this.path));this.note.textContent=r.root;this.querySelector('#crumbs').replaceChildren(W.button('Files root',()=>{this.path='';this.load();}),this.path?W.button('Parent folder',()=>{this.path=this.path.split('/').slice(0,-1).join('/');this.load();}):null);this.querySelector('#files').replaceChildren(...r.files.map(f=>E('div',{class:'workspace-actions'},W.button((f.directory?'Folder · ':'')+f.name,()=>this.open(f)),E('span',{},f.directory?'':M.fileSize(f.bytes)),f.directory?null:W.button('Use for training',()=>{sessionStorage.setItem('ml-stack-dataset',f.path);M.go('training');}))));if(!r.files.length)this.querySelector('#files').append(E('p',{},'This folder is empty. Upload a dataset to get started.'));}catch(e){W.status(this.note,e);}}
 async open(f){if(f.directory){this.path=f.path;return this.load();}try{const r=await W.api('/ui/workspace/file?path='+encodeURIComponent(f.path));this.querySelector('#preview').textContent=r.text+(r.truncated?'\n[Preview truncated]':'');}catch(e){W.status(this.note,e);}}
 async upload(){try{const file=this.file.files[0];if(file&&file.size>10000000)throw Error('File exceeds the 10 MB upload limit.');await W.post('/ui/workspace/file',{path:this.name.value,text:file?await file.text():this.text.value});this.path=this.name.value.split('/').slice(0,-1).join('/');await this.load();this.note.textContent='Dataset uploaded.';}catch(e){W.status(this.note,e);}}
}customElements.define('data-view',DataView);})();
</script>
