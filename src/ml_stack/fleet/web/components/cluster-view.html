<!-- cluster-view: the machines on this network, the clusters this one is in, and a sweep across them -->
<template>
  <main id="cluster" hidden>
    <h1>Cluster</h1>
    <p class="sub" id="cluster-sub"></p>
    <div class="stat" id="cluster-stat"></div>
    <div class="group" id="cluster-pause"></div>
    <div id="cluster-cards"></div>
    <div class="group" id="cluster-joined"></div>
    <fleet-benchmark></fleet-benchmark>
  </main>
</template>
<script>
(function () {
  const M = window.fleetModel;
  const el = M.el;
  const api = M.api;
  const gb = M.gb;

  /** One machine: what it is, what it is doing, and how hard. */
  function peerCard(p) {
    const d = p.device || {};
    const v = M.vendorOf(d);
    const slots = p.slots || 1;
    const free = p.free === undefined ? (p.busy ? 0 : slots) : p.free;
    const running = slots - free;
    const queued = p.queued || 0;

    const pips = el("div", { class: "slots" },
      Array.from({ length: Math.min(slots, 16) }, (_, i) =>
        el("i", { class: `slot${i < running ? " on" : ""}` })));

    const meters = [
      el("div", { class: "meter" },
        el("div", { class: "cap" },
          el("span", {}, "jobs"),
          el("b", {}, running === 0
            ? `none running · ${slots} slot${slots === 1 ? "" : "s"} free`
            : `${running} running of ${slots}${queued ? ` · ${queued} waiting` : ""}`)),
        pips),
    ];

    if (d.ram_gb) {
      const used = d.ram_used_gb;
      meters.push(M.ui("ml-meter", {
        label: "memory", capacity: d.ram_gb, unit: "GB", compact: true,
        ...(used === undefined ? { caption: `${gb(d.ram_gb)} total` }
          : { value: Math.max(0, used), caption: `${gb(used)} of ${gb(d.ram_gb)} in use` }) }));
    }

    if (d.cpu_pct !== undefined) {
      meters.push(M.ui("ml-meter", {
        label: "processors", capacity: 100, value: Math.min(100, d.cpu_pct), compact: true,
        caption: `${Math.round(d.cpu_pct)}% busy` }));
    }

    if (d.vram_total_gb && !d.unified_memory && d.vendor !== "apple") {
      const used = d.vram_total_gb - (d.vram_free_gb ?? d.vram_total_gb);
      meters.push(M.ui("ml-meter", {
        label: "video memory",
        capacity: d.vram_total_gb, value: Math.max(0, used), compact: true,
        caption: `${gb(d.vram_free_gb)} free of ${gb(d.vram_total_gb)}` }));
    }

    const chips = [];
    if (d.temp_c !== undefined) {
      const hot = d.temp_c >= 85 ? " hot" : d.temp_c >= 75 ? " warm" : "";
      chips.push(el("span", { class: `label temp${hot}` }, `${Math.round(d.temp_c)}°C`));
    }
    if (d.clock_mhz) chips.push(el("span", { class: "label" }, `${Math.round(d.clock_mhz)} MHz`));
    if (d.power_w !== undefined) chips.push(el("span", { class: "label" }, `${d.power_w.toFixed(1)} W`));
    if (d.throttled) chips.push(el("span", { class: "label bad" }, "▼ throttled"));
    if (chips.length) meters.push(el("div", { class: "chips" }, chips));

    if (d.gpu_util_pct !== undefined) {
      meters.push(M.ui("ml-meter", {
        label: "gpu", capacity: 100, value: Math.min(100, d.gpu_util_pct), compact: true,
        caption: `${Math.round(d.gpu_util_pct)}% busy` }));
    }

    const held = (d.availability || {}).paused;
    const state = held
      ? { cls: "busy", text: (d.availability.unavailable_because || "paused") }
      : free === 0
        ? { cls: "busy", text: queued ? `working · ${queued} waiting` : "working" }
        : { cls: "", text: running ? `${running} running · ${free} free` : "idle" };

    return el("div", { class: `peer${p.is_self ? " self" : ""}` },
      el("div", { class: "row" },
        el("div", {},
          el("div", { class: "name" }, p.name),
          el("div", { class: "url" }, p.base_url || p.host || ""))),
      el("div", { class: "row", style: "margin-top:10px;gap:6px;flex-wrap:wrap" },
        el("span", { class: `badge ${v.key}` }, el("span", { class: "chip" }), v.text),
        d.gpu ? el("span", { class: "label" }, d.gpu) : null,
        d.ram_gb ? el("span", { class: "label" }, `${Math.round(d.ram_gb)} GB RAM`) : null,
        (d.speech || []).length ? el("span", { class: "label" }, `speech: ${d.speech.join(", ")}`) : null),
      (p.clusters || []).length > 1
        ? el("div", { class: "labels" },
            p.clusters.map((c) => el("span", { class: "label" }, c)))
        : null,
      (d.labels || []).length
        ? el("div", { class: "labels" }, d.labels.map((l) => el("span", { class: "label" }, l)))
        : null,
      el("div", { class: "loaded-models" },
        el("h3", {}, "Loaded models"),
        ...(d.serving || []).length
          ? d.serving.flatMap((server) => (server.models || []).map((model) =>
              el("div", { class: "row" },
                el("b", {}, model),
                el("span", { class: "why" },
                  [(server.slot_context || server.context) ? `${Number(server.slot_context || server.context).toLocaleString()} tokens` : "",
                    server.draft_status === "active" ? "MTP active" : server.spec_type === "draft-mtp" ? "MTP configured" : "", `${server.slots || 1} slot(s)`]
                    .filter(Boolean).join(" · ")))))
          : [el("div", { class: "hint" }, "No models loaded")] ),
      ...meters,
      el("div", { class: "state" },
        el("span", { class: `pulse ${state.cls}` }),
        p.lock ? `measuring · ${p.lock}` : state.text,
        p.commit && p.commit !== "?" ? el("span", { class: "why" }, ` · ${p.commit}`) : null));
  }

  class ClusterView extends HTMLElement {
    connectedCallback() {
      if (this.wired) return;
      this.wired = true;
      this.box = this.querySelector("#cluster");
      this.sweep = { models: new Set(), peers: new Set(), sample: "", label: "", note: "" };
      M.onRoute((route) => {
        const on = route === "cluster";
        this.box.hidden = !on;
        clearTimeout(this.timer);
        if (on) this.draw();
      });
    }

    async draw() {
      const r = await api("/ui/fleet");
      if (M.refused(r)) return;
      if (this.box.hidden) return;
      M.group = r.group || "";
      const peers = r.peers || [];
      this.peers = peers;
      const totalSlots = peers.reduce((a, p) => a + (p.slots || 1), 0);
      const busy = peers.reduce((a, p) => a + ((p.slots || 1) - (p.free ?? 0)), 0);

      this.querySelector("#cluster-sub").textContent =
        peers.length === 1 ? "One machine." : `${peers.length} machines on this network.`;
      const paused = peers.filter((p) => ((p.device || {}).availability || {}).paused);
      this.drawPause(peers.length, paused.length);
      this.querySelector("#cluster-stat").replaceChildren(
        el("div", {}, el("div", { class: "n" }, peers.length),
           el("div", { class: "k" }, "machines")),
        el("div", {}, el("div", { class: "n" }, `${busy}/${totalSlots}`),
           el("div", { class: "k" }, "slots in use")),
        el("div", {}, el("div", { class: "n" }, `${paused.length}/${peers.length}`),
           el("div", { class: "k" }, "paused")),
        el("div", {}, el("div", { class: "n" },
             peers.filter((p) => M.vendorOf(p.device || {}).key !== "cpu").length),
           el("div", { class: "k" }, "with a GPU")));

      const alone = peers.length <= 1;
      this.querySelector("#cluster-cards").replaceChildren(...M.kids(
        peers.length ? el("div", { class: "grid" }, peers.map(peerCard)) : null,
        alone
          ? el("div", { class: "empty" },
              el("div", { class: "big" }, "Just this machine so far"),
              el("div", {}, "Install ml-stack on another machine and open it."),
              el("div", {}, "Dev connects trusted devices automatically. You can also pair manually below."))
          : null));

      const nav = document.querySelector("fleet-nav");
      if (nav && nav.paint) nav.paint("cluster");

      api("/ui/clusters").then((c) => this.drawClusters(c.clusters || []));
      this.drawSweep(r);

      clearTimeout(this.timer);
      this.timer = setTimeout(() => this.draw(), 4000);
    }

    drawPause(total, paused) {
      if (this.pauseNote === undefined) this.pauseNote = null;
      const span = el("select", { id: "pause-for" },
        [["2h", "for 2 hours"], ["30m", "for 30 minutes"], ["8h", "for 8 hours"],
         ["", "until I resume them"]].map(([v, t]) =>
          el("option", { value: v }, t)));
      span.value = this.pauseFor === undefined ? "2h" : this.pauseFor;
      span.onchange = () => { this.pauseFor = span.value; };
      const why = el("input", { type: "text", id: "pause-why",
        placeholder: "why (optional)", value: this.pauseWhy || "" });
      why.oninput = () => { this.pauseWhy = why.value; };
      const note = el("div", {}, this.pauseNote);
      const send = async (resume, button) => {
        button.disabled = true;
        note.replaceChildren(el("div", { class: "hint" }, el("span", { class: "spin" }),
          resume ? " Asking every machine to take work again…" : " Asking every machine to stop…"));
        const got = await api("/ui/fleet/pause", { method: "POST",
          body: JSON.stringify({ resume, for: resume ? "" : span.value,
                                 reason: resume ? "" : why.value.trim() }) });
        button.disabled = false;
        if (got.error) {
          this.pauseNote = el("div", { class: "err" }, got.error);
        } else {
          const missed = (got.machines || []).filter((m) => !m.ok);
          this.pauseNote = el("div", {},
            el("div", { class: missed.length ? "hint" : "ok" },
              `${resume ? "Taking work again" : "Paused"} on ${got.reached} of ${got.total}`
              + ` machine${got.total === 1 ? "" : "s"}.`),
            ...(got.machines || []).map((m) => el("div", { class: "row" },
              el("span", {}, el("b", {}, m.name + (m.is_self ? " (this machine)" : "")),
                el("span", { class: m.ok ? "why" : "err" }, m.said)))),
            missed.length
              ? el("div", { class: "hint" },
                  "A machine that is off or asleep never heard this, and takes work as "
                  + "soon as it is running again. Do this once more when it is back.")
              : null);
        }
        note.replaceChildren(this.pauseNote);
        this.draw();
      };
      const stop = el("button", { class: "ghost small" }, "Pause every machine");
      stop.onclick = () => send(false, stop);
      const go = el("button", { class: "ghost small" }, "Take work again");
      go.onclick = () => send(true, go);

      this.querySelector("#cluster-pause").replaceChildren(
        el("h2", {}, "Everyone's machines"),
        el("div", { class: "hint" },
          paused
            ? `${paused} of ${total} machine${total === 1 ? "" : "s"} ${paused === 1 ? "is" : "are"} paused.`
              + " A paused machine stops what it is running, keeps its progress and waits."
            : `All ${total} machine${total === 1 ? "" : "s"} ${total === 1 ? "is" : "are"} taking work.`),
        el("div", { class: "searchrow" }, span, why, stop, go),
        note);
    }

    drawClusters(rows) {
      const signature = JSON.stringify(rows.map(c => [c.group, c.mode, c.selection]));
      if (signature === this.clusterSignature) return;
      this.clusterSignature = signature;
      const joined = this.querySelector("#cluster-joined");
      const refresh = async () => {
        this.drawClusters((await api("/ui/clusters")).clusters || []);
        this.draw();
      };
      joined.replaceChildren(
        el("h2", {}, "Clusters"),
        el("div", { class: "hint" }, "This machine shares work with each cluster listed here."),
        ...M.kids(rows[0]?.mode === "dev" ? el("button", { class: "ghost small", onclick: async () => {
          const state = await api("/ui/setup");
          const result = await api("/ui/setup/initial", { method: "POST", body: JSON.stringify({
            name: state.name, cluster_mode: "dev", automatic: true }) });
          if (result.error) { joined.append(el("div", { class: "err" }, result.error)); return; }
          await refresh();
        } }, rows[0].selection === "manual" ? "Connect automatically" : "Automatic connection enabled") : null),
        ...(rows.length ? rows.map((c, i) =>
          el("div", { class: "row" },
            el("span", {}, el("b", {}, c.group),
              el("span", { class: "why" }, i === 0 ? "Primary cluster" : "Also joined")),
            el("button", { class: "ghost small", onclick: async () => {
              const left = await api("/ui/clusters", { method: "DELETE",
                body: JSON.stringify({ group: c.group }) });
              if (!left.error) await refresh();
            } }, "Leave"))) : [el("div", { class: "hint" }, "No cluster joined.")]),
        M.clusterForm({ endpoint: "/ui/clusters", groups: rows.map(c => c.group), group: rows[0]?.group || "default", onComplete: refresh }));
    }

    drawSweep(fleet) {
      this.querySelector("fleet-benchmark").update(fleet);
    }

  }
  customElements.define("cluster-view", ClusterView);
})();
</script>
