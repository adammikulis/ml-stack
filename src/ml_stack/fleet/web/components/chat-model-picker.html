<script>
(function () {
  const M = window.fleetModel;
  class ChatModelPicker {
    constructor(chat) {
      this.chat = chat;
      this.button = chat.querySelector("#chat-model-button");
      this.dialog = chat.querySelector("#chat-model-dialog");
      this.search = chat.querySelector("#chat-model-search");
      this.list = chat.querySelector("#chat-model-list");
      this.library = [];
      this.button.onclick = () => {
        if (chat.request) return;
        this.search.value = "";
        this.render();
        this.dialog.showModal();
        this.search.focus();
      };
      chat.querySelector("#chat-model-close").onclick = () => this.dialog.close();
      this.search.oninput = () => this.render();
      this.search.onkeydown = (event) => {
        if (event.key === "Escape") { event.preventDefault(); this.dialog.close(); return; }
        if (event.key === "Enter") {
          const first = this.list.querySelector("button:not(:disabled)");
          if (first) { event.preventDefault(); first.click(); }
        }
      };
    }
    async catalogue() {
      const data = await M.api("/ui/models");
      if (M.refused(data)) return;
      this.problem = data.ok ? '' : data.error || 'Could not read the model library.';
      if (data.ok) this.library = data.library || [];
    }
    rows() {
      const chat = this.chat;
      const rows = [...chat.picker.options].filter((one) => one.value).map((option) => {
        const live = (chat.chatModels || []).find((one) => [one.model, one.path].includes(option.value) ||
          one.model === option.textContent || one.model === option.value.split("/").pop());
        const installed = this.library.find((one) => one.path === option.value || one.name === option.textContent ||
          [one.name, one.path].includes(live?.model) || one.path === live?.path);
        return { value: option.value, name: installed?.name || option.textContent,
          family: installed?.family || "Other models", status: live ? "Loaded" : installed ? "Installed" :
          option.disabled ? "Unavailable" : chat.coding.active ? "Installed" : "Loaded",
          quant: installed?.quantization || "", disabled: option.disabled, installed };
      });
      if (!chat.coding.active) {
        for (const installed of this.library.filter((one) => one.servable)) {
          if (rows.some((one) => one.installed?.path === installed.path || one.name === installed.name)) continue;
          rows.push({ value: installed.path, name: installed.name, family: installed.family || "Other models",
            status: "Installed", quant: installed.quantization || "", installed, needsLoad: true });
        }
      }
      return rows;
    }
    render() {
      const chat = this.chat;
      this.button.textContent = chat.picker.selectedOptions[0]?.textContent || "Choose a model";
      this.button.disabled = !!chat.request;
      const query = this.search.value.trim().toLowerCase();
      const rows = this.rows().filter((one) => `${one.name} ${one.family} ${one.quant} ${one.status}`.toLowerCase().includes(query));
      const groups = new Map();
      for (const row of rows) {
        if (!groups.has(row.family)) groups.set(row.family, []);
        groups.get(row.family).push(row);
      }
      this.list.replaceChildren();
      for (const [family, models] of [...groups].sort(([a], [b]) => a.localeCompare(b))) {
        const group = M.el("section", { class: "chat-model-family" }, M.el("h3", {}, family));
        for (const row of models.sort((a, b) => Number(b.status === "Loaded") - Number(a.status === "Loaded") || a.name.localeCompare(b.name))) {
          group.append(M.el("button", { type: "button", class: "chat-model-choice",
            ...(row.disabled ? { disabled: "" } : {}),
            "aria-pressed": String(chat.picker.value === row.value), onclick: () => this.choose(row) },
          M.el("span", {}, row.name), M.el("small", {}, [row.status, row.quant].filter(Boolean).join(" · ")),
          row.needsLoad ? M.el("small", {class:"chat-model-action"}, "Configure in Models →") : null));
        }
        this.list.append(group);
      }
      if (!rows.length) this.list.append(M.el("p", { class: "hint" }, this.problem ||
        (query ? "No models match your search." : "No installed or running models are available.")),
        M.el('button', {type:'button', onclick:() => { this.dialog.close(); M.go('models'); }}, 'Browse model library'));
    }
    async choose(row) {
      if (this.chat.request || row.disabled) return;
      if (row.needsLoad) {
        this.dialog.close();
        window.dispatchEvent(new CustomEvent("fleet-select-model", {detail:{path:row.installed.path, name:row.installed.name, from:"chat"}}));
        M.go("models");
        this.chat.note.textContent = "Load the installed model on the Models screen, then return to Model chats.";
        return;
      }
      this.chat.picker.value = row.value;
      this.chat.picker.dispatchEvent(new Event("change"));
      this.dialog.close();
      this.render();
    }
  }
  window.ChatModelPicker = ChatModelPicker;
})();

(function () {
  const M = window.fleetModel;
  class ConversationsWorkspace {
    constructor(chat) {
      this.chat = chat;
      this.mobile = chat.querySelector('#conversation-mobile-nav');
      this.mobile.onclick = () => {
        const open = this.mobile.getAttribute('aria-expanded') !== 'true';
        this.mobile.setAttribute('aria-expanded', String(open));
        chat.box.dataset.sidebar = String(open);
      };
      this.project = chat.querySelector('#conversation-project');
      this.project.onchange = () => this.selectProject();
      chat.querySelector('#conversation-local-agents').ontoggle = event => {
        if (event.target.open && !this.localAgents) {
          this.localAgents = M.el('ml-agents', {endpoint:'/ui/agents'});
          chat.querySelector('#conversation-agents').append(this.localAgents);
        }
      };
      this.team = chat.querySelector('#conversation-team');
      this.model = chat.querySelector('#conversation-model');
      this.channels = chat.querySelector('#conversation-channels');
      this.direct = chat.querySelector('#conversation-direct');
      this.live = chat.querySelector('#conversation-models');

      chat.querySelector('#conversation-details').onclick = event => {
        chat.options.open = !chat.options.open;
        event.currentTarget.setAttribute('aria-expanded', String(chat.options.open));
      };
      chat.querySelector('.conversation-choose').onclick = () => chat.modelPicker.button.click();
    }
    route(route) {
      this.active = route === 'board';
      this.mobile.setAttribute('aria-expanded', 'false');
      this.chat.box.dataset.sidebar = 'false';
      this.team.hidden = !this.active;
      this.model.hidden = this.active;
      if (this.navigationData) this.navigation(this.navigationData);
      if (['chat','board'].includes(route) && !this.projectsLoaded) { this.projectsLoaded = true; this.projects(); }
    }
    async projects() {
      const result = await M.api('/ui/projects');
      const projects = result.ok ? result.projects || [] : [];
      let saved = '';
      try { saved = localStorage.getItem('poolside.conversations.project') || ''; } catch {}
      this.project.replaceChildren(M.el('option', {value:''}, 'Choose a workspace'),
        ...projects.filter(row => /^[a-f0-9]{32}$/.test(row.id)).map(row => M.el('option', {value:row.id}, row.name)),
        M.el('option', {value:'local'}, 'Device-local Board'));
      const valid = projects.find(row => row.id === saved) || projects.find(row => row.is_self) || projects[0];
      if (valid) { this.project.value = valid.id; this.selectProject(); }
      else this.channels.replaceChildren(M.el('p', {class:'hint'}, result.error || 'Choose a workspace to open its channels. Device-local messages are not shared with your pool.'));
    }
    selectProject() {
      const id = this.project.value;
      this.board?.remove();
      this.board = null;
      this.navigationData = null;
      this.direct.replaceChildren();
      if (!id) { this.channels.textContent = 'Choose a workspace to see its channels.'; return; }
      this.channels.textContent = 'Connecting to workspace…';
      this.board = M.el('ml-board', {endpoint:id === 'local' ? '/ui/board' : `/ui/projects/${id}/board`,
        'channel-feed':'', integrated:''});
      this.board.addEventListener('board-navigation', event => this.navigation(event.detail));
      this.team.replaceChildren(this.board);
      try { localStorage.setItem('poolside.conversations.project', id); } catch {}
    }
    navigation(data) {
      this.navigationData = data;
      const button = (label, current, view) => M.el('button', {
        type:'button', 'aria-current':String(this.active && current), onclick:() => {
          M.go('board'); this.board.open(view);
        }}, label);
      this.channels.replaceChildren(...data.boards.map(row => button(
        `${row.name}${row.unread ? ` · ${row.unread}` : ''}`,
        [data.view.name, data.view.board].includes(row.name), {kind:'board', name:row.name})));
      if (!data.boards.length) this.channels.append(M.el('p', {class:'hint'}, data.error || 'No team channels in this workspace.'));
      const peers = new Map();
      for (const row of data.dms) {
        const id = row.a === data.me ? row.b : row.a;
        peers.set(id, {id, label:id, view:{kind:'dm', a:row.a, b:row.b}});
      }
      for (const agent of data.agents) {
        if (agent.id !== data.me) peers.set(agent.id, {id:agent.id,
          label:agent.display_name || agent.display_label || agent.id,
          view:{kind:'dm', a:data.me, b:agent.id}});
      }
      const newMessage = data.me ? M.el('details', {}, M.el('summary', {}, '+ New direct message'), this.board.newDm()) : null;
      this.direct.replaceChildren(newMessage, ...[...peers.values()].map(row => button(row.label,
        data.view.kind === 'dm' && [data.view.a,data.view.b].includes(row.id), row.view)));
      if (!peers.size) this.direct.append(M.el('p', {class:'hint'}, 'Agents and direct messages appear here.'));
    }
    models(rows) {
      this.live.replaceChildren(...rows.map(row => M.el('button', {type:'button', onclick:() => {
        if (M.route !== 'chat') { this.chat.pendingModel = row.model; M.go('chat'); }
        else { this.chat.picker.value = row.model; this.chat.picker.dispatchEvent(new Event('change')); }
        this.chat.input.focus();
      }}, `● ${row.model.split('/').pop()}`)));
      if (!rows.length) this.live.append(M.el('p', {class:'hint'}, 'No models running. Choose one from the library.'));
    }
  }
  window.ConversationsWorkspace = ConversationsWorkspace;
})();
</script>
