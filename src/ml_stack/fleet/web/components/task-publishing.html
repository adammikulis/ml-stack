<style>
.task-publishing dd,.task-publishing pre{overflow-wrap:anywhere;white-space:pre-wrap;min-width:0}.task-publishing .publishing-gate{padding:10px 0;border-top:1px solid var(--border,#36465d)}.task-publishing .passed{color:var(--good)}.task-project{margin:0!important}.task-project summary{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.task-project code{display:block;overflow-wrap:anywhere;white-space:pre-wrap}@media(max-width:600px){.task-publishing dl{grid-template-columns:1fr;gap:4px}.task-publishing dt{font-weight:600}.task-publishing dd{margin-bottom:8px}}
</style>
<script>
(function(){
const E=window.fleetModel.el;
const time=value=>value?new Date(value*1000).toLocaleString():'Not recorded';
function fields(value){const list=E('dl',{});for(const [name,item] of value)if(item!==undefined&&item!==null&&item!=='')list.append(E('dt',{},name),E('dd',{},String(item)));return list;}
function proof(record){const node=E('div',{});node.append(fields([['Status',record.state],['Publisher',record.owner],['Worker',record.worker],['Development branch',record.development],['Reviewed source commit',record.source_commit],['Published / gated commit',record.commit],['Independent review',record.review_id],['Review SHA256',record.review_hash],['Submitted proposal',record.proposal_id],['Proposal SHA256',record.proposal_hash]]));
if(record.reason)node.append(E('p',{class:'publishing-reason'},record.reason));
if(record.blocking_owner)node.append(fields([['Blocking owner',record.blocking_owner],['Claim',record.blocking_claim?.kind],['Claimed branch',record.blocking_claim?.key]]));
for(const [index,check] of (record.checks||[]).entries()){const gate=E('details',{class:'publishing-gate','data-publishing-key':`${record.id}:gate:${index}`},E('summary',{class:check.passed?'passed':''},`${check.passed?'Passed':'Failed'} · ${(check.command||[]).join(' ')}`));gate.append(fields([['Exit code',check.exit],['Output SHA256',check.output_hash]]));node.append(gate);}return node;}
window.taskPublishingProject=function(path,id){if(!path)return '';const name=String(path).replace(/\\/g,'/').split('/').filter(Boolean).at(-1)||path;return E('details',{class:'task-project','data-publishing-key':`${id}:project`},E('summary',{},name),E('code',{},path));};
window.taskPublishing=function(row){const attempts=row.integration_attempts||[],current=row.integration,state=current?.state||attempts.at(-1)?.state||'Not attempted';const node=E('details',{class:'task-publishing','data-publishing-key':`${row.id}:publishing`},E('summary',{},`Publishing · ${state}`));
node.append(E('p',{},'Publishing follows independent acceptance and required gates. These records do not grant permissions or retry a blocked attempt.'));
if(current)node.append(proof(current));else node.append(E('p',{},'No integration recorded for the current independent review.'));
if(attempts.length){node.append(E('h3',{},'Once-only attempts'));for(const attempt of attempts){const box=E('details',{'data-publishing-key':attempt.id},E('summary',{},`${attempt.state} · ${time(attempt.started)}`));box.append(fields([['Attempt',attempt.id],['Started',time(attempt.started)],['Finished',time(attempt.finished)],['Independent review',attempt.review_id],['Review SHA256',attempt.review_hash],['Submitted proposal',attempt.proposal_id],['Proposal SHA256',attempt.proposal_hash]]));if(attempt.outcome)box.append(proof(attempt.outcome));node.append(box);}}
if(row.integration_events?.length){const events=E('details',{'data-publishing-key':`${row.id}:events`},E('summary',{},'Publishing timeline'));events.append(E('ol',{},...row.integration_events.map(event=>E('li',{},`${time(event.at)} · ${event.state}`,event.reason?E('p',{},event.reason):''))));node.append(events);}
const earlier=(row.integrations||[]).filter(item=>item.id!==current?.id);for(const item of earlier)node.append(E('details',{'data-publishing-key':item.id},E('summary',{},`Earlier integration · ${item.state}`),proof(item)));return node;};
})();
</script>
