<style>
gym-view .gym-stage { position:relative; min-height:420px; background:#10151d; border-radius:12px; overflow:hidden; }
gym-view .gym-stage img { width:100%; height:420px; object-fit:contain; }
gym-scene { display:block; width:100%; height:420px; touch-action:none; }
gym-view .gym-metrics { display:flex; flex-wrap:wrap; gap:16px; margin:16px 0; }
gym-view .gym-metrics strong { display:block; font-size:22px; }
</style>
<template><section class="workspace" hidden><h1>Gym</h1><p class="intro">Live sensors, controller decisions, rewards, and authoritative simulator state.</p><div class="cards" id="environments"></div><p class="status" id="gym-note" role="status"></p><div class="workspace-grid"><div class="workspace-card" id="config"></div><div class="workspace-card"><h2 id="scene-title">Live environment</h2><div class="gym-stage"><img id="frame" alt="Native simulator render" hidden><gym-scene hidden></gym-scene><p id="scene-empty">Choose an environment and start a session.</p></div><div id="metrics" class="gym-metrics"></div><div id="controls" class="workspace-actions"></div><details open><summary>Sensor observation → decision → applied action</summary><pre id="inspector">No observation yet.</pre></details><details><summary>Episode information</summary><pre id="info"></pre></details><div class="workspace-actions" id="replay"></div></div></div></section></template>
<script>
(function(){const M=window.fleetModel,W=window.workspaceModel,E=M.el;
class GymView extends HTMLElement{
 connectedCallback(){if(this.wired)return;this.wired=true;this.host=this.querySelector('section');this.note=this.querySelector('#gym-note');this.catalogue=[];const b=this.querySelector('#config');b.append(E('h2',{},'Session configuration'));this.environment=W.field(b,'Environment','select');this.seed=W.field(b,'Seed','input',{type:'number',value:'0'});this.controller=W.field(b,'Controller','select');['manual','random','decider','ppo'].forEach(x=>this.controller.append(E('option',{value:x},x)));this.checkpoint=W.field(b,'PPO checkpoint path','input',{placeholder:'Gym cache policy.zip'});this.config=W.field(b,'Native environment settings (JSON)','textarea');this.config.value='{}';this.action=W.field(b,'Manual action (JSON)','input',{value:'0'});this.speed=W.field(b,'Playback speed','select');['0.25','0.5','1','2','4'].forEach(x=>this.speed.append(E('option',{value:x},x+'×')));this.speed.value='1';b.append(E('div',{class:'workspace-actions'},W.button('Start session',()=>this.start()),W.button('Close session',()=>this.close())),E('p',{class:'intro'},'Configuration passes directly to the selected simulator. The scene displays its authoritative state.'));this.environment.addEventListener('change',()=>this.describe());this.controller.addEventListener('change',()=>this.session&&this.control('controller',{controller:this.controller.value,checkpoint:this.checkpoint.value}));this.speed.addEventListener('change',()=>this.control('speed',{speed:Number(this.speed.value)}));this.querySelector('#controls').append(...[['Play','play'],['Pause','pause'],['Single step','step'],['Reset','reset']].map(([label,cmd])=>W.button(label,()=>this.control(cmd,cmd==='step'?{action:JSON.parse(this.action.value)}:{seed:Number(this.seed.value)}))));this.querySelector('#controls').append(W.button('Apply manual action',()=>{try{this.control('action',{action:JSON.parse(this.action.value)});}catch(e){W.status(this.note,e);}}));this.querySelector('#replay').append(W.button('Download session snapshots',()=>this.download()));this.history=[];this.timeline=E('input',{type:'range',min:'0',max:'0',value:'0','aria-label':'Recorded snapshot',oninput:()=>{this.replaying=true;this.draw(this.history[Number(this.timeline.value)],false);}});this.querySelector('#replay').append(this.timeline,W.button('Return to live',()=>{this.replaying=false;this.poll();}));W.route(this.host,'gym',()=>{this.load();if(this.session)this.stream();});this.timer=setInterval(()=>{if(this.session&&!this.host.hidden&&!this.polling&&!this.streaming)this.poll();},300);}
 disconnectedCallback(){clearInterval(this.timer);this.streamAbort?.abort();}
 async load(){try{const r=await W.api('/ui/gym/catalogue');this.catalogue=r.environments;const selected=this.environment.value;this.environment.replaceChildren(...r.environments.map(env=>E('option',{value:env.id},env.title)));if(selected)this.environment.value=selected;this.querySelector('#environments').replaceChildren(...r.environments.map(env=>E('article',{class:'workspace-card'},E('h2',{},env.title),E('span',{class:'badge'},env.library),E('span',{class:'badge'},env.physics),E('p',{},env.description),E('p',{},env.available?'Ready to run':(env.missing||[]).join(', ')+' dependencies required'),env.available?W.button('Configure',()=>{this.environment.value=env.id;this.describe();}):E('pre',{},env.install||`pip install 'ml-stack[${env.extra}]'`))));this.describe();}catch(e){W.status(this.note,e);}}
 describe(){const env=this.catalogue.find(x=>x.id===this.environment.value);if(!env)return;this.querySelector('#scene-title').textContent=env.title;this.note.textContent='Actions: '+W.json(env.actions);}
 async start(){try{if(this.session)await this.close();const r=await W.post('/ui/gym/sessions',{environment:this.environment.value,seed:Number(this.seed.value),controller:this.controller.value,config:{...JSON.parse(this.config.value),...(this.controller.value==='ppo'?{checkpoint:this.checkpoint.value}:{})}});this.session=r.id;this.history=[];this.replaying=false;this.draw(r);this.stream();}catch(e){W.status(this.note,e);}}
 async close(){if(!this.session)return;this.streamAbort?.abort();try{await W.api('/ui/gym/sessions/'+this.session,{method:'DELETE'});this.session=null;this.note.textContent='Session closed.';}catch(e){W.status(this.note,e);}}
 async control(command,payload={}){if(!this.session){this.note.textContent='Start a session first.';return;}try{const r=await W.post('/ui/gym/sessions/'+this.session,{command,payload});this.draw(r);}catch(e){W.status(this.note,e);}}
 async stream(){if(this.streaming||!this.session||this.host.hidden)return;this.streaming=true;this.streamAbort=new AbortController();const id=this.session;try{const response=await fetch('/ui/gym/sessions/'+id+'/events',{headers:M.headers,signal:this.streamAbort.signal});if(!response.ok)throw Error('Snapshot stream failed ('+response.status+').');const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';while(true){const {done,value}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});let split;while((split=buffer.indexOf('\n\n'))>=0){const event=buffer.slice(0,split);buffer=buffer.slice(split+2);if(event.startsWith('data: '))this.draw(JSON.parse(event.slice(6)));}}}catch(e){if(e.name!=='AbortError')W.status(this.note,e);}finally{this.streaming=false;if(this.session===id&&!this.host.hidden)setTimeout(()=>this.stream(),500);}}
 async poll(){this.polling=true;try{this.draw(await W.api('/ui/gym/sessions/'+this.session));}catch(e){W.status(this.note,e);}finally{this.polling=false;}}
 draw(s,record=true){if(!s)return;if(record&&this.history.at(-1)?.sequence!==s.sequence){this.history.push({...s});if(this.history.length>300)this.history.shift();this.timeline.max=String(this.history.length-1);if(!this.replaying)this.timeline.value=this.timeline.max;}if(record&&this.replaying)return;this.note.textContent=s.error||`${s.status} · ${s.controller} controller`;const frame=this.querySelector('#frame'),scene=this.querySelector('gym-scene');frame.hidden=!s.frame;scene.hidden=!!s.frame||!s.info?.render;this.querySelector('#scene-empty').hidden=!!s.frame||!!s.info?.render;if(s.frame)frame.src=s.frame.startsWith('data:')?s.frame:'data:image/png;base64,'+s.frame;if(s.info?.render)scene.update({...s.info.render,environment:s.environment,heading_unit:s.info.render.heading_unit||(s.environment==='car'?'radians':'degrees')});this.querySelector('#metrics').replaceChildren(...[['Step',s.sequence],['Reward',Number(s.reward||0).toFixed(3)],['Episode',s.terminated?'Terminated':s.truncated?'Truncated':'Active']].map(([k,v])=>E('div',{},E('span',{},k),E('strong',{},v))));this.querySelector('#inspector').textContent=W.json({observation:s.observation,decision:s.decision,action:s.action,controller:s.controller});this.querySelector('#info').textContent=W.json({info:s.info,trajectory:s.trajectory_path});}
 download(){const url=URL.createObjectURL(new Blob([this.history.map(x=>JSON.stringify({...x,frame:null})).join('\n')],{type:'application/json'}));const link=E('a',{href:url,download:'gym-session.jsonl'});link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
}customElements.define('gym-view',GymView);})();
</script>
