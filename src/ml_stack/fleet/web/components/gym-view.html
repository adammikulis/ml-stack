<style>
gym-view [hidden] { display:none!important; }

gym-view .gym-catalogue { margin:0 0 24px; }
gym-view .gym-section-title { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
gym-view .gym-section-title h2 { font-size:15px; margin:0; }
gym-view .gym-section-title span { color:var(--muted,#757381); font-size:12px; }
gym-view #environments { display:grid; grid-template-columns:repeat(auto-fit,minmax(155px,1fr)); gap:12px; }
gym-view .gym-scenario { padding:16px; border-radius:14px; border:1px solid var(--line,#e5ddd4); background:var(--raised,#fff); min-width:0; position:relative; }
gym-view .gym-scenario[data-selected=true] { border-color:var(--poolside-orange,#ff8a3d); box-shadow:0 0 0 2px color-mix(in srgb,var(--poolside-orange,#ff8a3d) 18%,transparent); }
gym-view .gym-scenario-icon { display:flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:12px; background:color-mix(in srgb,var(--scenario-color) 20%,white); color:var(--poolside-navy,#1b1f3a); font-size:22px; margin-bottom:12px; }
gym-view .gym-scenario h3 { font-size:14px; margin:0 0 6px; }
gym-view .gym-scenario p { font-size:12px; color:var(--muted,#757381); line-height:1.5; margin:0 0 12px; }
gym-view .gym-scenario .gym-ready { color:var(--poolside-navy,#1b1f3a); font-size:11px; font-weight:700; }
gym-view .gym-scenario button { padding:6px 10px; min-height:30px; width:100%; background:var(--sunken,#f6f1ea); border:0; font-size:12px; color:inherit; }
gym-view .gym-scenario[data-selected=true] button { background:var(--poolside-orange,#ff8a3d); color:var(--poolside-navy,#1b1f3a); }
gym-view .gym-layout { display:grid; grid-template-columns:280px minmax(0,1fr); align-items:start; gap:20px; }
gym-view .gym-setup,gym-view .gym-live { border:1px solid var(--line,#e5ddd4); background:var(--raised,#fff); border-radius:16px; min-width:0; }
gym-view .gym-setup { padding:20px; }
gym-view #config h2 { font-size:16px; margin:0 0 4px; }
gym-view #config > .intro { font-size:12px; line-height:1.5; margin:0 0 16px; }
gym-view #config input:not([type=checkbox]),gym-view #config select { width:100%; box-sizing:border-box; min-height:38px; background:var(--sunken,#f6f1ea); border:1px solid var(--line,#e5ddd4); border-radius:8px; color:inherit; padding:8px 10px; }
gym-view #config label { margin-top:14px; font-size:12px; font-weight:600; }
gym-view #config .intro { font-size:12px; margin:10px 0; }
gym-view #config details { border-top:1px solid var(--line,#e5ddd4); padding:14px 0 0; margin-top:16px; }
gym-view #config summary { font-size:12px; font-weight:700; cursor:pointer; }
gym-view #config .gym-start { width:100%; background:var(--poolside-orange,#ff8a3d); color:var(--poolside-navy,#1b1f3a); font-weight:750; border:0; min-height:42px; }
gym-view #config .gym-close { width:100%; background:transparent; border:1px solid var(--line,#e5ddd4); color:var(--muted,#757381); }
gym-view .gym-live-header { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:18px 20px; }
gym-view .gym-live-header h2 { font-size:16px; margin:0; }
gym-view .gym-live-dot { width:8px; height:8px; border-radius:50%; background:var(--poolside-cyan,#2de2e6); display:inline-block; margin-right:8px; }
gym-view #gym-note { font-size:12px; margin:0; min-height:0; }

gym-view gym-scene { display:block; width:100%; height:450px; touch-action:none; }
gym-view #scene-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; height:100%; margin:0; padding:32px; box-sizing:border-box; text-align:center; color:#fffaf4; }
gym-view #scene-empty strong { font-size:22px; letter-spacing:-.03em; }
gym-view #scene-empty span { max-width:340px; color:#c7c9da; font-size:13px; line-height:1.6; }
gym-view .gym-empty-mark { display:flex; gap:8px; align-items:end; height:72px; margin-bottom:10px; }
gym-view .gym-empty-mark i { display:block; width:18px; border-radius:6px; background:var(--poolside-orange,#ff8a3d); height:44px; transform:rotate(-12deg); }
gym-view .gym-empty-mark i:nth-child(2) { height:68px; background:var(--poolside-pink,#ff5fa2); }
gym-view .gym-empty-mark i:nth-child(3) { height:36px; background:var(--poolside-yellow,#ffd166); }
gym-view .gym-empty-mark i:nth-child(4) { height:55px; background:var(--poolside-cyan,#2de2e6); }
gym-view .gym-stage:fullscreen { margin:0; border-radius:0; height:100vh; }
gym-view .gym-stage:fullscreen gym-scene,gym-view .gym-stage:fullscreen img { height:100vh; }
gym-view #controls { padding:0 20px 18px; margin:16px 0 0; gap:8px; }
gym-view #controls button { background:var(--sunken,#f6f1ea); border:1px solid var(--line,#e5ddd4); color:inherit; border-radius:8px; }
gym-view #controls button:first-child { background:var(--poolside-cyan,#2de2e6); color:var(--poolside-navy,#1b1f3a); border-color:transparent; font-weight:750; }
gym-view .gym-shortcuts { margin-left:auto; font-size:11px; color:var(--muted,#757381); }
gym-view .gym-metrics { display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:1px; background:var(--line,#e5ddd4); border-top:1px solid var(--line,#e5ddd4); border-bottom:1px solid var(--line,#e5ddd4); }
gym-view .gym-metrics > div { background:var(--raised,#fff); padding:16px 20px; }
gym-view .gym-metrics span { color:var(--muted,#757381); font-size:11px; }
gym-view .gym-metrics strong { display:block; font-size:20px; margin-top:6px; font-variant-numeric:tabular-nums; }
gym-view .gym-inspection { padding:20px; }
gym-view #decision-flow { grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-bottom:20px; }
gym-view #decision-flow .workspace-card { padding:16px; background:var(--sunken,#f6f1ea); border:0; }
gym-view #decision-flow h3 { font-size:12px; margin:0 0 12px; color:var(--muted,#757381); }
gym-view #decision-flow p { font-size:12px; overflow-wrap:anywhere; }
gym-view #decision-flow .workspace-card:last-child { border-top:3px solid var(--poolside-yellow,#ffd166); }
gym-view .gym-inspection details { padding:12px 0; border-top:1px solid var(--line,#e5ddd4); }
gym-view .gym-inspection summary { font-size:12px; cursor:pointer; color:var(--muted,#757381); }
gym-view #replay { margin-top:0; }
gym-view #replay input { flex:1; min-width:100px; accent-color:var(--poolside-pink,#ff5fa2); }
gym-view gym-recordings { display:block; margin-top:24px; }
@media(max-width:1100px){gym-view .gym-layout{grid-template-columns:250px minmax(0,1fr)}gym-view #decision-flow{grid-template-columns:1fr}gym-view .gym-shortcuts{display:none}}
@media(max-width:760px){gym-view .gym-layout{grid-template-columns:1fr}gym-view .gym-header{flex-direction:column}gym-view #environments{grid-template-columns:repeat(2,minmax(0,1fr))}gym-view .gym-stage,gym-view .gym-stage img,gym-view gym-scene{height:340px}gym-view .gym-live-header{align-items:flex-start;flex-direction:column}}
</style>

</section>
</template>

 async installExtra(name){return this.queueInstall(name,'Runtime installed. Fetch model weights in Tools before starting the default learned controller.');}
 async install(env){return this.queueInstall(env.extra,'Environment installed.');}
 async queueInstall(name,done){try{const result=await W.post('/ui/libraries',{install:[name]});if(!result.ok)throw Error(result.error||'Could not queue installation.');this.note.textContent='Installation queued. You can keep using other features.';M.followSetupJob(result.job,job=>{this.note.textContent=job.note||job.state;}).then(async()=>{this.note.textContent=done;await this.load();}).catch(error=>W.status(this.note,error));}catch(error){W.status(this.note,error);}}

 describe(){
  const environment=this.catalogue.find(item=>item.id===this.environment.value);
  this.buildNative();this.worldOptions.describe(environment);this.modelOptions.environment();this.paintActions();for(const card of this.querySelectorAll('.gym-scenario')){const selected=card.dataset.environment===this.environment.value;card.dataset.selected=String(selected);card.querySelector('button').setAttribute('aria-pressed',String(selected));}
 }
 paintActions(){
  const busy=!!(this.pending||this.loading),available=this.catalogue.some(item=>item.id===this.environment.value&&item.available);
  this.startButton.disabled=busy||!available;this.closeButton.disabled=busy||!this.session;
  this.startButton.textContent=this.pending?'Starting…':this.session?'Start another session':'Start session';
  this.querySelector('#config').setAttribute('aria-busy',String(busy));
  for(const button of this.querySelectorAll('#controls button'))button.disabled=busy||!this.session;
  this.timeline.disabled=!this.history?.length;
 }
 sessionConfig(){
  this.worldOptions.validate();
  for(const input of [this.seed,...Object.values(this.nativeFields||{}),...Object.values(this.worldOptions.fields).map(row=>row.input),this.modelOptions.age]){
   if(!input.checkValidity()){input.closest('details')?.setAttribute('open','');input.reportValidity();throw Error('Check the highlighted simulation option.');}
  }
  const extra=JSON.parse(this.config.value);
  if(!extra||Array.isArray(extra)||typeof extra!=='object')throw Error('Additional native settings must be a JSON object.');
  return {record_frames:this.recordFrames.checked,...extra,...this.nativeConfig(),...this.worldOptions.value(),...this.modelOptions.value(),...(this.controller.value==='decider'&&this.decisionCheckpoint.value?{decision_checkpoint:this.decisionCheckpoint.value}:{}),...(this.controller.value==='ppo'?{checkpoint:this.checkpoint.value,decision_checkpoint:this.decisionCheckpoint.value||null}:{})};
 }
 async start(){
  if(this.pending)return;
  try{
   const config=this.sessionConfig();this.pending=true;this.paintActions();this.note.textContent='Starting a paused simulation…';
   const r=await W.post('/ui/gym/sessions',{environment:this.environment.value,seed:Number(this.seed.value),controller:this.controller.value,config});
   this.streamAbort?.abort();this.session=r.id;localStorage.setItem('ml-stack-gym-session',r.id);this.history=[];this.selectedAgent=null;this.replaying=false;this.draw(r);this.stream();await this.loadSessions();
  }catch(e){W.status(this.note,e);}finally{this.pending=false;this.paintActions();}
 }
 async close(){
  if(!this.session||this.pending)return;
  const id=this.session;
  try{await W.api('/ui/gym/sessions/'+id,{method:'DELETE'});this.streamAbort?.abort();this.session=null;this.lastSnapshot=null;this.history=[];this.selectedAgent=null;this.replaying=false;this.applyController.disabled=true;this.worldOptions.apply.disabled=true;localStorage.removeItem('ml-stack-gym-session');this.querySelector('#frame').hidden=true;this.querySelector('gym-scene').hidden=true;this.querySelector('#scene-empty').hidden=false;this.querySelector('#scene-empty').textContent='Session closed. Start a session or attach to another live world.';this.querySelector('#metrics').replaceChildren();this.querySelector('#decision-flow').replaceChildren();this.note.textContent='Session closed.';await this.loadSessions();}catch(e){W.status(this.note,e);}finally{this.paintActions();}
 }
 async control(command,payload={}){if(!this.session){this.note.textContent='Start a session first.';return;}try{const r=await W.post('/ui/gym/sessions/'+this.session,{command,payload});this.draw(r);}catch(e){W.status(this.note,e);}}
 async stream(){if(this.streaming||!this.session||this.host.hidden)return;this.streaming=true;this.streamAbort=new AbortController();const id=this.session;try{const response=await fetch('/ui/gym/sessions/'+id+'/events',{headers:M.headers,signal:this.streamAbort.signal});if(!response.ok)throw Error('Snapshot stream failed ('+response.status+').');const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';while(true){const {done,value}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});let split;while((split=buffer.indexOf('\n\n'))>=0){const event=buffer.slice(0,split);buffer=buffer.slice(split+2);if(event.startsWith('data: ')&&this.session===id)this.draw(JSON.parse(event.slice(6)));}}}catch(e){if(e.name!=='AbortError')W.status(this.note,e);}finally{this.streaming=false;if(this.session===id&&!this.host.hidden)setTimeout(()=>this.stream(),500);}}
 async poll(){if(!this.session)return;const id=this.session;this.polling=true;try{const snapshot=await W.api('/ui/gym/sessions/'+id);if(this.session===id)this.draw(snapshot);}catch(e){W.status(this.note,e);}finally{this.polling=false;}}
 draw(s,record=true){if(!s)return;this.lastSnapshot=s;if(s.checkpoint&&!this.checkpoint.value)this.checkpoint.value=s.checkpoint;this.applyController.disabled=!this.session;this.worldOptions.apply.disabled=!this.session;if(record&&this.history.at(-1)?.sequence!==s.sequence){this.history.push({...s});if(this.history.length>300)this.history.shift();this.timeline.max=String(this.history.length-1);if(!this.replaying)this.timeline.value=this.timeline.max;}if(record&&this.replaying)return;if(s.actions&&this.action.options.length!==s.actions.length){this.action.replaceChildren(...s.actions.map((name,index)=>E('option',{value:index},name)));}this.note.textContent=s.error||`${s.status||'Starting'} · ${s.controller||this.controller.value} controller`;const frame=this.querySelector('#frame'),scene=this.querySelector('gym-scene');const native=this.sensorView.value==='native'&&!!s.frame;frame.hidden=!native;scene.hidden=native||!s.info?.render;this.querySelector('#scene-empty').hidden=!!s.frame||!!s.info?.render;if(s.frame)frame.src=s.frame.startsWith('data:')?s.frame:'data:image/png;base64,'+s.frame;if(s.info?.render)scene.update({...s.info.render,environment:s.environment,heading_unit:s.info.render.heading_unit||(s.environment==='car'?'radians':'degrees')});this.querySelector('gym-drone-camera')?.update?.(s.environment==='drone'?s.info?.render?.camera:null);this.modelOptions.telemetry(s);this.drawTelemetry(s);this.querySelector('#info').textContent=W.json({info:s.info,trajectory:s.trajectory_path});this.paintActions();}
 selectedTelemetry(s){
 const render=s.info?.render||{},actors=this.selectedKind==='robot'?render.robots:this.selectedKind==='drone'?render.drones:render.vehicles;
 const actor=(actors||[]).find(a=>String(a.id)===String(this.selectedAgent));
 const controlled=actor?.controlled||actor?.ego||String(actor?.id)===String(s.agent_id??s.info?.ego_actor_id??s.info?.controlled_agent??render.vehicle?.id);
 if(!actor||controlled)return {sensors:render.sensors||[],decision:s.decision,action:s.action,reward:s.reward,model:s.model||s.decision?.model,controller:s.controller,controlled:true,actor};
 return {sensors:actor.sensors?.values||actor.sensors?.sensors||[],decision:actor.decision,action:actor.last_action,reward:actor.reward,model:actor.model,controller:actor.controller||actor.policy||'Native simulator',controlled:false,actor};
 }
 drawTelemetry(s){
 const t=this.selectedTelemetry(s),world=s.simulation_mode==='world'||s.config?.simulation_mode==='world'||s.info?.simulation_mode==='world',clock=s.world_time??s.info?.world_time??s.info?.render?.world_time;
 const metrics=[['World time',clock===undefined?'Not reported':Number(clock).toFixed(1)+' s'],['Step',s.sequence],['Selected agent',this.selectedAgent||t.actor?.id||'Controller target']];
 if(!world)metrics.push(['Episode',s.terminated?'Terminated':s.truncated?'Truncated':'Active']);
 if(s.policy_version!==undefined)metrics.push(['Policy version',s.policy_version]);
 if(s.optimizer_updates!==undefined)metrics.push(['Optimizer updates',s.optimizer_updates]);
 this.querySelector('#metrics').replaceChildren(...metrics.map(([label,value])=>E('div',{},E('span',{},label),E('strong',{},value))));
 const sensors=E('div',{class:'workspace-card'},E('h3',{},'Sensors'));
 if(t.actor?.speed!==undefined)sensors.append(E('p',{},'Speed '+Number(t.actor.speed).toFixed(1)+' m/s'));
 if(t.actor?.position)sensors.append(E('p',{},'Position '+t.actor.position.map(v=>Number(v).toFixed(1)).join(', ')+' m'));
 const values=Array.isArray(t.sensors)?t.sensors:[];
 sensors.append(...values.filter(sensor=>!Array.isArray(sensor.value)).map(sensor=>E('p',{},sensor.name+': '+(typeof sensor.value==='number'?sensor.value.toFixed(2):String(sensor.value))+' '+(sensor.unit||''))));
 if(!values.length)sensors.append(E('p',{},t.controlled?'Waiting for native sensor telemetry.':'This actor does not expose detailed sensor telemetry.'));
 const decision=E('div',{class:'workspace-card'},E('h3',{},'Decision'),E('p',{},t.controller));
 if(t.decision){decision.append(E('p',{},t.decision.choice||'Continuous control'),E('p',{},Number(t.decision.latency_ms||0).toFixed(1)+' ms'));
 decision.append(...Object.entries(t.decision.probabilities||{}).sort((a,b)=>b[1]-a[1]).slice(0,9).map(([name,value])=>E('p',{},name+' '+(value*100).toFixed(1)+'%')));}
 else decision.append(E('p',{},t.controller==='native-idm'?'Native steering and acceleration policy.':'Decision details are not reported for this actor.'));
 const applied=E('div',{class:'workspace-card'},E('h3',{},'Applied action'),E('p',{},t.action===undefined?'Action telemetry unavailable':W.json(t.action)));
 if(t.reward!==undefined)applied.append(E('p',{},'Reward '+Number(t.reward).toFixed(3)));
 applied.append(E('p',{},t.controlled?'Controlled agent':'Inspecting agent — use Take control to change the policy target'));
 this.querySelector('#decision-flow').replaceChildren(sensors,decision,applied);
 this.querySelector('#inspector').textContent=W.json({selected_agent:this.selectedAgent,actor:t.actor,decision:t.decision,action:t.action,...(t.controlled?{decision_state:s.decision?.state,observation:s.transition?.observation??s.observation,next_observation:s.transition?.next_observation,model:t.model,decision_result:s.decision_result,perception:s.perception,perception_result:s.perception_result,device:s.device||s.decision?.device}:{})});
 }
 download(){const url=URL.createObjectURL(new Blob([this.history.map(x=>JSON.stringify({...x,frame:null})).join('\n')],{type:'application/json'}));const link=E('a',{href:url,download:'gym-session.jsonl'});link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
}customElements.define('gym-view',GymView);})();
</script>
