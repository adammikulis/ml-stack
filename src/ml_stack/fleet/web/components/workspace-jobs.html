<style>
workspace-jobs .job-list{display:grid;gap:8px}workspace-jobs .job-row{display:flex;align-items:center;gap:8px;min-width:0;padding:8px;border:1px solid var(--line);border-radius:10px}workspace-jobs .job-row>button:first-child{flex:1;text-align:left;overflow-wrap:anywhere}workspace-jobs .job-row[aria-selected="true"]{border-color:var(--accent)}workspace-jobs .job-row small{display:block;color:var(--muted)}
</style>
<script>
(function(){const M=window.fleetModel,W=window.workspaceModel,E=M.el;
 class WorkspaceJobs extends HTMLElement{
 connectedCallback(){if(this.wired)return;this.wired=true;this.heading=E('h2',{},'Job activity');this.list=E('div',{class:'job-list'});this.output=E('pre',{'aria-live':'polite'},'Select a job to inspect its output.');this.note=E('p',{class:'status',role:'status'});this.details=E('details',{class:'aside'},E('summary',{},'Selected job · output and logs'),this.output);this.append(this.heading,E('p',{class:'hint'},'Follow queued work, inspect results, or cancel a job.'),this.note,this.list,this.details);this.stopping=new Set();this.refresh();this.timer=setInterval(()=>{if(!this.closest('[hidden]'))this.refresh();},2500);}
 disconnectedCallback(){clearInterval(this.timer);this.detailRequest=(this.detailRequest||0)+1;}
 async refresh(){if(this.loading)return;this.loading=true;try{const r=await W.api('/ui/workspace/jobs');this.note.textContent=`${r.capacity.running.length} running · ${r.capacity.queued} queued · ${r.capacity.slots} slots`;this.list.replaceChildren(...r.jobs.slice().reverse().map(j=>{const row=E('div',{class:'job-row','aria-selected':String(j.id===this.selected)},W.button(j.name||j.id,()=>{this.selected=j.id;this.details.open=true;this.output.textContent='Loading job output…';this.detail();for(const node of this.list.children)node.setAttribute('aria-selected',String(node===row));}));row.firstChild.append(E('small',{},j.state));if(['queued','preparing','running'].includes(j.state)){const stop=W.button(this.stopping.has(j.id)?'Cancelling…':'Cancel',async()=>{if(this.stopping.has(j.id))return;this.stopping.add(j.id);stop.disabled=true;try{await W.post(`/ui/workspace/jobs/${j.id}/stop`,{});this.note.textContent='Cancellation requested.';}catch(e){W.status(this.note,e);}finally{this.stopping.delete(j.id);stop.disabled=false;this.refresh();}});stop.disabled=this.stopping.has(j.id);row.append(stop);}return row;}));if(!r.jobs.length)this.list.append(E('p',{class:'hint'},'No jobs yet. Start a training run or a tool operation to see its progress here.'));if(this.selected)await this.detail();}catch(e){W.status(this.note,e);}finally{this.loading=false;}}
 async detail(){const selected=this.selected,request=this.detailRequest=(this.detailRequest||0)+1;if(!selected)return;try{const r=await W.api(`/ui/workspace/jobs/${encodeURIComponent(selected)}`);if(selected!==this.selected||request!==this.detailRequest)return;this.output.textContent=W.json({...r.job,workspace:r.metadata})+'\n\n'+(r.metrics.length?'Metrics\n'+W.json(r.metrics)+'\n\n':'')+r.log;}catch(e){if(selected===this.selected&&request===this.detailRequest)W.status(this.note,e);}}
 }
 customElements.define('workspace-jobs',WorkspaceJobs);
})();
</script>
