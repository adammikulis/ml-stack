<script>
(function(){const M=window.fleetModel,W=window.workspaceModel,E=M.el;
 class WorkspaceJobs extends HTMLElement{
 connectedCallback(){if(this.wired)return;this.wired=true;this.heading=E('h2',{},'Runs');this.list=E('div');this.output=E('pre',{'aria-live':'polite'},'Select a run to inspect its output.');this.note=E('p',{class:'status',role:'status'});this.details=E('details',{class:'aside'},E('summary',{},'Run details and logs'),this.output);this.append(this.heading,this.note,this.list,this.details);this.refresh();this.timer=setInterval(()=>{if(!this.closest('[hidden]'))this.refresh();},2500);}
 disconnectedCallback(){clearInterval(this.timer);}
 async refresh(){try{const r=await W.api('/ui/workspace/jobs');this.note.textContent=`${r.capacity.running.length} running · ${r.capacity.queued} queued · ${r.capacity.slots} slots`;this.list.replaceChildren(...r.jobs.slice().reverse().map(j=>E('div',{class:'workspace-actions'},W.button(`${j.name} · ${j.state}`,()=>{this.selected=j.id;this.details.open=true;this.detail();}),['queued','preparing','running'].includes(j.state)?W.button('Cancel',async()=>{try{await W.post(`/ui/workspace/jobs/${j.id}/stop`,{});this.refresh();}catch(e){W.status(this.note,e);}}):null)));if(this.selected)await this.detail();}catch(e){W.status(this.note,e);}}
 async detail(){try{const r=await W.api(`/ui/workspace/jobs/${this.selected}`);this.output.textContent=W.json({...r.job,workspace:r.metadata})+'\n\n'+(r.metrics.length?'Metrics\n'+W.json(r.metrics)+'\n\n':'')+r.log;}catch(e){W.status(this.note,e);}}
 }
 customElements.define('workspace-jobs',WorkspaceJobs);
})();
</script>
