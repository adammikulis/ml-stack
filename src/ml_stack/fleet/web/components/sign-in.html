<!-- sign-in: local Development pools and Production passphrases -->
<template>
  <div class="centre" id="signin" hidden>
    <div class="card">
      <div class="hint">POOLSIDE</div>
      <h1>Sign in</h1>
      <p class="sub" id="signin-description">Unlock this compute pool with its cluster passphrase.</p>
      <div id="signin-pools" aria-label="Existing Development pools"></div>
      <div id="signin-passphrase">
      <label for="p">Passphrase</label>
      <input type="password" id="p" placeholder="Cluster passphrase" autocomplete="current-password">
      <button id="signin-go">Sign in</button>
      </div>
      <div id="signin-note" role="alert" aria-live="polite"></div>
    </div>
  </div>
</template>
<script>
(function () {
  const M = window.fleetModel;
  const el = M.el;

  class SignIn extends HTMLElement {
    connectedCallback() {
      if (this.wired) return;
      this.wired = true;
      this.box = this.querySelector("#signin");
      this.pass = this.querySelector("#p");
      this.go = this.querySelector("#signin-go");
      this.note = this.querySelector("#signin-note");
      this.pools = this.querySelector("#signin-pools");
      this.password = this.querySelector("#signin-passphrase");
      this.go.onclick = () => this.submit();
      this.pass.onkeydown = (e) => { if (e.key === "Enter") this.submit(); };
      M.onRoute((route) => {
        const on = route === "sign-in";
        this.box.hidden = !on;
        if (!on) return;
        this.note.replaceChildren(...M.kids(M.signInMessage
          ? el("div", { class: "err" }, M.signInMessage) : null));
        this.loadPools();
      });
    }

    async loadPools() {
      const revision = this.poolRevision = (this.poolRevision || 0) + 1;
      this.pools.replaceChildren();
      this.password.hidden = false;
      const result = await M.api("/ui/session");
      if (revision !== this.poolRevision || this.box.hidden) return;
      const names = result.ok && Array.isArray(result.local_pools) ? result.local_pools : [];
      this.password.hidden = names.length > 0;
      this.querySelector("#signin-description").textContent = names.length
        ? "Choose an existing Development pool to sign in on this computer."
        : "Unlock this compute pool with its cluster passphrase.";
      this.pools.replaceChildren(...names.map(pool => el("button", {type:"button", onclick:() => this.joinPool(pool)}, pool)));
      if (names.length) this.pools.querySelector("button")?.focus();
      else this.pass.focus();
    }

    async joinPool(pool) {
      if (this.joining) return;
      this.joining = true;
      this.pools.querySelectorAll("button").forEach(button => { button.disabled = true; });
      const result = await M.api("/ui/setup/local-session", {method:"POST", body:JSON.stringify({pool})});
      this.joining = false;
      this.pools.querySelectorAll("button").forEach(button => { button.disabled = false; });
      if (result.ok) { M.signInMessage = ""; M.sessionPool = result.pool; return M.go("cluster"); }
      M.signIn(result.error || "Could not sign in to this Development pool.");
    }

    async submit() {
      if (this.go.disabled) return;
      if (!this.pass.value.trim()) { M.signIn("Enter the cluster passphrase."); return; }
      this.go.disabled = true;
      this.go.textContent = "Checking…";
      const r = await M.api("/ui/session", { method: "POST",
        body: JSON.stringify({ passphrase: this.pass.value }) });
      this.go.disabled = false;
      this.go.textContent = "Sign in";
      if (r.ok) { this.pass.value = ""; M.signInMessage = ""; return M.go("cluster"); }
      M.signIn(r.error || "That did not match.");
    }
  }
  customElements.define("sign-in", SignIn);
})();
</script>
