<style>
training-view .training-form input, training-view .training-form select { width:100%; }
training-view .training-form details { margin-top:20px; }
training-view .training-form summary { cursor:pointer; }
training-view .training-form .intro { margin:12px 0; font-size:13px; line-height:1.6; }
training-view .training-form .status:empty { display:none; }
training-view .training-form [aria-busy="true"] { opacity:.75; }
training-view .training-form .error { color:var(--bad); }
training-view .training-form textarea { min-height:90px; }
</style>
<template>
  <section class="workspace" hidden>
    <h1>Training lab</h1>
    <p class="intro">Prepare your dataset, review a configuration check, then train and follow the run.</p>
    <div class="workspace-actions"><button type="button" id="browse-data">1 · Prepare data</button><button type="button" id="open-gym">Explore live RL worlds</button></div>
    <div class="workspace-grid">
      <div class="workspace-card training-form" id="config"></div>
      <div class="workspace-card"><workspace-jobs></workspace-jobs></div>
    </div>
  </section>
</template>
<script>
(function () {
  const M = window.fleetModel, W = window.workspaceModel, E = M.el;
  class TrainingView extends HTMLElement {
    connectedCallback() {
      if (this.wired) return;
      this.wired = true;
      this.host = this.querySelector('section');
      this.form = this.querySelector('#config');
      this.querySelector('#browse-data').onclick = () => M.go('data');
      this.querySelector('#open-gym').onclick = () => M.go('gym');
      const b = this.form;
      b.append(E('h2', {}, '2 · Configure a run'));
      this.mode = W.field(b, 'Workflow', 'select');
      [['recipe', 'Supervised / tool calling'], ['decider', 'Decision model'],
       ['rl', 'Reinforcement learning']].forEach(([value, text]) => this.mode.append(E('option', {value}, text)));
      this.recipe = W.field(b, 'Recipe', 'select');
      this.size = W.field(b, 'Model size', 'select');
      this.requirements = E('p', {class:'intro'});
      this.parameters = E('div');
      b.append(this.requirements, this.parameters);
      this.data = W.field(b, 'Dataset path (relative to files root)', 'input', {placeholder:'datasets/examples.jsonl'});
      this.out = W.field(b, 'Output directory (relative to files root)', 'input', {value:'models/my-run'});
      this.name = W.field(b, 'Run name', 'input', {value:'my-run'});
      this.advanced = E('details', {class:'aside', 'data-advanced':''}, E('summary', {}, 'Advanced options'));
      this.expert = E('div');
      this.advanced.append(this.expert);
      b.append(this.advanced);
      this.options = W.field(this.advanced, 'Additional CLI arguments (JSON array)', 'textarea');
      this.options.value = '[]';
      this.lora = W.field(b, 'Fine-tuning strategy', 'select');
      this.lora.append(E('option', {value:'adapter'}, 'LoRA adapter'), E('option', {value:'full'}, 'All model weights'));
      this.dry = W.field(b, 'Run mode', 'select');
      this.dry.append(E('option', {value:'true'}, 'Check configuration'), E('option', {value:'false'}, 'Train model'));
      this.preview = E('pre', {}, 'Review the command before starting.');
      this.reviewDetails = E('details', {class:'aside'}, E('summary', {}, 'Command preview'), this.preview);
      this.note = E('p', {class:'status', role:'status', 'aria-live':'polite'});
      this.reviewButton = W.button('Review command', () => this.review());
      this.startButton = W.button('Queue configuration check', () => this.start());
      this.retryButton = W.button('Retry loading workflows', () => this.load());
      this.retryButton.hidden = true;
      b.append(E('div', {class:'workspace-actions'}, this.reviewButton, this.startButton, this.retryButton),
               this.note, this.reviewDetails);
      this.mode.onchange = () => this.buildOptions();
      this.recipe.onchange = () => this.buildFields();
      this.size.onchange = () => this.buildFields();
      this.dry.onchange = () => this.paintActions();
      W.route(this.host, 'training', () => {
        this.load();
        const chosen = sessionStorage.getItem('ml-stack-dataset');
        if (chosen) this.data.value = chosen;
        this.querySelector('workspace-jobs').refresh();
      });
    }

    async load() {
      this.pending = true;
      this.paintActions();
      this.note.textContent = 'Loading training workflows…';
      this.note.classList.remove('error');
      this.retryButton.hidden = true;
      try {
        const result = await W.api('/ui/workspace/recipes');
        this.recipes = result.recipes || [];
        try { this.environments = (await W.api('/ui/gym/catalogue')).environments || []; this.environmentError = ''; }
        catch (error) { this.environmentError = error.message; this.environments = []; }
        this.buildOptions();
        this.note.textContent = '';
      } catch (error) {
        this.report(error);
        this.retryButton.hidden = false;
      } finally { this.pending = false; this.paintActions(); }
    }

    buildOptions() {
      this.recipe.previousElementSibling.textContent = this.mode.value === 'rl' ? 'Environment' : 'Recipe';
      this.name.previousElementSibling.textContent = this.mode.value === 'decider' ? 'Model name' : 'Run name';
      W.visible(this.dry, this.mode.value !== 'rl');
      const current = this.recipe.value || (this.mode.value === 'recipe' ? 'text-lm' : '');
      const entries = this.mode.value === 'recipe' ? this.recipes || [] : this.mode.value === 'rl'
        ? this.environments || [] : [{id:'strands', title:'Pointer-head decision model'}];
      this.recipe.replaceChildren(...entries.map(item => E('option', {value:item.id}, item.title)));
      if (entries.some(item => item.id === current)) this.recipe.value = current;
      this.buildFields();
    }

    buildFields() {
      this.drafts ||= new Map();
      if (this.fieldKey && this.inputs) this.drafts.set(this.fieldKey,
        Object.fromEntries(Object.entries(this.inputs).map(([key, input]) => [key, input.value])));
      this.parameters.replaceChildren();
      this.expert.replaceChildren();
      this.inputs = {};
      const rl = this.mode.value === 'rl';
      W.visible(this.data, !rl); W.visible(this.out, !rl); W.visible(this.name, !rl);
      W.visible(this.size, this.mode.value === 'recipe');
      W.visible(this.lora, this.mode.value === 'recipe' && this.recipe.value === 'tool-calls');
      let fields = [];
      if (this.mode.value === 'recipe') {
        const recipe = (this.recipes || []).find(item => item.id === this.recipe.value);
        if (!recipe) { this.requirements.textContent = 'No training recipes are available. Retry loading workflows.'; this.paintActions(); return; }
        const chosen = this.size.value;
        this.size.replaceChildren(...Object.entries(recipe.sizes || {}).map(([key, size]) =>
          E('option', {value:key}, `${key} · ${size.needs_gb} GB`)));
        if ([...this.size.options].some(option => option.value === chosen)) this.size.value = chosen;
        this.requirements.textContent = `${recipe.blurb} Dataset fields: ${recipe.data.fields.join(', ')}. Minimum ${recipe.data.min_rows} rows.`;
        const defaults = recipe.sizes[this.size.value]?.defaults || {};
        fields = recipe.fields.filter(field => field.name !== 'lora').map(field => ({...field, default:defaults[field.name] ?? field.default}));
        if (recipe.id === 'tool-calls') fields.unshift({name:'base', label:'Base model ID or local directory', type:'text', default:recipe.sizes[this.size.value]?.base || ''});
      } else if (rl) {
        const environment = (this.environments || []).find(item => item.id === this.recipe.value);
        this.requirements.textContent = environment?.available
          ? 'Train a CPU PPO policy with Stable-Baselines3. Checkpoints are saved in the Gym cache. Use Gym for live-world training.'
          : environment ? `Install ${environment.library} in Settings → Libraries. Missing: ${(environment.missing || []).join(', ')}.`
          : this.environmentError || 'No simulation environments are available.';
        fields = [{name:'timesteps', label:'Training timesteps', type:'int', default:2048, min:1},
                  {name:'seed', label:'Training seed', type:'int', default:0},
                  {name:'checkpoint', label:'Resume checkpoint path', type:'text', default:''},
                  {name:'config', label:'Environment configuration (JSON)', type:'json', default:'{}'}];
      } else {
        this.requirements.textContent = 'Fine-tune and calibrate a pointer-head decision model, then register its checkpoint.';
        fields = [{name:'steps', label:'Training steps', type:'int', default:60, min:1},
                  {name:'batch_size', label:'Batch size', type:'int', default:4, min:1},
                  {name:'lr', label:'Learning rate', type:'float', default:.0002, min:.000001},
                  {name:'rank', label:'LoRA rank', type:'int', default:16, min:1},
                  {name:'seed', label:'Seed', type:'int', default:0}];
      }
      for (const field of fields) {
        const host = ['steps', 'epochs', 'timesteps', 'base'].includes(field.name) ? this.parameters : this.expert;
        let input;
        if (field.type === 'bool') {
          input = W.field(host, field.label, 'select');
          input.append(E('option', {value:'false'}, 'Disabled'), E('option', {value:'true'}, 'Enabled'));
          input.value = String(field.default);
        } else if (field.type === 'json') {
          input = W.field(host, field.label, 'textarea'); input.value = field.default;
        } else input = W.field(host, field.label, 'input', {
          type:['int', 'float'].includes(field.type) ? 'number' : 'text', value:field.default,
          min:field.min, max:field.max, step:field.type === 'float' ? 'any' : '1',
          required:['int', 'float'].includes(field.type) ? '' : null});
        if (field.help) host.append(E('p', {class:'intro'}, field.help));
        this.inputs[field.name] = input;
      }
      this.fieldKey = `${this.mode.value}:${this.recipe.value}:${this.mode.value === 'recipe' ? this.size.value : ''}`;
      const saved = this.drafts.get(this.fieldKey);
      if (saved) for (const [key, value] of Object.entries(saved)) if (this.inputs[key]) this.inputs[key].value = value;
      this.paintActions();
    }

    paintActions() {
      const rl = this.mode.value === 'rl';
      const available = !rl || (this.environments || []).some(item => item.id === this.recipe.value && item.available);
      this.reviewButton.disabled = this.startButton.disabled = !!this.pending || !this.recipe.value || !available;
      this.form.setAttribute('aria-busy', String(!!this.pending));
      this.startButton.textContent = this.pending ? 'Working…'
        : !rl && this.dry.value === 'true' ? 'Queue configuration check' : 'Start training';
    }

    spec() {
      for (const input of Object.values(this.inputs)) if (!input.checkValidity()) {
        this.advanced.open = true; input.reportValidity(); throw Error('Check the highlighted training option.');
      }
      const extra = JSON.parse(this.options.value);
      if (!Array.isArray(extra) || extra.some(item => typeof item !== 'string')) throw Error('Additional arguments must be a JSON array of strings.');
      let command, args;
      if (this.mode.value !== 'rl' && !this.data.value.trim()) throw Error('Choose a dataset path before starting.');
      if (this.mode.value !== 'rl' && (!this.out.value.trim() || !this.name.value.trim())) throw Error('Choose an output directory and run name before starting.');
      if (this.mode.value === 'decider') {
        command = 'ml-stack-decide'; args = ['train', '--data', this.data.value, '--name', this.name.value, '--out', this.out.value];
      } else if (this.mode.value === 'rl') {
        const config = JSON.parse(this.inputs.config.value);
        if (!config || Array.isArray(config) || typeof config !== 'object') throw Error('Environment configuration must be a JSON object.');
        command = 'ml-stack-gym'; args = ['train', this.recipe.value, '--timesteps', this.inputs.timesteps.value,
          '--seed', this.inputs.seed.value, '--config', this.inputs.config.value];
        if (this.inputs.checkpoint.value) args.push('--checkpoint', this.inputs.checkpoint.value);
      } else { command = 'ml-stack-train-run'; args = ['--recipe', this.recipe.value, '--data', this.data.value, '--out', this.out.value]; }
      if (this.mode.value === 'recipe') {
        if (this.recipe.value === 'tool-calls' && this.lora.value === 'adapter') args.push('--lora');
        if (this.size.value) args.push('--size', this.size.value);
        for (const [key, input] of Object.entries(this.inputs)) args.push('--set', `${key}=${input.value}`);
        if (this.recipe.value === 'tool-calls') args.push('--set', `lora=${this.lora.value === 'adapter'}`);
      }
      if (this.mode.value === 'decider') for (const [key, input] of Object.entries(this.inputs)) args.push('--' + key.replaceAll('_', '-'), input.value);
      if (this.dry.value === 'true' && this.mode.value !== 'rl') args.push('--dry-run');
      return {command, args:[...args, ...extra], name:this.name.value,
        metadata:{workflow:this.mode.value, dataset:this.data.value, output:this.out.value, recipe:this.recipe.value}};
    }

    report(error) { this.note.classList.add('error'); W.status(this.note, error); }

    async perform(preview) {
      if (this.pending) return;
      try {
        const spec = this.spec();
        this.pending = true; this.paintActions(); this.note.classList.remove('error');
        this.note.textContent = preview ? 'Preparing command preview…' : 'Submitting to the training queue…';
        const result = await W.post('/ui/workspace/jobs', {...spec, ...(preview ? {preview:true} : {})});
        if (preview) {
          this.preview.textContent = result.command; this.reviewDetails.open = true;
          this.note.textContent = 'Command preview ready. A configuration check validates the training options without training.';
        } else {
          this.note.textContent = `Queued ${result.id}. Follow progress in Runs.`;
          this.querySelector('workspace-jobs').selected = result.id;
          this.querySelector('workspace-jobs').refresh();
        }
      } catch (error) { this.report(error); }
      finally { this.pending = false; this.paintActions(); }
    }
    review() { return this.perform(true); }
    start() { return this.perform(false); }
  }
  customElements.define('training-view', TrainingView);
})();
</script>
