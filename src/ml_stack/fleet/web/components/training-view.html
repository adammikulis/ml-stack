<template><section class="workspace" hidden><h1>Training</h1><p class="intro">Configure a recipe, review its command, and follow training through the daemon queue.</p><div class="workspace-grid"><div class="workspace-card" id="config"></div><div class="workspace-card"><workspace-jobs></workspace-jobs></div></div></section></template>
<script>
(function(){const M=window.fleetModel,W=window.workspaceModel,E=M.el;
class TrainingView extends HTMLElement{
 connectedCallback(){if(this.wired)return;this.wired=true;this.host=this.querySelector('section');const b=this.querySelector('#config');b.append(E('h2',{},'New run'));this.mode=W.field(b,'Workflow','select');[['recipe','Supervised / tool caller'],['decider','Decision model'],['rl','Reinforcement learning']].forEach(([value,text])=>this.mode.append(E('option',{value},text)));this.recipe=W.field(b,'Recipe / Gym environment','select');this.size=W.field(b,'Model size','select');this.parameters=E('div');this.requirements=E('p',{class:'intro'});b.append(this.requirements,this.parameters);this.data=W.field(b,'Dataset path (relative to files root)','input',{placeholder:'datasets/examples.jsonl'});this.out=W.field(b,'Output directory (relative to files root)','input',{value:'models/my-run'});this.name=W.field(b,'Run / registered model name','input',{value:'my-run'});this.options=W.field(b,'Additional CLI arguments as a JSON array','textarea');this.options.value='[]';this.dry=W.field(b,'Check configuration before training','select');this.dry.append(E('option',{value:'true'},'Dry run'),E('option',{value:'false'},'Train'));this.preview=E('pre',{},'Review the command before starting.');this.note=E('p',{class:'status',role:'status'});b.append(E('div',{class:'workspace-actions'},W.button('Review command',()=>this.review()),W.button('Start run',()=>this.start())),this.note,this.preview);this.mode.addEventListener('change',()=>this.buildOptions());this.recipe.addEventListener('change',()=>this.buildFields());this.size.addEventListener('change',()=>this.buildFields());W.route(this.host,'training',()=>{this.load();const chosen=sessionStorage.getItem('ml-stack-dataset');if(chosen)this.data.value=chosen;this.querySelector('workspace-jobs').refresh();});}
 async load(){try{this.recipes=(await W.api('/ui/workspace/recipes')).recipes;this.buildOptions();}catch(e){W.status(this.note,e);}}
 buildOptions(){this.dry.disabled=this.mode.value==='rl';if(this.mode.value==='rl')this.dry.value='false';const current=this.recipe.value||(this.mode.value==='recipe'?'text-lm':'');const entries=this.mode.value==='recipe'?this.recipes||[]:this.mode.value==='rl'?[{id:'car',title:'Smart car · MetaDrive'},{id:'warehouse',title:'Warehouse · RWARE'},{id:'traffic',title:'Traffic · SUMO-RL'}]:[{id:'strands',title:'Pointer-head decision model'}];this.recipe.replaceChildren(...entries.map(x=>E('option',{value:x.id},x.title)));if(entries.some(x=>x.id===current))this.recipe.value=current;this.size.replaceChildren();this.buildFields();}
 buildFields(){this.parameters.replaceChildren();this.inputs={};let fields=[];if(this.mode.value==='recipe'){const r=(this.recipes||[]).find(x=>x.id===this.recipe.value);if(!r)return;const chosen=this.size.value;this.size.replaceChildren(...Object.entries(r.sizes||{}).map(([key,s])=>E('option',{value:key},key+' · '+s.needs_gb+' GB')));if(chosen)this.size.value=chosen;this.requirements.textContent=r.blurb+' Dataset fields: '+r.data.fields.join(', ')+'. Minimum '+r.data.min_rows+' rows. Backend: '+(r.requires.backend||'automatic')+'.';fields=r.fields;const defaults=r.sizes[this.size.value]?.defaults||{};fields=fields.map(f=>({...f,default:defaults[f.name]??f.default}));}else if(this.mode.value==='rl'){this.requirements.textContent='PPO through Stable-Baselines3. Numeric observations; native simulator settings. Artifacts are saved in the Gym cache.';fields=[{name:'timesteps',label:'Training timesteps',type:'int',default:2048,min:1},{name:'seed',label:'Training seed',type:'int',default:0},{name:'checkpoint',label:'Resume checkpoint path',type:'text',default:''},{name:'config',label:'Native environment configuration (JSON)',type:'text',default:'{}'}];}else{this.requirements.textContent='Fine-tune a pointer-head decider, calibrate it, and compare with the baseline before registering.';fields=[{name:'steps',label:'Training steps',type:'int',default:60,min:1},{name:'batch_size',label:'Batch size',type:'int',default:4,min:1},{name:'lr',label:'Learning rate',type:'float',default:.0002,min:.000001},{name:'rank',label:'LoRA rank',type:'int',default:16,min:1},{name:'seed',label:'Seed',type:'int',default:0}];}for(const field of fields){let input;if(field.type==='bool'){input=W.field(this.parameters,field.label,'select');input.append(E('option',{value:'false'},'Disabled'),E('option',{value:'true'},'Enabled'));input.value=String(field.default);}else{input=W.field(this.parameters,field.label,'input',{type:['int','float'].includes(field.type)?'number':'text',value:field.default,min:field.min,max:field.max,step:field.type==='float'?'any':'1'});}if(field.help)this.parameters.append(E('p',{class:'intro'},field.help));this.inputs[field.name]=input;}}
 spec(){let command,args;const extra=JSON.parse(this.options.value);if(!Array.isArray(extra)||extra.some(x=>typeof x!=='string'))throw Error('Additional arguments must be a JSON array of strings.');if(this.mode.value==='decider'){command='ml-stack-decide';args=['train','--data',this.data.value,'--name',this.name.value,'--out',this.out.value];}else if(this.mode.value==='rl'){command='ml-stack-gym';args=['train',this.recipe.value];args.push('--timesteps',this.inputs.timesteps.value,'--seed',this.inputs.seed.value,'--config',this.inputs.config.value);if(this.inputs.checkpoint.value)args.push('--checkpoint',this.inputs.checkpoint.value);}else{command='ml-stack-train-run';args=['--recipe',this.recipe.value,'--data',this.data.value,'--out',this.out.value];}if(this.mode.value==='recipe'){if(this.size.value)args.push('--size',this.size.value);for(const [key,input]of Object.entries(this.inputs)){args.push('--set',key+'='+input.value);}}if(this.mode.value==='decider'){for(const [key,input]of Object.entries(this.inputs))args.push('--'+key.replaceAll('_','-'),input.value);}if(this.dry.value==='true'&&this.mode.value!=='rl')args.push('--dry-run');return{command,args:[...args,...extra],name:this.name.value,metadata:{workflow:this.mode.value,dataset:this.data.value,output:this.out.value,recipe:this.recipe.value}};}
 async review(){try{const r=await W.post('/ui/workspace/jobs',{...this.spec(),preview:true});this.preview.textContent=r.command;this.note.textContent='Command reviewed. Training resources are checked by the selected workflow.';}catch(e){W.status(this.note,e);}}
 async start(){try{const r=await W.post('/ui/workspace/jobs',this.spec());this.note.textContent=`Queued ${r.id}.`;this.querySelector('workspace-jobs').selected=r.id;this.querySelector('workspace-jobs').refresh();}catch(e){W.status(this.note,e);}}
}customElements.define('training-view',TrainingView);})();
</script>
