       border-bottom: 1px solid var(--line-strong); }
.ref:hover { color: var(--accent); border-bottom-color: var(--accent); }
.ref.rel { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); border: 1px solid var(--line);
           border-radius: 4px; padding: 0 4px; margin-left: 4px; }
.foot { margin-top: 22px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 11px; color: var(--ink-3); font-family: var(--font-mono); }

.link:hover { stroke-opacity: 1; }
.edge-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; margin-bottom: 8px; }
.edge-head .rel { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); padding: 2px 6px; border: 1px solid var(--line); border-radius: 4px; }
.msg { border-left: 2px solid var(--line-strong); padding: 6px 10px; margin: 0 0 10px; font-size: 13px; color: var(--ink-2); }
.msg .who { color: var(--ink); font-weight: 500; }
.msg .when { color: var(--ink-3); font-family: var(--font-mono); font-size: 11px; margin-left: 6px; }

.shared { display: grid; gap: 8px; margin: 4px 0 20px; }
.shared .row { display: grid; grid-template-columns: max-content 1fr; gap: 4px 10px; align-items: baseline; }
.shared .chip { cursor: pointer; }
.shared .who { display: flex; flex-wrap: wrap; gap: 2px 10px; }
.shared .who button { border: 0; padding: 0; background: none; cursor: pointer; font-size: 13px;
                      color: var(--ink); border-bottom: 1px solid var(--line); }
.shared .who button:hover { border-bottom-color: var(--accent); color: var(--accent); }
.caveat { font-size: 12px; margin: -4px 0 8px; }
.close { display: grid; gap: 6px; margin-bottom: 20px; }
.close .row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.close button { border: 0; padding: 0; background: none; cursor: pointer; font-size: 13px;
                color: var(--ink); border-bottom: 1px solid var(--line); }
.close button:hover { border-bottom-color: var(--accent); color: var(--accent); }
.close .tilde { color: var(--ink-3); font-family: var(--font-mono); }
.tip { position: fixed; pointer-events: none; z-index: 10; padding: 6px 9px; border-radius: 6px; background: var(--ink); color: var(--bg); font-size: 12px; box-shadow: var(--shadow); opacity: 0; transition: opacity .12s; max-width: 260px; }
.tip.on { opacity: 1; }
.tip .sub { color: color-mix(in srgb, var(--bg) 70%, transparent); font-size: 11px; }

.link { stroke: var(--line-strong); stroke-opacity: var(--link-op); marker-end: url(#arrow); }
/* opacity, not stroke-opacity: a marker does not inherit the stroke's alpha */
.link.dim { opacity: .14; }
.link.on { stroke: var(--accent); stroke-opacity: .9; }
.arrow { fill: context-stroke; }
.node.gone, .link.gone { display: none; }
.node { cursor: pointer; }
.node .hit { fill: transparent; }
.node .mark { stroke: var(--surface); stroke-width: 2px; pointer-events: none; }
.link.onpath { stroke: var(--accent); stroke-opacity: .95; stroke-width: 2.4; }
.hitline { stroke: transparent; stroke-width: 14; cursor: pointer; }
.hitline.gone { display: none; }
.node.dim .mark { opacity: .15; } .node.dim text { opacity: .1; }
/* close to what was asked for, not it */
.node.near .mark { opacity: .5; } .node.near text { opacity: .65; font-style: italic; }
.node.on .mark { stroke: var(--accent); stroke-width: 3px; }
.node text { font: 500 calc(13px * var(--label-scale, 1)) var(--font-body); fill: var(--ink-2); paint-order: stroke; stroke: var(--bg); stroke-width: 3.5px; stroke-linejoin: round; pointer-events: none; transition: opacity .18s; }
.node.k-person text { font: 600 calc(15px * var(--label-scale, 1)) var(--font-body); fill: var(--ink); }
.node.k-topic text { font-size: calc(12px * var(--label-scale, 1)); fill: var(--ink-3); }
.node.on text, .node.on.k-topic text { fill: var(--ink); font-weight: 700; stroke-width: 5px; }
.node.on text, .node.on.k-topic text, .node.k-person.on text { paint-order: stroke; stroke: var(--bg); }
.l3.on { color: var(--ink); font-weight: 700; }
/* a label the layout pass could not place without an overlap */
.node.hushed text { opacity: 0; }
.graph-wrap.settling .node text, .graph-wrap.settling .elabel { opacity: 0; }
.elabel { font: 500 calc(12px * var(--elabel-scale, 1)) var(--font-body); fill: var(--ink-3); paint-order: stroke; stroke: var(--bg);
          stroke-width: 3px; stroke-linejoin: round; pointer-events: none; transition: opacity .18s; }
.elabel.hushed { opacity: 0; }
.land { fill: var(--land); stroke: var(--land-line); stroke-width: .5; }
.dot { fill: var(--k-person); stroke: var(--surface); stroke-width: 1.5; cursor: pointer; }
.dot.on { stroke: var(--accent); stroke-width: 3; }
.leader { stroke: var(--line-strong); stroke-width: 1; stroke-opacity: .65; }
.dot-label { font: 10px var(--font-body); fill: var(--ink); paint-order: stroke; stroke: var(--sea); stroke-width: 3px; pointer-events: none; }

@media (max-width: 900px) {

  main { grid-template-columns: 1fr; }

<script id="data" type="application/json">__DATA__</script>
<script id="world" type="application/json">__WORLD__</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const WORLD = JSON.parse(document.getElementById('world').textContent);
  const G = DATA.graph;
  // What kinds a graph has, what each is called and what shape it takes, are the caller's.
  const SHAPES = { circle: d3.symbolCircle, square: d3.symbolSquare, diamond: d3.symbolDiamond,
                   triangle: d3.symbolTriangle, wye: d3.symbolWye, star: d3.symbolStar,
                   cross: d3.symbolCross };
  const KINDS = (DATA.kinds || []).map(k => ({ ...k, shape: SHAPES[k.shape] || d3.symbolCircle }));
  const kindOf = Object.fromEntries(KINDS.map(k => [k.k, k]));
  const COPY = Object.assign({
    heading: 'What is here, and how it joins up',
    blurb: 'Click anything to see what it was read from.',
    note: '',
    onMap: 'on the map',
    ground: 'Shared ground',
  }, DATA.copy || {});
  document.getElementById('on-map').textContent = COPY.onMap;
  const kindById = Object.fromEntries(G.nodes.map(n => [n.id, n.kind]));
  const p2pCount = G.edges.filter(e => kindById[e.source] === 'person'
                                    && kindById[e.target] === 'person').length;
  const color = k => `var(--k-${k})`;
  const swatch = (k, size = 9) => `<svg class="sw" width="${size}" height="${size}" viewBox="-7 -7 14 14"><path d="${d3.symbol().type(kindOf[k].shape).size(40)()}" fill="${color(k)}"/></svg>`;
  // show: drawn. hide: masked, but still shaping the layout. remove: out of the simulation, so
  // everything else re-settles without it.
  const STATES = ['show', 'hide', 'remove'];
  const display = { node: {}, link: {}, source: {}, edgeLabels: 'show' };
  KINDS.forEach(k => { display.node[k.k] = 'show'; });
  // Working sessions are the making of this graph, not the community in it. They start out of the
  // picture so the layout settles around what people actually said; the Display panel puts them back.
  display.source.session = 'remove';
  // person-to-person edges are what turns a readable graph into a hairball, so they get a
  // switch of their own on top of the per-relation ones
  display.between = 'show';
  const colors = {};
  const view = { density: 30, labelScale: 1, elabelScale: 1, spring: 1, repel: 1, spin: true,
                 map: true, split: 0, mapH: 0, snap: true };
  const picked = new Set();
  let pathLinks = new Set();
  // the same file is served from this machine and published as a flat page; only the served
  // one has a model behind it, and it is served over the tunnel as much as over loopback
  const served = !!window.SLACK_GRAPH_LIVE;
  let answer = null;
  let query = '';
  let selected = null;

  const bothPeople = l => {
    const a = typeof l.source === 'object' ? l.source : byId.get(l.source);
    const b = typeof l.target === 'object' ? l.target : byId.get(l.target);
    return !!a && !!b && a.kind === 'person' && b.kind === 'person';
  };
  const linkP2PGone = l => display.between !== 'show' && bothPeople(l);
  const linkP2PDropped = l => display.between === 'remove' && bothPeople(l);
  const srcGone = d => d.session && display.source.session !== 'show';
  const srcDropped = d => d.session && display.source.session === 'remove';
  const gone = d => display.node[d.kind] !== 'show' || srcGone(d);
  const dropped = d => display.node[d.kind] === 'remove' || srcDropped(d);
  const linkGone = l => display.link[l.rel] !== 'show' || srcGone(l) || linkP2PGone(l)
    || gone(l.source) || gone(l.target);
  const linkDropped = l => display.link[l.rel] === 'remove' || srcDropped(l) || linkP2PDropped(l)
    || dropped(l.source) || dropped(l.target);

  function paint(kind, hex) {
    colors[kind] = hex;
    document.documentElement.style.setProperty(`--k-${kind}`, hex);
  }
  function saveDisplay() {
    try { localStorage.setItem('velanir-graph-display', JSON.stringify({ display, colors, view })); } catch (e) {}
  }
  try {
    const saved = JSON.parse(localStorage.getItem('velanir-graph-display') || 'null');
    if (saved && saved.view) Object.assign(view, saved.view);
    if (saved && saved.display) {
      Object.assign(display.node, saved.display.node || {});
      Object.assign(display.link, saved.display.link || {});
      Object.assign(display.source, saved.display.source || {});
      if (saved.display.between) display.between = saved.display.between;
      if (saved.display.edgeLabels) display.edgeLabels = saved.display.edgeLabels;
    }
    Object.entries((saved && saved.colors) || {}).forEach(([k, v]) => paint(k, v));
  } catch (e) {}

  // ---- header
  const st = G.stats || {};
  // the header counts what is in the picture, so dropping the working sessions changes it
  function counted() {
    const out = { nodes: 0, edges: 0, members: 0, by_kind: {} };
    for (const n of G.nodes) {
      if (srcDropped(n)) continue;
      out.nodes++;
      out.by_kind[n.kind] = (out.by_kind[n.kind] || 0) + 1;
      if (n.attrs && n.attrs.member) out.members++;
    }
    out.edges = G.edges.filter(e => !srcDropped(e)).length;
    return out;
  }
  function paintCounts() {
    const c = counted();
    document.getElementById('stats').innerHTML =
      `<span><b>${st.messages ?? 0}</b> messages</span><span><b>${c.members}</b> members</span><span><b>${c.nodes}</b> nodes</span><span><b>${c.edges}</b> links</span>`;
  }
  const msgs = Object.values(G.messages || {});
  if (msgs.length) {
    const ts = msgs.map(m => +m.ts).sort((a, b) => a - b);
    const f = t => new Date(t * 1000).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    document.getElementById('subtitle').textContent = `${f(ts[0])} – ${f(ts[ts.length - 1])} · ${[...new Set(msgs.map(m => m.channel).filter(Boolean))].join(', ')}`;
  }
  paintCounts();

  // ---- one box: typing narrows the graph, Enter asks the model about what is in it
  const qBox = document.getElementById('q'), qCount = document.getElementById('qcount');
  // the filter in the graph is the graph's own; asking the model pushes its answer into it
  const gBox = document.getElementById('gq');
  gBox.addEventListener('input', () => {
    answer = null; pathLinks = new Set();
    query = gBox.value.trim().toLowerCase();
    refresh();
  });
  gBox.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    gBox.value = ''; query = ''; answer = null; refresh();
  });
  const qTurns = document.getElementById('qturns');
  const detailPane = document.getElementById('detail'), askPane = document.getElementById('askpane');
  // Both panes are on screen at once, so nothing needs switching to. Asking scrolls its own
  // side; what the answer is about fills the other.
  function face(which) {
    if (which === 'ask') qTurns.scrollTop = qTurns.scrollHeight;
  }
  const qNote = document.getElementById('qnote');
  const turns = [];
  let asking = false;

  function say(role, text) {
    const el = document.createElement('div');
    el.className = 't' + (role === 'user' ? ' mine' : '');
    el.textContent = text;
    qTurns.appendChild(el);
    qTurns.scrollTop = qTurns.scrollHeight;
    return el;
  }
  // Every answer stays clickable: what it lit up and what it was about come back with it, so
  // the conversation is the history of the graph as much as of the words.
  // Numbered, so an exchange can be referred to out loud, and because a conversation you can
  // point at is one you can carry on rather than restart.
  let exchanges = 0;
  function replayable(el, ids, said) {
    el.classList.add('replay');
    el.dataset.n = String(++exchanges);
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'show-again';
    button.textContent = `show these ${ids.length} on the graph`;
    el.appendChild(button);
    const again = () => {
      selected = null;
      answer = ids.length ? new Set(ids) : null;
      qCount.textContent = ids.length ? String(ids.length) : '';
      refresh();
      renderFound(ids, said);
      qTurns.querySelectorAll('.t.here').forEach(x => x.classList.remove('here'));
      el.classList.add('here');
    };
    button.addEventListener('click', e => { e.stopPropagation(); again(); });
    el.addEventListener('click', again);
  }
  function openAnswers(note) {
    face('ask');
    if (note !== undefined) qNote.textContent = note;
  }
  function closeAnswers() {
    qTurns.textContent = '';
    qNote.textContent = '';
    turns.length = 0;
    exchanges = 0;
    face('details');
  }
  document.getElementById('qform').addEventListener('submit', e => { e.preventDefault(); ask(); });
  document.getElementById('qclear').addEventListener('click', () => {
    qBox.value = ''; query = ''; answer = null; qCount.textContent = '';
    closeAnswers(); refresh(); qBox.focus();
  });

  // Typing used to filter on every keystroke, so the graph lurched about while a question was
  // still being written. Nothing moves until enter.
  qBox.addEventListener('input', () => {
    if (!qBox.value.trim() && (query || answer)) {
      query = ''; answer = null; qCount.textContent = ''; refresh();
    }
  });
  async function ask(e) {
    if (e && e.key === 'Escape') {
      qBox.value = ''; query = ''; answer = null; qCount.textContent = '';
      closeAnswers(); refresh(); return;
    }
    if (e && e.key !== 'Enter') return;
    if (asking) return;
    if (e) e.preventDefault();
    const question = qBox.value.trim();
    if (!question) return;
    // the plain text search runs first, so something is lit up while the model thinks
    query = question.toLowerCase();
    answer = null;
    refresh();
    if (!served) {
      // a published page cannot run a model, so the best lexical hit is the answer
      search();
      const best = nodes.filter(n => found && found.direct.has(n.id))
        .sort((a, b) => PAINT[b.kind] - PAINT[a.kind] || b.mentions - a.mentions)[0];
      openAnswers(best ? '' : `nothing here matches “${question}”`);
      say('user', question);
      say('assistant', best
        ? `The closest thing in the graph is ${best.label}. Asking in words needs the page served from the machine that holds the model.`
        : 'Nothing in the graph matches that, and asking in words needs the page served from the machine that holds the model.');
      if (best) select(best.id);
      return;
    }
    asking = true;
    openAnswers('thinking…');
    say('user', question);
    turns.push({ role: 'user', content: question });
    const pending = say('assistant', '…');
    try {
      const r = await fetch('/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                      body: JSON.stringify({ question, turns: turns.slice(0, -1) }) });
      const out = await r.json();
      if (!r.ok) {
        pending.textContent = out.error || 'the model did not answer';
        qNote.textContent = ''; turns.pop(); return;
      }
      const said = out.content || out.why || 'Nothing in the graph answers that.';
      pending.textContent = said;
      turns.push({ role: 'assistant', content: said });
      answer = out.ids.length ? new Set(out.ids) : null;
      query = out.ids.length ? '' : query;
      // the answer names things; the pane beside it shows the first of them, so reading the
      // answer and reading what it is about do not take turns
      if (out.ids.length) {
        answer = new Set(out.ids);
        pathLinks = new Set();
        qCount.textContent = String(out.ids.length);
        refresh();
        renderFound(out.ids, said);
        replayable(pending, out.ids, said);
        qTurns.querySelectorAll('.t.here').forEach(x => x.classList.remove('here'));
        pending.classList.add('here');
      }
      qCount.textContent = out.ids.length ? String(out.ids.length) : '';
      qNote.textContent = (out.ids.length ? `${out.ids.length} lit up` : 'nothing to light up')
        + (out.why ? ` · ${out.why}` : '');
      refresh();
    } catch (err) {
      pending.textContent = 'no answer from the server';
      qNote.textContent = ''; turns.pop();
    } finally { asking = false; }
  }
  qBox.addEventListener('keydown', ask);

  // ---- graph
  const nodes = G.nodes.map(n => ({ ...n }));
  const byId = new Map(nodes.map(n => [n.id, n]));
  const links = G.edges.filter(e => byId.has(e.source) && byId.has(e.target)).map(e => ({ ...e }));
  // Who counts as joined to whom follows what is on screen. Reaching through a relation you
  // have switched off lit up nodes with no visible edge to explain them.
  // A pair joined more than once — A mentions B and B replied to A — used to be one line with
  // one arrowhead, because both were drawn on exactly the same two points. Each edge is nudged
  // off the centre line instead, so both are there to see and to click.
  (() => {
    const bundles = new Map();
    for (const l of links) {
      const pair = [l.source, l.target].sort().join('\u0000');
      (bundles.get(pair) || bundles.set(pair, []).get(pair)).push(l);
    }
    for (const together of bundles.values()) {
      if (together.length < 2) { together[0].bend = 0; continue; }
      together.forEach((l, i) => { l.bend = (i - (together.length - 1) / 2) * 9; });
    }
  })();

  const neighbors = new Map();
  const endOf = x => (typeof x === 'object' ? x : byId.get(x));
  function buildNeighbors() {
    neighbors.clear();
    for (const l of links) {
      // resolved by hand rather than through linkGone: before the simulation runs, an end is
      // still an id, and asking a string for its kind hides every edge on the page
      const a = endOf(l.source), b = endOf(l.target);
      if (!a || !b) continue;
      // a relation with no state yet is shown, the same as when the states are first filled in
      if ((display.link[l.rel] || 'show') !== 'show' || srcGone(l) || linkP2PGone(l)
          || gone(a) || gone(b)) continue;

  function sharedGround() {
    if (ground) return ground;
    const byTopic = new Map();
    for (const l of links) {
      for (const [t, who] of [[l.source, l.target], [l.target, l.source]]) {
        if (t.kind !== 'topic' || who.kind !== 'person' || !who.attrs.member) continue;
        if (!byTopic.has(t.id)) byTopic.set(t.id, new Set());
        byTopic.get(t.id).add(who.id);
      }
    }
    ground = [...byTopic]
      .filter(([, who]) => who.size > 1)
      .map(([id, who]) => ({ topic: byId.get(id), people: [...who].map(x => byId.get(x)) }))
      .sort((a, b) => b.people.length - a.people.length || a.topic.label.localeCompare(b.topic.label));
    return ground;
  }
  function groundHtml() {
    const rows = sharedGround();
    if (!rows.length) return '';
    const pairs = new Set();
    rows.forEach(r => r.people.forEach((a, i) => r.people.slice(i + 1)
      .forEach(b => pairs.add([a.id, b.id].sort().join('|')))));
    return `<h3>${esc(COPY.ground)} · ${pairs.size} pair${pairs.size === 1 ? '' : 's'}</h3>
      <div class="shared">${rows.map(r => `<div class="row">
        <button class="chip" data-id="${esc(r.topic.id)}">${swatch('topic', 9)}${esc(r.topic.label)}</button>
        <span class="who">${r.people.map(x => `<button data-id="${esc(x.id)}">${esc(x.label)}</button>`).join('')}</span>
      </div>`).join('')}</div>`;
  }
  // Ranked by how alike two members' own words read, which is a hint about who to introduce and
  // not a claim that they said the same thing. Only the closest few, and only pairs the exact
  // shared-topic list already misses, so the two blocks never say the same thing twice.
  const CLOSE_FRACTION = 0.15, CLOSE_MAX = 5;
  function closeByBackground() {
    const ranked = DATA.affinity || [];
    if (ranked.length < 4) return [];
    const already = new Set();
    sharedGround().forEach(r => r.people.forEach((a, i) => r.people.slice(i + 1)
      .forEach(b => already.add([a.id, b.id].sort().join('|')))));
    return ranked.slice(0, Math.ceil(ranked.length * CLOSE_FRACTION))
      .filter(([a, b]) => !already.has([a, b].sort().join('|')) && byId.has(a) && byId.has(b))
      .slice(0, CLOSE_MAX)
      .map(([a, b, score]) => ({ a: byId.get(a), b: byId.get(b), score }));
  }
  function closeHtml() {
    const rows = closeByBackground();
    if (!rows.length) return '';
    return `<h3>Close by background</h3>
      <p class="caveat">How alike their introductions read. Not a shared topic — read both and judge.</p>
      <div class="close">${rows.map(r => `<div class="row">
        <button data-id="${esc(r.a.id)}">${esc(r.a.label)}</button><span class="tilde">~</span>
        <button data-id="${esc(r.b.id)}">${esc(r.b.label)}</button>
      </div>`).join('')}</div>`;
  }
  // The ids that come back are everything the tools touched — the working, not the answer.
  // Filling this pane with all of it buries what was asked about, so the pane lists the
  // entries the answer actually names, and the rest merely light up on the graph.
  let fromAnswer = null;
  // An answer names things the tools never handed back as ids — it reads a quote and names the
  // person in it. So the match is against the whole graph, on whole words, and anything the
  // tools opened without the answer mentioning is counted rather than listed.
  const words = t => ' ' + String(t).toLowerCase()
    .replace(/[^\p{L}\p{N}]+/gu, ' ').replace(/\s+/g, ' ').trim() + ' ';
  function namedIn(said) {
    const text = words(said);
    return nodes.filter(n => {
      const label = words(n.label);
      // a label that normalises to nothing would match the gap between any two words
      return label.length > 2 && n.label.length >= 3 && !gone(n) && text.includes(label);
    });
  }
  function renderFound(ids, said) {
    // What is lit up is what the search found, never what the prose says. An answer is written
    // for a person and uses ordinary words — "the community's fintech conversation" — and
    // reading nodes out of it lights up whatever happens to share a name with one.
    const here = ids.map(id => byId.get(id)).filter(Boolean);
    const spoken = new Set(namedIn(said).map(n => n.id));
    // the ones the answer talks about come first; the rest are the working behind it
    const shown = here.sort((a, b) => (spoken.has(b.id) - spoken.has(a.id))
      || PAINT[b.kind] - PAINT[a.kind] || (b.mentions || 0) - (a.mentions || 0));
    fromAnswer = { ids, said };
    const el = document.getElementById('detail');
    el.innerHTML = `<h3>In this answer · ${shown.length}</h3>
      <div class="links">${shown.map(n => `<button data-id="${esc(n.id)}">${swatch(n.kind, 9)}<span class="rel">${esc(n.kind)}</span>${esc(n.label)}</button>`).join('')}</div>
      ${spoken.size && spoken.size < shown.length
          ? `<p class="aside-note">The first ${spoken.size} are named in the answer; the rest are what it read to get there.</p>` : ''}
      ${footer()}`;
    wireRefs(el);
    el.scrollTop = 0;
  }

  function renderDetail(n) {
    const el = document.getElementById('detail');
    if (!n) {
      el.innerHTML = `<div class="placeholder"><h3>${esc(COPY.heading)}</h3>${groundHtml()}${closeHtml()}${COPY.note ? `<p class="aside-note">${esc(COPY.note)}</p>` : ''}</div>`;
      wireRefs(el);
      return;
    }
    const attrs = Object.entries(n.attrs).filter(([k, v]) => !k.endsWith('_message') && k !== 'member' && k !== 'type' && k !== 'handle' && !(k === 'stated_location' && v === n.attrs.location)).map(([k, v]) => [k, Array.isArray(v) ? v.join(', ') : v]);
    // the panel lists what the graph is showing; a relation you have switched off is counted,
    // not listed, so the two never disagree about what this node is joined to
    const joined = links.filter(l => l.source.id === n.id || l.target.id === n.id);
    const rels = joined.filter(l => !linkGone(l)).sort((a, b) => b.weight - a.weight);
    const hiddenRels = joined.length - rels.length;
    // evidence follows the same switch the nodes do: with working sessions out of the picture,
    // a transcript turn is not what this member said
    const fromSession = m => m.channel === '#sessions' && display.source.session !== 'show';
    const quotes = (n.messages || []).map(id => G.messages[id]).filter(Boolean)
      .filter(m => !fromSession(m)).sort((a, b) => +b.ts - +a.ts).slice(0, 12);
    el.innerHTML = `
      <div class="kind">${swatch(n.kind)}${n.kind}${n.attrs.type ? ' · ' + esc(n.attrs.type) : ''}${n.attrs.member ? ' · member' : ''}</div>
      <h2>${esc(shown(n))}</h2>
      ${attrs.length ? `<dl class="attrs">${attrs.map(([k, v]) => `<dt>${esc(k.replace(/_/g, ' '))}</dt><dd>${k === 'url' ? `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(v)}</a>` : esc(v)}</dd>`).join('')}</dl>` : ''}
      ${rels.length ? `<details class="fold"><summary>Connections · ${rels.length}${hiddenRels ? ` <span class="muted">(${hiddenRels} hidden)</span>` : ''}</summary><div class="links">${rels.map(l => { const o = l.source.id === n.id ? l.target : l.source; return `<button data-id="${esc(o.id)}">${swatch(o.kind, 9)}<span class="rel">${l.source.id === n.id ? l.rel : '← ' + l.rel}</span>${esc(o.label)}</button>`; }).join('')}</div></details>` : ''}
      ${quotes.length ? `<h3>Evidence · ${quotes.length} message${quotes.length === 1 ? '' : 's'}</h3>${quotes.map(quoteHtml).join('')}` : ''}
      ${fromAnswer ? `<button class="back" id="back-to-answer">← back to the answer</button>` : ''}
      ${footer()}`;
    wireRefs(el);
    const back = document.getElementById('back-to-answer');
    if (back) back.addEventListener('click', () => renderFound(fromAnswer.ids, fromAnswer.said));
    el.scrollTop = 0;
  }
  function wireRefs(el) {
    el.querySelectorAll('button[data-id]').forEach(b => b.addEventListener('click', () => select(b.dataset.id)));
    el.querySelectorAll('button[data-edge]').forEach(b =>
      b.addEventListener('click', () => selectEdge(links[+b.dataset.edge])));
  }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const when = ts => new Date(+ts * 1000).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  // Every node label that appears in a quote becomes a way into that node, so the evidence is a
  // route through the graph rather than a dead end. Longest label wins where two overlap.
  const linkable = nodes.filter(n => n.label.length >= 3)
    .sort((a, b) => b.label.length - a.label.length);
  const reSafe = t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  function linkify(text) {
    const hits = [];
    for (const n of linkable) {
      const re = new RegExp(`(^|[^\\p{L}\\p{N}])(${reSafe(n.label)})(?![\\p{L}\\p{N}])`, 'giu');
      let m;
      while ((m = re.exec(text))) {
        const start = m.index + m[1].length;
        hits.push({ start, end: start + m[2].length, id: n.id });
        re.lastIndex = start + m[2].length;
      }
    }
    hits.sort((a, b) => a.start - b.start || (b.end - b.start) - (a.end - a.start));
    let out = '', at = 0;
    for (const h of hits) {
      if (h.start < at) continue;
      out += esc(text.slice(at, h.start));
      out += `<button class="ref" data-id="${esc(h.id)}">${esc(text.slice(h.start, h.end))}</button>`;
      at = h.end;
    }
    return out + esc(text.slice(at));
  }
  const factEdge = fact => links.findIndex(l =>
    fact === `${l.source.label} ${relText(l.rel)} ${l.target.label}`);
  // How a reading was made, for anyone who wants to know whether to trust it. Out of the way
  // until asked for: the answer to "which model said this" is rarely the reason you are here.
  const READ_ORDER = ['model', 'version', 'prompt', 'context', 'n_predict', 'at'];
  const READ_NAME = { n_predict: 'answer limit', at: 'read on', version: 'extractor' };
  function readHtml(m) {
    const read = m.read || {};
    const rows = READ_ORDER.filter(k => read[k] !== undefined && read[k] !== '')
      .map(k => `<dt>${esc(READ_NAME[k] || k)}</dt><dd>${esc(String(read[k]).replace('T', ' ').slice(0, 40))}</dd>`)
      .join('');
    if (!rows) return '';
    return `<details class="read"><summary title="How this message was read">how it was read</summary><dl>${rows}</dl></details>`;
  }
  function quoteHtml(m) {
    const facts = (m.facts || []).map(f => {
      const i = factEdge(f);
      return `<li>${linkify(f)}${i < 0 ? '' : ` <button class="ref rel" data-edge="${i}">link</button>`}</li>`;
    }).join('');
    return `<blockquote class="msg">${m.url ? `<a class="open" href="${esc(m.url)}" target="_blank" rel="noopener">Open in Slack ↗</a>` : ''}<span class="who">${esc(m.sender)}</span><span class="when">${esc(m.channel)} · ${when(m.ts)}</span><br>${linkify(m.text)}${facts ? `<ul class="facts">${facts}</ul>` : ''}${readHtml(m)}</blockquote>`;
  }
  // A model has a name; the file it arrived in has a filename, and nobody wants to read
  // "-mxfp4-00001-of-00003.gguf" to find out which model read their messages.
  function modelName(file) {
    return String(file).replace(/\.(gguf|safetensors|bin)$/i, '')
      .replace(/-\d{5}-of-\d{5}$/i, '')
      .replace(/[-_.](mxfp4|q\d[_a-z0-9]*|iq\d[_a-z0-9]*|ud|bf16|f16|f32|fp16|moe)$/gi, '')
      .replace(/[-_.](mxfp4|q\d[_a-z0-9]*|iq\d[_a-z0-9]*|ud|bf16|f16|f32|fp16|moe)$/gi, '')
      .replace(/[-_.]+$/, '');
  }
  // what built this, on the thing it built, rather than at the foot of a panel about something
  // else. Returns nothing for the panels, which no longer carry it.
  function footer() { return ''; }
  (() => {
    const meta = G.meta || {};
    document.getElementById('built').textContent =
      (DATA.author ? DATA.author + ' · ' : '')
      + 'built ' + (meta.built_at ? meta.built_at.replace('T', ' ').slice(0, 16) : '—')
      + (meta.model ? ' · ' + modelName(meta.model) : '');
  })();
  function selectEdge(l) {
    selected = null; refresh();
    link.classed('on', x => x === l).classed('dim', x => x !== l);
    node.classed('dim', d => d !== l.source && d !== l.target).classed('hushed', d => d !== l.source && d !== l.target);
    const el = document.getElementById('detail');
    const quotes = (l.messages || []).map(id => G.messages[id]).filter(Boolean)
      .filter(m => !(m.channel === '#sessions' && display.source.session !== 'show'))
      .sort((a, b) => +b.ts - +a.ts);
    el.innerHTML = `
      <div class="kind">link</div>
      <div class="edge-head"><button class="chip" data-id="${esc(l.source.id)}">${swatch(l.source.kind, 9)}${esc(shown(l.source))}</button><span class="rel">${esc(l.rel.replace(/_/g, ' '))}</span><button class="chip" data-id="${esc(l.target.id)}">${swatch(l.target.kind, 9)}${esc(shown(l.target))}</button></div>
      <h3>Evidence · ${quotes.length} message${quotes.length === 1 ? '' : 's'}</h3>${quotes.map(quoteHtml).join('')}${footer()}`;
    wireRefs(el);
    el.scrollTop = 0;
  }
  const tipEl = document.getElementById('tip');
  function tip(e, a, b) { tipEl.innerHTML = `<div>${a}</div><div class="sub">${b || ''}</div>`; tipEl.style.left = (e.clientX + 12) + 'px'; tipEl.style.top = (e.clientY + 12) + 'px'; tipEl.classList.add('on'); }
  function hideTip() { tipEl.classList.remove('on'); }
  select(null);

  // ---- asking for a change
  // These are statements about real people, so a request is recorded and shown to whoever
  // curates the graph. Nothing here edits the graph on its own.
  const ASK_KINDS = ['Fix my information', 'Remove something', 'New feature', 'Bug', 'Something else'];
  let askKind = ASK_KINDS[0];
  const askKindBox = document.getElementById('ask-kind');
  const syncAskKinds = () => [...askKindBox.children].forEach(b =>
    b.setAttribute('aria-pressed', String(b.textContent === askKind)));
  ASK_KINDS.forEach(k => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = k;
    b.addEventListener('click', () => { askKind = k; syncAskKinds(); });
    askKindBox.appendChild(b);
  });
  syncAskKinds();

  const pickedBox = document.getElementById('picked');
  const askForm = document.getElementById('ask');
  const askText = document.getElementById('ask-text');
  const askNote = document.getElementById('ask-note');

  const pickLabel = key => {
    if (key.startsWith('node:')) return (byId.get(key.slice(5)) || {}).label || key;
    const l = links[+key.slice(5)];
    return l ? `${shown(l.source)} ${relText(l.rel)} ${shown(l.target)}` : key;
  };
  function pick(key) {
    if (!picked.size) document.getElementById('ask-box').open = true;
    picked.has(key) ? picked.delete(key) : picked.add(key);
    renderPicked();
    refresh();
  }
  function renderPicked() {
    if (!picked.size) {
      pickedBox.innerHTML = '<span class="hint-inline">Shift-click nodes or links to gather what this is about.</span>';
      return;
    }
    pickedBox.innerHTML = '';
    picked.forEach(key => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = `${pickLabel(key)} ✕`;
      b.addEventListener('click', () => pick(key));
      pickedBox.appendChild(b);
    });
  }
  renderPicked();

  const askWho = document.getElementById('ask-who');
  const askAttest = document.getElementById('ask-attest');
  nodes.filter(n => n.kind === 'person' && n.attrs.member)
    .sort((a, b) => a.label.localeCompare(b.label))
    .forEach(n => {
      const opt = document.createElement('option');
      opt.value = n.id;
      opt.textContent = n.label;
      askWho.appendChild(opt);
    });

  askForm.addEventListener('submit', async e => {
    e.preventDefault();
    const text = askText.value.trim();
    if (!text) { askNote.textContent = 'Say what should change.'; return; }
    if (!askWho.value) { askNote.textContent = 'Choose which of these is you.'; return; }
    if (!askAttest.checked) {
      askNote.textContent = 'Tick the box to say this is your own information.';
      return;
    }
    const body = {
      at: new Date().toISOString(),
      kind: askKind,
      claimed: askWho.value,
      claimedLabel: (byId.get(askWho.value) || {}).label || '',
      attested: true,
      text,
      targets: [...picked].map(key => ({ key, label: pickLabel(key) })),
    };
    if (served) {
      try {
        const r = await fetch('/request', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                            body: JSON.stringify(body) });
        askNote.textContent = r.ok ? 'Saved. It will be reviewed before anything changes.' : 'Could not save.';
        if (r.ok) { askText.value = ''; askAttest.checked = false; picked.clear(); renderPicked(); refresh(); }
      } catch (err) { askNote.textContent = 'Could not reach the local server.'; }
      return;
    }
    const asText = `[${body.kind}] ${body.text}\n\nAbout: ${body.targets.map(t => t.label).join(', ') || '(nothing selected)'}`;
    try {
      await navigator.clipboard.writeText(asText);
      askNote.textContent = 'Copied — paste it to Adam or in the channel.';
    } catch (err) {
      askNote.textContent = 'Copy this and send it: ' + asText;
    }
  });

  // ---- display panel
  const panel = document.getElementById('panel');
  const displayBtn = document.getElementById('display-btn');
  const syncers = [];
  let liveSig = '';

  const menu = displayBtn.closest('.menu');
  displayBtn.addEventListener('click', () => {
    displayBtn.setAttribute('aria-expanded', menu.classList.toggle('display-open'));
  });
  document.addEventListener('click', e => {
    if (!panel.contains(e.target) && e.target !== displayBtn) {
      menu.classList.remove('display-open');
      displayBtn.setAttribute('aria-expanded', 'false');
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && menu.classList.contains('display-open')) {
      menu.classList.remove('display-open');
      displayBtn.setAttribute('aria-expanded', 'false');
    }
  });

  function settingsChanged() {
    syncers.forEach(f => f());
    paintCounts();
    buildNeighbors();
    // only a removal reshapes the layout; hiding must leave every position where it was
    const sig = KINDS.map(k => display.node[k.k] === 'remove').join()
      + '|' + RELS.map(r => display.link[r] === 'remove').join()
      + '|' + display.source.session + '|' + display.between;
    if (sig !== liveSig) { liveSig = sig; applyRemoval(); }
    refresh();
    saveDisplay();
  }

  const hexOf = kind => (getComputedStyle(document.documentElement).getPropertyValue(`--k-${kind}`).trim() || '#888888');

  function stateRow(parent, nameHtml, count, get, set, states, colorKind) {
    const row = document.createElement('div');
    row.className = 'row';
    const name = document.createElement('span');
    name.className = 'name';
    name.innerHTML = `${nameHtml}${count == null ? '' : ` <span class="n">${count}</span>`}`;
    row.appendChild(name);
    const box = document.createElement('span');
    box.className = 'three';
    const buttons = states.map(st => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = st;
      b.addEventListener('click', () => { set(st); settingsChanged(); });
      box.appendChild(b);
      return [st, b];
    });
    row.appendChild(box);
    const slot = document.createElement('span');
    if (colorKind) {
      const picker = document.createElement('input');
      picker.type = 'color';
      picker.value = hexOf(colorKind);
      picker.addEventListener('input', () => { paint(colorKind, picker.value); settingsChanged(); });
      slot.appendChild(picker);
    }
    row.appendChild(slot);
    syncers.push(() => buttons.forEach(([st, b]) => b.setAttribute('aria-pressed', String(get() === st))));
    parent.appendChild(row);
  }

  function bulkRow(parent, apply) {
    const bar = document.createElement('div');
    bar.className = 'bulk';
    STATES.forEach(st => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = `${st} all`;
      b.addEventListener('click', () => { apply(st); settingsChanged(); });
      bar.appendChild(b);
    });
    parent.appendChild(bar);
  }

  function sliderRow(parent, text, key, min, max, step, apply) {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<span class="name"><span>${text}</span></span>`;
    const input = document.createElement('input');
    input.type = 'range';
    input.min = min; input.max = max; input.step = step; input.value = view[key];
    input.style.width = '120px';
    input.addEventListener('input', () => { view[key] = +input.value; apply(); saveDisplay(); });
    row.appendChild(input);
    row.appendChild(document.createElement('span'));
    parent.appendChild(row);
  }

  function heading(text) {
    const h = document.createElement('h4');
    h.textContent = text;
    panel.appendChild(h);
  }

  function applyLabelScale() {
    document.documentElement.style.setProperty('--label-scale', view.labelScale);
    document.documentElement.style.setProperty('--elabel-scale', view.elabelScale);
    measure();
    layoutLabels();
  }

  function buildPanel() {
    heading('Nodes');
    KINDS.forEach(k => stateRow(panel, `${swatch(k.k)}<span>${k.label}</span>`, counted().by_kind[k.k] ?? 0,
      () => display.node[k.k], v => { display.node[k.k] = v; }, STATES, k.k));
    bulkRow(panel, v => KINDS.forEach(k => { display.node[k.k] = v; }));

    if (st.session_nodes) {
      heading('Sources');
      stateRow(panel, '<span>Working sessions</span>', st.session_nodes,
        () => display.source.session, v => { display.source.session = v; }, STATES);
    }

    heading('Links');
    stateRow(panel, '<span>Between two people</span>', p2pCount,
      () => display.between, v => { display.between = v; }, STATES);
    RELS.forEach(r => stateRow(panel, `<span>${relText(r)}</span>`, relCount.get(r),
      () => display.link[r], v => { display.link[r] = v; }, STATES));
    bulkRow(panel, v => RELS.forEach(r => { display.link[r] = v; }));

    heading('Labels');
    stateRow(panel, '<span>Edge names</span>', null,
      () => display.edgeLabels, v => { display.edgeLabels = v; }, ['show', 'hide']);
    sliderRow(panel, 'How many', 'density', 0, 100, 1, layoutLabels);
    sliderRow(panel, 'Node size', 'labelScale', 0.7, 2, 0.05, applyLabelScale);
    sliderRow(panel, 'Edge size', 'elabelScale', 0.7, 2, 0.05, applyLabelScale);

    heading('Physics');
    stateRow(panel, '<span>Animate (3D)</span>', null,
      () => (view.spin ? 'show' : 'hide'),
      v => { view.spin = v === 'show'; setSpin(view.spin); }, ['show', 'hide']);
    sliderRow(panel, 'Springiness', 'spring', 0.3, 3, 0.05, () => {
      applyPhysics();
      sim.alpha(0.4).restart();
      if (g3) g3.d3ReheatSimulation();
    });
    sliderRow(panel, 'Repulsion', 'repel', 0.3, 3, 0.05, () => {
      applyPhysics();
      sim.alpha(0.4).restart();
      if (g3) g3.d3ReheatSimulation();
    });

    const reset = document.createElement('div');
    reset.className = 'bulk';
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = 'reset colours';
    b.addEventListener('click', () => {
      KINDS.forEach(k => document.documentElement.style.removeProperty(`--k-${k.k}`));
      Object.keys(colors).forEach(k => delete colors[k]);
      panel.querySelectorAll('input[type="color"]').forEach((el, i) => { el.value = hexOf(KINDS[i].k); });
      settingsChanged();
    });
    reset.appendChild(b);
    panel.appendChild(reset);

    heading('Built');
    const meta = G.meta || {};
    const about = document.createElement('div');
    about.className = 'about';
    about.innerHTML = [
      ['read by', meta.model ? modelName(meta.model) : '—'],
      ['embedded by', DATA.embedModel ? modelName(DATA.embedModel) : '—'],
      ['built', (meta.built_at || '').replace('T', ' ').slice(0, 16) || '—'],
      ['channels', (meta.channels || []).join(', ') || '—'],
      ['created by', DATA.author || '—'],
    ].map(([k, v]) => `<span class="k">${esc(k)}</span><span>${esc(v)}</span>`).join('');
    panel.appendChild(about);

    applyLabelScale();
    liveSig = KINDS.map(k => display.node[k.k] === 'remove').join()
      + '|' + RELS.map(r => display.link[r] === 'remove').join()
      + '|' + display.source.session + '|' + display.between;
    syncers.forEach(f => f());
  }
  buildPanel();

  // ---- local refresh (only when served by slack_graph.serve on this machine)
  const local = /^(127\.0\.0\.1|localhost)$/.test(location.hostname);
  if (local) {
    const box = document.getElementById('refresh'), btn = document.getElementById('refresh-btn'), st = document.getElementById('refresh-stage');
    box.classList.add('local');
    btn.addEventListener('click', () => {
      btn.disabled = true; st.textContent = 'starting…';
      const es = new EventSource('/refresh');
      es.onmessage = ev => {
        const d = JSON.parse(ev.data);
        st.textContent = `${d.stage}: ${d.detail}`;
        if (d.stage === 'done') { es.close(); st.textContent = 'done — reloading'; setTimeout(() => location.reload(), 600); }
        if (d.stage === 'error') { es.close(); btn.disabled = false; }
      };
      es.onerror = () => { es.close(); btn.disabled = false; if (!/done|error/.test(st.textContent)) st.textContent = 'refresh already running or server gone'; };
    });
  }
})();
</script>
