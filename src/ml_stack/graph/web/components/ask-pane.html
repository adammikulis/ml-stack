<!-- <ask-pane>: the conversation with the model: the question, the answer as it streams in -->
<style>
.qfoot { display: flex; align-items: center; gap: 8px; }
.qfoot .note { flex: 1; font-size: 11px; color: var(--ink-3); }
#qclear { padding: 2px 9px; font: inherit; font-size: 11px; border: 1px solid var(--line-strong);
  border-radius: 7px; background: var(--surface-2); color: var(--ink-2); cursor: pointer; }
#qclear:hover { color: var(--ink); }
.askpane { display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; gap: 9px;
  padding: 14px 16px 16px; min-height: 0; border-right: 1px solid var(--line);
  overflow: hidden; }  /* the turns list is the one thing that scrolls */
.askpane .turns { max-height: none; overflow: auto; align-content: start; }
.pane-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.pane-title { font: 600 11px var(--font-body); letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-3); margin: 0; }
.slot { margin-left: auto; font-family: var(--font-mono); font-size: 10px; color: var(--line-strong);
        text-transform: none; letter-spacing: 0; }
.chat { padding: 0 18px 12px; display: grid; gap: 8px; }
.turns { display: grid; gap: 7px; max-height: 30vh; overflow: auto; font-size: 13px; }
.turns .t { padding: 6px 9px; border-radius: 8px; background: var(--surface-2); color: var(--ink-2);
            white-space: pre-wrap; overflow-wrap: anywhere; }
.turns .t.mine { background: var(--ink); color: var(--bg); justify-self: end; max-width: 85%; }
.turns .t.replay { cursor: pointer; position: relative; padding-left: 26px; }
.turns .t.replay::before { content: attr(data-n); position: absolute; left: 8px; top: 6px;
  font-family: var(--font-mono); font-size: 10px; color: var(--line-strong); }
.turns .t.replay:hover { background: var(--surface); outline: 1px solid var(--line-strong); }
.turns .t.here { outline: 2px solid var(--accent); }
/* an answer that is a receipt rather than an answer: the graph has not moved */
.turns .t .queued { display: block; margin-top: 6px; font-size: 11px; color: var(--k-org); }
.show-again { display: block; margin-top: 8px; padding: 3px 9px; font: inherit; font-size: 11px;
  cursor: pointer; border: 1px solid var(--line-strong); border-radius: 8px;
  background: var(--surface); color: var(--ink-2); }
.show-again:hover { color: var(--ink); border-color: var(--accent); }
.chat-row { display: flex; gap: 7px; }
.chat-row input { flex: 1; min-width: 0; font: inherit; font-size: 13px; padding: 6px 9px;
                  border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); color: var(--ink); }
.chat-row button { padding: 4px 12px; border: 1px solid var(--line-strong); border-radius: 8px;
                   background: var(--ink); color: var(--bg); cursor: pointer; font-size: 12px; }
</style>
<template>
        <div class="askpane" id="askpane"><draft-note></draft-note><ask-trace></ask-trace>
          <div class="pane-head">
            <h3 class="pane-title" id="askpane-title">Ask the model</h3>
            <button type="button" id="qclear">clear</button>
          </div>
          <div class="session" id="askpane-session" hidden></div>
          <div class="turns" id="qturns"></div>
          <form class="chat-row" id="qform">
            <input id="q" type="text" placeholder="Ask about this graph" autocomplete="off">
            <button type="submit">Send</button>
          </form>
          <div class="qfoot"><span class="note" id="qnote" aria-live="polite"></span></div>
        </div>
</template>
<script>
(function () {
  const M = window.graphModel;
  const { PAINT, byId, joinUp, namedIn, nodes, picked, routeThrough, search, served } = M;
  function wire() {
    Object.assign(M, { openAnswers, face });
    const qBox = document.getElementById('q');
    const askedText = () => qBox.value.trim();
    const qTurns = document.getElementById('qturns');
    // Both panes are on screen at once, so nothing needs switching to. Asking scrolls its own
    // side; what the answer is about fills the other.
    function face(which) {
      if (which === 'ask') qTurns.scrollTop = qTurns.scrollHeight;
    }
    const qNote = document.getElementById('qnote');
    const turns = [];
    // A name for this conversation, kept so that reopening the page reopens the chat. The
    // turns themselves live in the graph, joined to the entries each answer drew on; this is
    // only the label under which to ask for them. localStorage can throw outright in a
    // private window or a preview, so every touch of it is guarded.
    const threadName = (() => {
      try {
        let name = localStorage.getItem('thread');
        if (!name) { name = 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
                     localStorage.setItem('thread', name); }
        return name;
      } catch (e) { return ''; }
    })();
    let asking = false;

    function say(role, text) {
      const el = document.createElement('div');
      el.className = 't' + (role === 'user' ? ' mine' : '');
      el.textContent = text;
      qTurns.appendChild(el);
      qTurns.scrollTop = qTurns.scrollHeight;
      return el;
    }
    // Reopen the conversation the store is holding. History used to live only in this array,
    // which meant closing the tab ended the conversation and no other machine could see it.
    // A server without the route simply has none, and the chat starts empty as before.
    async function reopen() {
      if (!threadName) return;
      try {
        const r = await fetch('/thread/' + encodeURIComponent(threadName));
        if (!r.ok) return;
        const kept = await r.json();
        if (kept.session) M.sessionLine(kept.session);
        for (const t of (kept.turns || [])) {
          if (!t.text) continue;
          turns.push({ role: t.role, content: t.text });
          const el = say(t.role, t.text);
          // an answer that arrives with its steps gets its tally back; without them it is
          // the plain bubble it always was
          const steps = t.steps || (t.meta && t.meta.steps);
          if (t.role === 'assistant' && steps) M.thoughtOver(el, steps);
        }
        if ((kept.turns || []).length) openAnswers('');
      } catch (e) { /* no history is not a broken page */ }
    }
    reopen();

    // Every answer stays clickable: what it lit up and what it was about come back with it, so
    // the conversation is the history of the graph as much as of the words.
    // Numbered, so an exchange can be referred to out loud, and because a conversation you can
    // point at is one you can carry on rather than restart.
    let exchanges = 0;
    function replayable(el, ids, said, asked) {
      el.classList.add('replay');
      el.dataset.n = String(++exchanges);
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'show-again';
      button.textContent = `show these ${ids.length} on the graph`;
      el.appendChild(button);
      // An answer that says who should work together and stops there has done half the job.
      // The model writes the note; a person reads it and sends it. Nothing here posts
      // anything anywhere — this page cannot reach the community, and should not be able to.
      if (served && ids.length > 1) M.draftable(el, ids, said, asked);
      const again = () => {
        M.selected = null;
        // the same three a fresh answer clears: refresh() runs search() first, and a stale
        // query or path would repaint over the count set just below
        M.query = '';
        M.pathLinks = new Set();
        M.answer = ids.length ? new Set(ids) : null;
        // replaying an answer replays what it showed, connectors included
        if (ids.length > 1) {
          const { joined, onPath } = joinUp(ids);
          M.answer = joined;
          M.pathLinks = onPath;
          M.runSignal(routeThrough(ids));
        }
        M.refresh();
        M.setCount(ids.length ? String(ids.length) : '');
        M.renderFound(ids, said);
        qTurns.querySelectorAll('.t.here').forEach(x => x.classList.remove('here'));
        el.classList.add('here');
      };
      button.addEventListener('click', e => { e.stopPropagation(); again(); });
      el.addEventListener('click', again);
    }
    function openAnswers(note) {
      face('ask');
      if (note !== undefined) qNote.textContent = note;
    }
    function closeAnswers() {
      qTurns.textContent = '';
      qNote.textContent = '';
      turns.length = 0;
      exchanges = 0;
      face('details');
    }
    document.getElementById('qform').addEventListener('submit', e => { e.preventDefault(); ask(); });
    document.getElementById('qclear').addEventListener('click', () => {
      qBox.value = ''; M.query = ''; M.answer = null; M.setCount('');
      closeAnswers(); M.refresh(); qBox.focus();
    });

    // Typing used to filter on every keystroke, so the graph lurched about while a question was
    // still being written. Nothing moves until enter.
    qBox.addEventListener('input', () => {
      if (!qBox.value.trim() && (M.query || M.answer)) {
        M.query = ''; M.answer = null; M.setCount(''); M.refresh();
      }
    });
    async function ask(e) {
      if (e && e.key === 'Escape') {
        qBox.value = ''; M.query = ''; M.answer = null; M.setCount('');
        closeAnswers(); M.refresh(); return;
      }
      if (e && e.key !== 'Enter') return;
      if (asking) return;
      if (e) e.preventDefault();
      const question = qBox.value.trim();
      if (!question) return;
      // what is lit right now rides along, so the model can keep it or leave it
      // only what the reader deliberately kept travels to the next question: gathered nodes
      // and the selected one. Carrying a whole previous answer drags its strangers along
      const highlighted = [...picked].filter(k => k.startsWith('node:')).map(k => k.slice(5));
      if (M.selected && !highlighted.includes(M.selected)) highlighted.push(M.selected);
      // the plain text search runs first, so something is lit up while the model thinks
      M.query = question.toLowerCase();
      M.answer = null;
      M.refresh();
      if (!served) {
        // a published page cannot run a model, so the best lexical hit is the answer
        search();
        const best = nodes.filter(n => M.found && M.found.direct.has(n.id))
          .sort((a, b) => PAINT[b.kind] - PAINT[a.kind] || b.mentions - a.mentions)[0];
        openAnswers(best ? '' : `nothing here matches “${question}”`);
        say('user', question);
        qBox.value = '';
        say('assistant', best
          ? `The closest thing in the graph is ${best.label}. Asking in words needs the page served from the machine that holds the model.`
          : 'Nothing in the graph matches that, and asking in words needs the page served from the machine that holds the model.');
        if (best) M.select(best.id);
        return;
      }
      asking = true;
      openAnswers('thinking…');
      say('user', question);
      qBox.value = '';
      turns.push({ role: 'user', content: question });
      const pending = say('assistant', '…');
      try {
        const payload = JSON.stringify({ question, turns: turns.slice(0, -1),
                                         ...(threadName ? { thread: threadName } : {}),
                                         ...(highlighted.length ? { highlighted } : {}) });
        // the streaming route shows the work as it happens; a server without it gets one POST
        let out = await askStream(payload, pending);
        if (out === null) {
          const r = await fetch('/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                          body: payload });
          out = await r.json();
          if (!r.ok) {
            sayInto(pending, out.error || 'the model did not answer');
            qNote.textContent = ''; turns.pop(); return;
          }
        }
        if (out.error) {
          sayInto(pending, out.error);
          qNote.textContent = ''; turns.pop(); return;
        }
        const said = out.content || out.why || 'Nothing in the graph answers that.';
        sayInto(pending, said);
        // asking for a change is not asking a question: it went to the review queue, and saying
        // so on the bubble is the only place the difference is visible
        if ((out.raised || []).length) {
          const note = document.createElement('span');
          note.className = 'queued';
          const n = out.raised.length;
          note.textContent = `${n} change request${n === 1 ? '' : 's'} awaiting review — the graph is unchanged.`;
          pending.appendChild(note);
          if (window.reloadReview) window.reloadReview();
        }
        turns.push({ role: 'assistant', content: said });
        // What lights up is what the answer is ABOUT, which only the model knows: it says so
        // with `show`. Everything else the server sends back is the working — every id the
        // tools touched, which includes whatever was already highlighted and re-read, and the
        // topic it opened to find the people it then wrote about. Lighting the working lights
        // the search and hides the answer, and that is what it did.
        // Failing `show`, the prose is the next best witness: the entries the answer names.
        const named = namedIn(said).map(n => n.id);
        const candidates = (out.show || []).length ? [...new Set(out.show)]
          : named.length ? named
          : ((out.read || []).length || (out.path || []).length)
            ? [...new Set([...(out.read || []), ...(out.path || [])])]
            : (out.ids || []);
        // one array behind every count: the button, the pane header and the note disagreed
        // whenever the server named something this page was not shipped
        const lit = candidates.filter(id => byId.has(id));
        M.query = lit.length ? '' : M.query;
        // the answer names things; the pane beside it shows the first of them, so reading the
        // answer and reading what it is about do not take turns
        if (lit.length) {
          M.answer = new Set(lit);
          M.pathLinks = new Set();
          M.setCount(String(lit.length));
          // An answer about several entries raises the question of how they join, every time,
          // so it is answered without being asked: the walk between them is drawn and the
          // connectors light with them. Asking for two people and being shown two unconnected
          // dots is the reader having to do the next step by hand.
          if (lit.length > 1) {
            const { joined, onPath } = joinUp(lit);
            M.answer = joined;
            M.pathLinks = onPath;
            M.runSignal(routeThrough(lit));
          }
          M.refresh();
          M.renderFound(lit, said);
          replayable(pending, lit, said, question);
          qTurns.querySelectorAll('.t.here').forEach(x => x.classList.remove('here'));
          pending.classList.add('here');
        }
        M.setCount(lit.length ? String(lit.length) : '');
        // The answer is about `lit`; joining them up lights the entries in between as well, so
        // a reader counting what is undimmed finds more than the count says. Say both.
        const joining = (M.answer ? M.answer.size : 0) - lit.length;
        // the tally and the steps ride inside the answer, folded, rather than under the
        // box: a long walk was a paragraph of trace beneath every question
        const tally = lit.length ? `${lit.length} lit up`
                        + (joining > 0 ? ` · ${joining} joining them` : '')
                      : 'nothing to light up';
        M.howItGotThere(pending, tally, out.why || '');
        qNote.textContent = '';
        M.refresh();
      } catch (err) {
        sayInto(pending, 'no answer from the server');
        qNote.textContent = ''; turns.pop();
      } finally { asking = false; }
    }
    qBox.addEventListener('keydown', ask);

    // the answer bubble may hold a thinking trace; only the spoken part is replaced
    function sayInto(el, text) {
      const spoken = el.querySelector('.said');
      if (spoken) spoken.textContent = text; else el.textContent = text;
    }

    // POST /ask/stream and fill the bubble live: the thinking dim and folded away, tool
    // steps as they run, the answer streaming in. null means the server has no such route.
    async function askStream(payload, pending) {
      let r;
      try {
        r = await fetch('/ask/stream', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                         body: payload });
      } catch (err) { return null; }
      if (r.status === 404) return null;
      if (!r.ok) {
        try { return await r.json(); } catch (err) { return { error: 'the model did not answer' }; }
      }
      const { think, now: label, trace, spoken, step } = M.openTrace(pending, '', true);
      label.textContent = 'thinking';
      let out = null;
      // A model serving one shape on a handful of slots queues a question behind whatever is
      // already running, and a page that only ever says "thinking…" is indistinguishable from
      // a broken one. If nothing has arrived in a while, say what is actually happening.
      let heard = false;
      const waited = setTimeout(() => {
        if (!heard) qNote.textContent = 'waiting for the model — it may be busy with another question';
      }, 20000);
      // what the live line is built from: how often each tool ran, and how much it touched
      const counts = { look_up: 0, look_at: 0, path_between: 0, list_kind: 0, show: 0,
                       restart: 0, other: {} };
      let answering = false;
      const feed = ev => {
        heard = true;
        if (ev.event === 'thinking') {
          trace.append(ev.text || '');
        } else if (ev.event === 'tool') {
          step(`▸ ${ev.name} ${ev.detail || ''}`);
          label.textContent = M.nowLine(ev.name, ev.detail);
          const n = parseInt(ev.detail || '', 10) || 0;
          if (ev.name === 'look_at' || ev.name === 'show') counts[ev.name] += n;
          else if (ev.name in counts && ev.name !== 'other') counts[ev.name] += 1;
          else if (ev.name !== 'shortlist') counts.other[ev.name] = (counts.other[ev.name] || 0) + 1;
        } else if (ev.event === 'tool_result') {
          step(`  → ${ev.count} back`);
          label.textContent += ` → ${ev.count} back`;
        } else if (ev.event === 'restart') {
          // it answered without looking anything up and was sent back to search; what is on
          // screen is about to be replaced rather than added to
          spoken.textContent = '';
          answering = false;
          counts.restart += 1;
          step('  ↻ answered without looking — sent back to search');
          label.textContent = 'answered without looking — searching again';
        } else if (ev.event === 'answer') {
          spoken.textContent += ev.text || '';
          if (!answering) { answering = true; label.textContent = 'answering'; }
        } else if (ev.event === 'done' || ev.event === 'error') {
          out = ev;
          if (ev.event === 'done') { label.textContent = M.tally(counts) + M.spentLine(ev); if (ev.spent) label.title = JSON.stringify(ev.spent, null, 1); if (ev.session) M.sessionLine(ev.session); }
        }
        qTurns.scrollTop = qTurns.scrollHeight;
      };
      const reader = r.body.getReader();
      const decoder = new TextDecoder();
      let buffered = '';
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buffered += decoder.decode(value, { stream: true });
        let cut;
        while ((cut = buffered.indexOf('\n\n')) >= 0) {
          const chunk = buffered.slice(0, cut);
          buffered = buffered.slice(cut + 2);
          for (const line of chunk.split('\n')) {
            if (!line.startsWith('data:')) continue;
            try { feed(JSON.parse(line.slice(5))); } catch (err) {}
          }
        }
      }
      clearTimeout(waited);
      think.open = false;
      if (!trace.childNodes.length) think.remove();
      return out || { error: 'the stream ended without an answer' };
    }
    Object.assign(M, { askedText });
  }
  class AskPane extends HTMLElement {
    connectedCallback() { if (!this.wired) { this.wired = true; wire(); } }
  }
  customElements.define('ask-pane', AskPane);
})();
</script>
