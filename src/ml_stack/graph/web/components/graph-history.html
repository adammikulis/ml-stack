<!-- <graph-history>: the messages replayed oldest first, each lighting the links it evidenced -->
<style>
/* A message crossing an arrow: a bright core inside a soft halo, so what is moving reads as
   light rather than as a dot. Both ride the edge as it is actually drawn. */
.orb-halo { fill: var(--accent); opacity: .22; pointer-events: none; }
.orb-core { fill: var(--accent); stroke: #fff; stroke-opacity: .85; stroke-width: 1; pointer-events: none; }
@media (prefers-reduced-motion: reduce) {
  .orb-halo, .orb-core { display: none !important; }
}
/* the history run: a dot rides each lit edge, the stroke flares to the accent and fades back */
.pulse { fill: var(--accent); pointer-events: none; }
.link { transition: stroke .45s, stroke-opacity .45s; }
.link.lit { stroke: var(--accent); stroke-opacity: 1; transition: none; }
.node .mark { transition: transform .25s; }
.node.lit .mark { transform: scale(1.3); }
.tools .when { font-size: 11px; color: var(--ink-2); font-family: var(--font-mono); }
</style>
<template>
        <button id="history" class="chip" aria-pressed="false"
                title="Play the messages through in order">▶ history</button>
        <div class="when" id="history-when" hidden></div>
</template>
<script>
(function () {
  const M = window.graphModel;
  const { G, links } = M;
  const { node, link, hitline, root, svg, sim } = M.view2d;
  function wire() {
    Object.assign(M, { stopHistory, playHistory, paintGlow });
    const histBtn = document.getElementById('history');
    const histWhen = document.getElementById('history-when');
    // the whole span compressed into this many ms; a test may override it before pressing play
    if (window.__historyClock == null) window.__historyClock = 25000;
    const GAP_MAX_MS = 1200, PULSE_MS = 600;
    const key3d = l => (l.source.id ?? l.source) + '|' + l.rel + '|' + (l.target.id ?? l.target);
    // how many pulses hold each key lit right now: the id of a node, a 2D link object, a 3D link key
    const glow = new Map();
    const up = k => glow.set(k, (glow.get(k) || 0) + 1);
    const down = k => { const n = (glow.get(k) || 1) - 1; n ? glow.set(k, n) : glow.delete(k); };
    const edgesOf = new Map();
    let histOrder = null;
    function buildHistory() {
      if (histOrder) return;
      for (const l of links) {
        for (const id of l.messages || []) {
          if (!edgesOf.has(id)) edgesOf.set(id, []);
          edgesOf.get(id).push(l);
        }
      }
      histOrder = [...edgesOf.keys()].filter(id => G.messages[id])
        .sort((a, b) => +G.messages[a].ts - +G.messages[b].ts);
    }
    let histPlaying = false;
    const histTimers = new Set();
    const later = (fn, ms) => {
      const t = setTimeout(() => { histTimers.delete(t); fn(); }, ms);
      histTimers.add(t);
    };
    function paintGlow() {
      node.classed('lit', d => glow.has(d.id));
      link.classed('lit', l => glow.has(l));
      if (M.g3 && M.is3d) {
        M.g3.linkDirectionalParticles(M.g3.linkDirectionalParticles());
        M.g3.linkDirectionalParticleSpeed(M.g3.linkDirectionalParticleSpeed());
        M.g3.nodeColor(M.g3.nodeColor());
      }
    }
    function beat(id) {
      const m = G.messages[id];
      // where the run has got to: the date only, never the text or the sender
      histWhen.textContent = new Date(+m.ts * 1000).toLocaleDateString();
      for (const l of edgesOf.get(id) || []) {
        [l.source.id, l.target.id, l, key3d(l)].forEach(up);
        if (!M.is3d && l.source.x != null) {
          // An orb rides the arrow itself — its drawn ends, trimmed clear of both marks and
          // bent the way the edge is bent — rather than the straight line between two centres,
          // which crosses whatever else is in the way and leaves the arrow it belongs to.
          const line = link.nodes()[links.indexOf(l)];
          const at = a => (line ? +line.getAttribute(a) : null);
          const x1 = at('x1') ?? l.source.x, y1 = at('y1') ?? l.source.y;
          const x2 = at('x2') ?? l.target.x, y2 = at('y2') ?? l.target.y;
          for (const [cls, r] of [['orb-halo', 9], ['orb-core', 3.5]]) {
            const orb = root.append('circle').attr('class', cls).attr('r', 0)
              .attr('cx', x1).attr('cy', y1);
            orb.transition().duration(PULSE_MS).ease(d3.easeQuadInOut)
              .attr('cx', x2).attr('cy', y2)
              .attrTween('r', () => t => r * Math.sin(Math.PI * Math.min(1, t * 1.15)))
              .on('end interrupt', () => orb.remove());
          }
        }
        later(() => { [l.source.id, l.target.id, l, key3d(l)].forEach(down); paintGlow(); }, PULSE_MS);
      }
      paintGlow();
    }
    function playHistory() {
      buildHistory();
      if (histPlaying || !histOrder.length) return;
      histPlaying = true;
      histBtn.textContent = '■ stop';
      histBtn.setAttribute('aria-pressed', 'true');
      histWhen.hidden = false;
      // the real gaps, scaled so the whole span fits the clock, each clamped so a quiet
      // stretch never stalls the run
      const t0 = +G.messages[histOrder[0]].ts;
      const t1 = +G.messages[histOrder[histOrder.length - 1]].ts;
      const scale = t1 > t0 ? (+window.__historyClock || 25000) / ((t1 - t0) * 1000) : 0;
      let at = 0, prev = t0;
      for (const id of histOrder) {
        at += Math.min(GAP_MAX_MS, (+G.messages[id].ts - prev) * 1000 * scale);
        prev = +G.messages[id].ts;
        later(() => beat(id), at);
      }
      later(stopHistory, at + PULSE_MS + 300);
    }
    function stopHistory() {
      if (!histPlaying) return;
      histPlaying = false;
      histTimers.forEach(clearTimeout);
      histTimers.clear();
      glow.clear();
      root.selectAll('.orb-halo, .orb-core').interrupt().remove();
      histBtn.textContent = '▶ history';
      histBtn.setAttribute('aria-pressed', 'false');
      histWhen.hidden = true;
      histWhen.textContent = '';
      paintGlow();
    }
    histBtn.addEventListener('click', () => (histPlaying ? stopHistory() : playHistory()));
    Object.assign(M, { glow, key3d });
  }
  class GraphHistory extends HTMLElement {
    connectedCallback() { if (!this.wired) { this.wired = true; wire(); } }
  }
  customElements.define('graph-history', GraphHistory);
})();
</script>
