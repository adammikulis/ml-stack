<!-- <ask-trace>: what answered, what it did to answer, and what it cost -->
<style>
.turns .t .how { margin-top: 6px; font-size: 11px; color: var(--ink-3); }
.turns .t .how summary { cursor: pointer; }
.turns .t .how p { margin: 4px 0 0; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.session { font: 11px var(--font-body); opacity: .7; margin: 2px 0 6px; }
.turns .t .think { margin: 0 0 5px; font-size: 11px; line-height: 1.45; color: var(--ink-3); }
.turns .t .think summary { cursor: pointer; list-style: none; color: var(--ink-3); }
.turns .t .think summary::-webkit-details-marker { display: none; }
.turns .t .think summary::before { content: "+ "; font-family: var(--font-mono); }
.turns .t .think[open] summary::before { content: "\2212 "; }
.turns .t .think .trace { margin-top: 3px; max-height: 20vh; overflow: auto;
  white-space: pre-wrap; overflow-wrap: anywhere; }
.turns .t .think .step { font-family: var(--font-mono); font-size: 10px; }
</style>
<script>
(function () {
  const M = window.graphModel;
  const { served } = M;
  function wire() {
    Object.assign(M, { openTrace, nowLine, tally, spentLine, sessionLine, howItGotThere,
                       thoughtOver });
    let slotContext = 0;   // tokens one slot holds, from /ask/model, to show a peak against
    // the served model's name, before anything is asked: the pane says what will answer
    if (served) {
      fetch('/ask/model').then(r => r.ok ? r.json() : null).then(d => {
        const title = document.getElementById('askpane-title');
        if (d && d.model && title) { title.textContent = 'Ask ' + modelShort(d.model); title.title = d.model; }
        if (d && d.slot_context) slotContext = d.slot_context;
      }).catch(() => {});
    }

    // The trace is the record of what the model did — the first thing to read when an answer
    // is wrong — and it stays. What it lacked was one sentence above it saying what is
    // happening now, readable with the trace folded; the summary of the fold is that line.
    const entries = n => `${n} entr${n === 1 ? 'y' : 'ies'}`;
    function nowLine(name, detail) {
      detail = detail || '';
      const n = parseInt(detail, 10) || 0;
      switch (name) {
        case 'look_up': return `looking up ${detail}`;
        case 'look_at': return `reading ${entries(n)}`;
        case 'path_between': return `tracing ${detail}`;
        case 'list_kind': return `listing ${detail}`;
        case 'show': return 'choosing what to light';
        case 'shortlist': return `starting from ${entries(n)}`;
        default: return `${name} ${detail}`.trim();
      }
    }
    // the same events in the past tense, once the answer has landed: zero counts left out
    // which model answered, and what it spent -- from the answer's `spent`; the whole record
    // goes on the label's title, so a tester can read every number without opening the console
    // the same rule as ml_stack.hub.pretty_name: path, .gguf, shard suffix and UD- go, the
    // quantisation moves into brackets -- "Qwen3.8-Flash-Next (IQ4_XS)"
    function modelShort(name) {
      let text = String(name || '').split(/[\\/]/).pop().replace(/\.gguf$/i, '').replace(/-\d{5}-of-\d{5}$/, '');
      const m = text.match(/-(?:UD-)?((?:IQ|Q)\d(?:_[A-Z0-9]+)+|mxfp4|BF16|F16|F32)/i);
      if (!m) return text;
      text = (text.slice(0, m.index) + text.slice(m.index + m[0].length)).replace(/^-+|-+$/g, '');
      return text + ' (' + m[1] + ')';
    }
    function kTokens(n) { return n >= 10000 ? Math.round(n / 1000) + 'k' : n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n); }
    function spentLine(ev) {
      const sp = ev.spent || {};
      const model = modelShort(ev.model || sp.model);
      if (!model && !sp.calls) return '';
      const bits = [];
      if (model) bits.push('answered by ' + model);
      if (sp.seconds) bits.push(sp.seconds.toFixed(1) + 's');
      if (sp.calls) bits.push(sp.calls + ' call' + (sp.calls === 1 ? '' : 's'));
      if (sp.read_tokens || sp.cached_tokens) bits.push('read ' + (sp.read_tokens || 0) + ', cached ' + (sp.cached_tokens || 0));
      if (sp.completion_tokens) bits.push('wrote ' + sp.completion_tokens);
      if (sp.decode_tokens_per_second) bits.push('wrote at ' + sp.decode_tokens_per_second + ' tok/s' + (sp.prompt_ms ? ', read ' + (sp.prompt_ms / 1000).toFixed(1) + 's' : ''));
      else if (sp.tokens_per_second) bits.push(sp.tokens_per_second + ' tok/s');
      if (sp.drafted && sp.acceptance != null) bits.push('draft ' + Math.round(sp.acceptance * 100) + '%');
      if (sp.context_peak) bits.push('context ' + kTokens(sp.context_peak) + (slotContext ? ' of ' + kTokens(slotContext) : ''));
      if (sp.truncated) bits.push('cut by the ceiling');
      return ' · ' + bits.join(' · ');
    }
    // the whole conversation's cost so far, from the answer's `session` (or the thread's)
    function sessionLine(sess) {
      const el = document.getElementById('askpane-session');
      if (!el) return;
      if (!sess || !sess.answers) { el.hidden = true; return; }
      const bits = ['this session: ' + sess.answers + ' answer' + (sess.answers === 1 ? '' : 's')];
      if (sess.seconds) bits.push(Math.round(sess.seconds) + 's');
      if (sess.calls) bits.push(sess.calls + ' calls');
      bits.push('read ' + (sess.read_tokens || 0) + ', cached ' + (sess.cached_tokens || 0) + ', wrote ' + (sess.completion_tokens || 0));
      if (sess.decode_tokens_per_second) bits.push('wrote at ' + sess.decode_tokens_per_second + ' tok/s'); else if (sess.tokens_per_second) bits.push(sess.tokens_per_second + ' tok/s');
      if (sess.drafted && sess.acceptance != null) bits.push('draft ' + Math.round(sess.acceptance * 100) + '%');
      if (sess.models && sess.models.length > 1) bits.push(sess.models.length + ' models');
      if (sess.context_peak) bits.push('peak context ' + kTokens(sess.context_peak) + (slotContext ? ' of ' + kTokens(slotContext) : ''));
      if (sess.truncated) bits.push(sess.truncated + ' cut by the ceiling');
      el.textContent = bits.join(' · ');
      el.title = JSON.stringify(sess, null, 1);
      el.hidden = false;
    }
    function tally(counts) {
      const parts = [];
      if (counts.look_up) parts.push(`looked up ${counts.look_up}`);
      if (counts.look_at) parts.push(`read ${entries(counts.look_at)}`);
      if (counts.path_between) parts.push(`traced ${counts.path_between} path${counts.path_between === 1 ? '' : 's'}`);
      if (counts.list_kind) parts.push(`listed ${counts.list_kind} kind${counts.list_kind === 1 ? '' : 's'}`);
      if (counts.show) parts.push(`lit ${entries(counts.show)}`);
      for (const name of Object.keys(counts.other || {})) {
        const k = counts.other[name];
        parts.push(`used ${name}${k > 1 ? ` ×${k}` : ''}`);
      }
      if (counts.restart) parts.push('searched again');
      return parts.length ? parts.join(', ') : 'thought';
    }
    // A replayed answer has no live trace, only what the server remembered it doing: the
    // tally goes above, and the remembered steps fold away underneath as the trace did.
    function howItGotThere(el, said, why) {
      const how = document.createElement('details');
      how.className = 'how';
      const head = document.createElement('summary');
      head.textContent = said;
      how.appendChild(head);
      if (why) { const p = document.createElement('p'); p.textContent = why; how.appendChild(p); }
      el.appendChild(how);
    }
    // The fold an answer bubble wears: a line saying what is happening, the trace under it,
    // and the words the model said beside them. `said` is what the bubble keeps saying while
    // the fold fills.
    function openTrace(el, said, open) {
      const think = document.createElement('details');
      think.className = 'think';
      think.open = !!open;
      const now = document.createElement('summary');
      now.className = 'now';
      const trace = document.createElement('div');
      trace.className = 'trace';
      think.append(now, trace);
      const spoken = document.createElement('span');
      spoken.className = 'said';
      spoken.textContent = said;
      el.textContent = '';
      el.append(think, spoken);
      const step = text => {
        const line = document.createElement('div');
        line.className = 'step';
        line.textContent = text;
        trace.appendChild(line);
      };
      return { think, now, trace, spoken, step };
    }
    function thoughtOver(el, steps) {
      const list = Array.isArray(steps) ? steps.map(String) : String(steps).split(/;\s*/);
      const done = list.filter(Boolean);
      if (!done.length) return;
      const { now, step } = openTrace(el, el.textContent, false);
      now.textContent = done.join(', ');
      for (const one of done) step(`▸ ${one}`);
    }
  }
  class AskTrace extends HTMLElement {
    connectedCallback() { if (!this.wired) { this.wired = true; wire(); } }
  }
  customElements.define('ask-trace', AskTrace);
})();
</script>
