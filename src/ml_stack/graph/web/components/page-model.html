<!-- page-model: the graph, the kinds and the copy every component reads, and the state they share -->
<script>
(function () {
  const M = window.graphModel = {};
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const WORLD = JSON.parse(document.getElementById('world').textContent);
  const G = DATA.graph;
  const SHAPES = { circle: d3.symbolCircle, square: d3.symbolSquare, diamond: d3.symbolDiamond,
                   triangle: d3.symbolTriangle, wye: d3.symbolWye, star: d3.symbolStar,
                   cross: d3.symbolCross };
  const KINDS = (DATA.kinds || []).map(k => ({ ...k, shape: SHAPES[k.shape] || d3.symbolCircle }));
  const kindOf = Object.fromEntries(KINDS.map(k => [k.k, k]));
  // a node whose kind the payload's list never named still has a shape
  const kindFor = k => kindOf[k] || { k, label: k, shape: d3.symbolCircle };
  const COPY = Object.assign({
    heading: 'What is here, and how it joins up',
    blurb: 'Click anything to see what it was read from.',
    note: '',
    onMap: 'on the map',
    // why the rest are not there; the count on its own reads as a gap in the data
    unplaced: 'have not said where they are',
    // How someone leaves entirely, said where they are already being asked what should
    // change. A graph built from what people said in public still owes them a way out, and
    // an owner is asked for it before they are asked for anything else.
    optOut: 'Everything here was said in public. To come out of it '
            + 'altogether, ask and the whole entry goes.',
    ground: 'Shared ground',
    // Where a message came from, named by whoever built the page: "Open in Slack", "Open the
    // thread", "Open the ticket". This page has no idea what it is reading and should not
    // guess -- naming one company's chat tool here is how a generic page stops being one.
    openMessage: 'Open ↗',
    // what a copied note is for, in whatever place this community actually talks
    copied: 'Copied — send it to whoever it is for.',
    empty: 'The graph fills in as messages are read.',
    // What the counts under the graph are called. A word left empty takes its count away,
    // for a graph that has no such thing.
    countMessages: 'messages',
    countMembers: 'members',
    countNodes: 'nodes',
    countLinks: 'links',
  }, DATA.copy || {});
  // A source whose messages are working notes rather than things members said -- a build log,
  // a transcript channel. Named by the caller because only it knows; unset, nothing hides.
  const ASIDE = String(DATA.asideSource || '');
  const kindById = Object.fromEntries(G.nodes.map(n => [n.id, n.kind]));
  const p2pCount = G.edges.filter(e => kindById[e.source] === 'person'
                                    && kindById[e.target] === 'person').length;
  // the payload's own colour is the fallback, so a kind the stylesheet never named is not black
  const colourOf = k => (kindOf[k] && kindOf[k].colour) || '#888888';
  const color = k => `var(--k-${k}, ${colourOf(k)})`;
  const swatch = (k, size = 9) => `<svg class="sw" width="${size}" height="${size}" viewBox="-7 -7 14 14"><path d="${d3.symbol().type(kindFor(k).shape).size(40)()}" fill="${color(k)}"/></svg>`;
  // show: drawn. hide: masked, but still shaping the layout. remove: out of the simulation, so
  // everything else re-settles without it.
  const STATES = ['show', 'hide', 'remove'];
  const display = { node: {}, link: {}, source: {}, edgeLabels: 'show' };
  KINDS.forEach(k => { display.node[k.k] = 'show'; });
  // Working sessions are the making of this graph, not the community in it. They start out of the
  // picture so the layout settles around what people actually said; the Display panel puts them back.
  display.source.session = 'remove';
  // person-to-person edges are what turns a readable graph into a hairball, so they get a
  // switch of their own on top of the per-relation ones
  display.between = 'show';
  const colors = {};
  const view = { density: 30, labelScale: 1, elabelScale: 1, spring: 1, repel: 1, spin: true,
                 map: true, split: 0, mapH: 0, snap: true, likewise: false };
  const picked = new Set();
  M.pathLinks = new Set();
  const served = !!window.GRAPH_LIVE;
  M.answer = null;
  M.query = '';
  M.selected = null;
  const bothPeople = l => {
    const a = typeof l.source === 'object' ? l.source : byId.get(l.source);
    const b = typeof l.target === 'object' ? l.target : byId.get(l.target);
    return !!a && !!b && a.kind === 'person' && b.kind === 'person';
  };
  const linkP2PGone = l => display.between !== 'show' && bothPeople(l);
  const linkP2PDropped = l => display.between === 'remove' && bothPeople(l);
  const srcGone = d => d.session && display.source.session !== 'show';
  const srcDropped = d => d.session && display.source.session === 'remove';
  const gone = d => display.node[d.kind] !== 'show' || srcGone(d);
  const dropped = d => display.node[d.kind] === 'remove' || srcDropped(d);
  const linkGone = l => display.link[l.rel] !== 'show' || srcGone(l) || linkP2PGone(l)
    || gone(l.source) || gone(l.target);
  const linkDropped = l => display.link[l.rel] === 'remove' || srcDropped(l) || linkP2PDropped(l)
    || dropped(l.source) || dropped(l.target);

  function paint(kind, hex) {
    colors[kind] = hex;
    document.documentElement.style.setProperty(`--k-${kind}`, hex);
  }
  function saveDisplay() {
    try { localStorage.setItem('graph-display', JSON.stringify({ display, colors, view })); } catch (e) {}
  }
  try {
    const saved = JSON.parse(localStorage.getItem('graph-display') || 'null');
    if (saved && saved.view) Object.assign(view, saved.view);
    if (saved && saved.display) {
      Object.assign(display.node, saved.display.node || {});
      Object.assign(display.link, saved.display.link || {});
      Object.assign(display.source, saved.display.source || {});
      if (saved.display.between) display.between = saved.display.between;
      if (saved.display.edgeLabels) display.edgeLabels = saved.display.edgeLabels;
    }
    Object.entries((saved && saved.colors) || {}).forEach(([k, v]) => paint(k, v));
  } catch (e) {}
  const stats = G.stats || {};
  function counted() {
    const out = { nodes: 0, edges: 0, members: 0, by_kind: {} };
    for (const n of G.nodes) {
      if (srcDropped(n)) continue;
      out.nodes++;
      out.by_kind[n.kind] = (out.by_kind[n.kind] || 0) + 1;
      if (n.attrs && n.attrs.member) out.members++;
    }
    out.edges = G.edges.filter(e => !srcDropped(e)).length;
    return out;
  }
  const nodes = G.nodes.map(n => ({ ...n }));
  const byId = new Map(nodes.map(n => [n.id, n]));
  const links = G.edges.filter(e => byId.has(e.source) && byId.has(e.target)).map(e => ({ ...e }));
  // Who counts as joined to whom follows what is on screen. Reaching through a relation you
  // have switched off lit up nodes with no visible edge to explain them.
  // A pair joined more than once — A mentions B and B replied to A — used to be one line with
  // one arrowhead, because both were drawn on exactly the same two points. Each edge is nudged
  // off the centre line instead, so both are there to see and to click.
  (() => {
    const bundles = new Map();
    for (const l of links) {
      const pair = [l.source, l.target].sort().join('\u0000');
      (bundles.get(pair) || bundles.set(pair, []).get(pair)).push(l);
    }
    for (const together of bundles.values()) {
      if (together.length < 2) { together[0].bend = 0; continue; }
      together.forEach((l, i) => { l.bend = (i - (together.length - 1) / 2) * 9; });
    }
  })();

  const neighbors = new Map();
  const endOf = x => (typeof x === 'object' ? x : byId.get(x));
  function buildNeighbors() {
    neighbors.clear();
    for (const l of links) {
      // resolved by hand rather than through linkGone: before the simulation runs, an end is
      // still an id, and asking a string for its kind hides every edge on the page
      const a = endOf(l.source), b = endOf(l.target);
      if (!a || !b) continue;
      // a relation with no state yet is shown, the same as when the states are first filled in
      if ((display.link[l.rel] || 'show') !== 'show' || srcGone(l) || linkP2PGone(l)
          || gone(a) || gone(b)) continue;
      if (!neighbors.has(a.id)) neighbors.set(a.id, new Set());
      if (!neighbors.has(b.id)) neighbors.set(b.id, new Set());
      neighbors.get(a.id).add(b.id); neighbors.get(b.id).add(a.id);
    }
  }
  buildNeighbors();
  const NONE = new Set();
  const relCount = new Map();
  links.forEach(l => relCount.set(l.rel, (relCount.get(l.rel) || 0) + 1));
  const RELS = [...relCount.keys()].sort((a, b) => relCount.get(b) - relCount.get(a) || a.localeCompare(b));
  // A verb in the caller's words where it has one: `incorporates_by_reference` is the
  // edge a reader most needs and the one they are least likely to know.
  const relText = r => (DATA.relWords || {})[r] || String(r).replace(/_/g, ' ');
  const degree = id => (neighbors.get(id) || NONE).size;
  // a topic only one person named once is background texture: no label until you look closer
  const minor = n => n.kind === 'topic' && degree(n.id) < 2 && (n.mentions || 1) < 2;
  // people are the point of the page, so they are drawn last and sit on top
  const PAINT = { topic: 0, place: 1, org: 2, opportunity: 3, person: 4 };
  const paintRank = k => (k in PAINT ? PAINT[k] : PAINT.org);
  nodes.sort((a, b) => PAINT[a.kind] - PAINT[b.kind]);
  const shown = n => (n.attrs && n.attrs.handle ? '@' : '') + n.label;
  const labelText = n => { const s = shown(n); return s.length > 26 ? s.slice(0, 24) + '…' : s; };
  M.found = null;
  const NEAR_MAX = 12;
  function search() {
    if (!M.query) { M.found = null; return; }
    const direct = new Set();
    for (const n of nodes) {
      if (gone(n)) continue;
      // "Canada" should find the member who wrote "Ontario": what the gazetteer called the
      // place is searched alongside what they typed
      const where = (DATA.geo || {})[n.kind === 'place' ? n.label : (n.attrs.location || '')] || '';
      const hit = n.label.toLowerCase().includes(M.query)
        || where.toLowerCase().includes(M.query)
        || Object.values(n.attrs).some(v => String(v).toLowerCase().includes(M.query))
        || (n.messages || []).some(mid => ((G.messages[mid] || {}).text || '').toLowerCase().includes(M.query));
      if (hit) direct.add(n.id);
    }
    // Typing the name of a thing should find that thing. Every other rule here is a guess
    // about what you might have meant — the word appearing in somebody's message, an
    // attribute holding it, a member the affinity thinks is similar — and a guess has no
    // business outvoting a name you typed exactly. Searching a topic used to return it, the
    // three people who had ever written the word, and twelve more it reminded us of.
    const exact = [...direct].filter(id => (byId.get(id) || {}).label.toLowerCase() === M.query);
    if (exact.length) {
      M.found = { direct: new Set(exact), near: new Set() };
      return;
    }
    // a node several hits agree on is closer to the question than one only a single hit reaches
    const votes = new Map();
    direct.forEach(id => ((DATA.near || {})[id] || []).forEach(other => {
      const n = byId.get(other);
      if (n && !gone(n) && !direct.has(other)) votes.set(other, (votes.get(other) || 0) + 1);
    }));
    const near = new Set([...votes.entries()]
      .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
      .slice(0, NEAR_MAX).map(([id]) => id));
    M.found = { direct, near };
  }
  const nothingFound = () => !!M.found && !M.found.direct.size && !M.found.near.size;
  function matches(n) {
    if (gone(n)) return false;
    if (M.answer) return M.answer.has(n.id);
    // fading every node to nothing looks like a broken page; a search with no hits leaves
    // the graph as it was and says so
    if (!M.found || nothingFound()) return true;
    return M.found.direct.has(n.id) || M.found.near.has(n.id);
  }
  // The kind most of a set is, for restricting a walk that joins all of them at once.
  function mainKind(wanted) {
    const tally = new Map();
    for (const id of wanted) {
      const k = (byId.get(id) || {}).kind;
      if (k) tally.set(k, (tally.get(k) || 0) + 1);
    }
    let best = null, most = 0;
    for (const [k, n] of tally) if (n > most) { most = n; best = k; }
    return best ? new Set([best]) : null;
  }
  function throughable(a, b) {
    if (!view.likewise) return null;
    const ka = (byId.get(a) || {}).kind, kb = (byId.get(b) || {}).kind;
    return ka && ka === kb ? new Set([ka]) : null;
  }
  const passable = (id, kinds, ends) =>
    !kinds || ends.has(id) || kinds.has((byId.get(id) || {}).kind);
  function nearestPath(from, targets, kinds = null) {
    const cost = new Map([...from].map(id => [id, 0]));
    const came = new Map();
    const queue = [...from];
    let best = null;
    while (queue.length) {
      queue.sort((a, b) => cost.get(a) - cost.get(b));
      const here = queue.shift();
      if (targets.has(here) && !from.has(here)) { best = here; break; }
      for (const l of links) {
        if (linkGone(l)) continue;
        const a = l.source.id, b = l.target.id;
        const other = a === here ? b : (b === here ? a : null);
        if (!other) continue;
        if (!passable(other, kinds, targets)) continue;
        const through = cost.get(here) + 1 / Math.max(1, l.weight || 1);
        if (through < (cost.has(other) ? cost.get(other) : Infinity)) {
          cost.set(other, through);
          came.set(other, [here, l]);
          queue.push(other);
        }
      }
    }
    if (best === null) return null;
    const walk = { nodes: [best], links: [] };
    let here = best;
    while (came.has(here)) {
      const [previous, edge] = came.get(here);
      walk.links.push(edge);
      walk.nodes.push(previous);
      here = previous;
    }
    return walk;
  }
  // What to join, in the order a person means it: the nodes shift-clicked, else the answer's
  // set, else whatever the filter has lit.
  function toJoin() {
    const shifted = [...picked].filter(k => k.startsWith('node:')).map(k => k.slice(5));
    if (shifted.length) return shifted;
    if (M.answer) return [...M.answer];
    if (M.found) return nodes.filter(n => matches(n)).map(n => n.id);
    return M.selected ? [M.selected] : [];
  }
  // The joining itself, so the button and an answer can both use it rather than each
  // growing its own copy of the walk.
  function joinUp(ids) {
    const wanted = new Set(ids.filter(id => byId.has(id)));
    const joined = new Set([...wanted].slice(0, 1));
    const onPath = new Set();
    let left = wanted.size - 1;
    // Like with like restricts what the walk may cross to the kind most of the ends are —
    // people, for a question about people — so two members are joined through other members
    // rather than through a subject they both happen to touch.
    const only = view.likewise ? mainKind(wanted) : null;
    for (let guard = 0; guard < wanted.size + 4 && left > 0; guard++) {
      const walk = nearestPath(joined, wanted, only);
      if (!walk) break;
      walk.nodes.forEach(id => joined.add(id));
      walk.links.forEach(l => onPath.add(l));
      left = [...wanted].filter(id => !joined.has(id)).length;
    }
    // The other ways round are worth *saying* — they are how else two people could be put in
    // touch — but not worth lighting. Measured on "who knows robotics": the answer was two
    // people and a subject, and drawing every alternative route between every pair of them
    // lit two more people, an org and two topics the question never mentioned. Everything
    // is connected to everything a few hops out; the highlight is what the answer is about,
    // plus the one walk that shows they are joined at all.
    left = [...wanted].filter(id => !joined.has(id)).length;
    return { wanted, joined, onPath, unreachable: left };
  }
  function routeThrough(wanted) {
    const ends = [...wanted].filter(id => byId.has(id));
    let best = [];
    for (let i = 0; i < ends.length; i++) {
      for (let j = i + 1; j < ends.length; j++) {
        const walk = hopsBetween(ends[i], ends[j], null, throughable(ends[i], ends[j]));
        if (walk && walk.length > best.length) best = walk;
      }
    }
    return best;
  }
  function legBetween(a, b) {
    for (const l of links) {
      if (linkGone(l)) continue;
      if (l.source.id === a && l.target.id === b) return { l, flip: false };
      if (l.source.id === b && l.target.id === a) return { l, flip: true };
    }
    return null;
  }
  const words = t => ' ' + String(t).toLowerCase()
    .replace(/[^\p{L}\p{N}]+/gu, ' ').replace(/\s+/g, ' ').trim() + ' ';
  function namedIn(said) {
    const text = words(said);
    return nodes.filter(n => {
      const label = words(n.label);
      // a label that normalises to nothing would match the gap between any two words
      return label.length > 2 && n.label.length >= 3 && !gone(n) && text.includes(label);
    });
  }
  function hopsBetween(a, b, without = null, kinds = null) {
    if (a === b) return [a];
    const ends = new Set([a, b]);
    const came = new Map([[a, null]]);
    let edge = [a];
    while (edge.length) {
      const next = [];
      for (const here of edge) {
        for (const l of links) {
          if (linkGone(l) || (without && without.has(l))) continue;
          const ends2 = [l.source.id, l.target.id];
          const other = ends2[0] === here ? ends2[1] : (ends2[1] === here ? ends2[0] : null);
          if (other === null || came.has(other)) continue;
          if (!passable(other, kinds, ends)) continue;
          came.set(other, here);
          if (other === b) {
            const walk = [b];
            while (came.get(walk[0]) !== null) walk.unshift(came.get(walk[0]));
            return walk;
          }
          next.push(other);
        }
      }
      edge = next;
    }
    return null;
  }
  // Up to three ways round between two entries, shortest first. One route is a fact; three
  // is a shape — whether they are joined through one person who could introduce them, or
  // through half the community whichever way you go.
  const ROUTES = 3;
  function routesBetween(a, b, most = ROUTES, kinds = null) {
    const routes = [], banned = new Set();
    for (let i = 0; i < most; i++) {
      const walk = hopsBetween(a, b, banned.size ? banned : null, kinds);
      if (!walk || walk.length < 2) break;
      routes.push(walk);
      // ban one link of this route — the middle one, so the next way round differs where it
      // matters rather than only at an end both routes must share anyway
      const legs = [];
      for (let j = 0; j < walk.length - 1; j++) {
        const seg = legBetween(walk[j], walk[j + 1]);
        if (seg) legs.push(seg.l);
      }
      if (!legs.length) break;
      banned.add(legs[Math.floor(legs.length / 2)]);
    }
    return routes;
  }
  const nameOf = id => (byId.get(id) || {}).label || id;
  const listOut = xs => xs.length < 2 ? (xs[0] || '')
    : xs.slice(0, -1).join(', ') + ' and ' + xs[xs.length - 1];
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const when = ts => new Date(+ts * 1000).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  function modelName(file) {
    return String(file).replace(/\.(gguf|safetensors|bin)$/i, '')
      .replace(/-\d{5}-of-\d{5}$/i, '')
      .replace(/[-_.](mxfp4|q\d[_a-z0-9]*|iq\d[_a-z0-9]*|ud|bf16|f16|f32|fp16|moe)$/gi, '')
      .replace(/[-_.](mxfp4|q\d[_a-z0-9]*|iq\d[_a-z0-9]*|ud|bf16|f16|f32|fp16|moe)$/gi, '')
      .replace(/[-_.]+$/, '');
  }
  const tipEl = document.getElementById('tip');
  function tip(e, a, b) { tipEl.innerHTML = `<div>${a}</div><div class="sub">${b || ''}</div>`; tipEl.style.left = (e.clientX + 12) + 'px'; tipEl.style.top = (e.clientY + 12) + 'px'; tipEl.classList.add('on'); }
  function hideTip() { tipEl.classList.remove('on'); }
  const local = /^(127\.0\.0\.1|localhost)$/.test(location.hostname);
  const emit = (name, detail) => document.dispatchEvent(new CustomEvent('graph:' + name, { detail }));
  const on = (name, fn) => document.addEventListener('graph:' + name, e => fn(e.detail));
  Object.assign(M, { DATA, WORLD, G, SHAPES, KINDS, kindOf, kindFor, COPY, ASIDE, kindById, p2pCount, colourOf, color, swatch, STATES, display, view, picked, served, colors, bothPeople, linkP2PGone, linkP2PDropped, srcGone, srcDropped, gone, dropped, linkGone, linkDropped, paint, saveDisplay, stats, counted, nodes, byId, links, neighbors, endOf, buildNeighbors, NONE, relCount, RELS, relText, degree, minor, PAINT, paintRank, shown, labelText, NEAR_MAX, search, nothingFound, matches, mainKind, throughable, passable, nearestPath, toJoin, joinUp, routeThrough, legBetween, words, namedIn, hopsBetween, ROUTES, routesBetween, nameOf, listOut, esc, when, modelName, tip, hideTip, local, emit, on });
  // a component left off the page leaves its hooks as no-ops, so the rest still works
  const noop = () => {};
  for (const name of ['paintCounts', 'setCount', 'openAnswers', 'face', 'draftable', 'refresh', 'layoutLabels', 'measure', 'fit', 'applyRemoval', 'arrange', 'recenter', 'raiseSelected', 'select', 'bringIntoView', 'stopSignal', 'runSignal', 'findPaths', 'applyPhysics', 'resized', 'setSplit', 'setMapHeight', 'setView', 'setSpin', 'flyTo', 'push3d', 'mark3dPicked', 'cssVar', 'init3d', 'stopHistory', 'playHistory', 'paintGlow', 'renderDetail', 'renderFound', 'selectEdge', 'showAnswerAgain', 'pick', 'clearPicks', 'renderPicked']) M[name] = noop;
  M.glow = new Map(); M.key3d = () => ''; M.askedText = () => ''; M.searchText = () => '';
})();
</script>
