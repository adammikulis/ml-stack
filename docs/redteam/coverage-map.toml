# Which red-team test covers each surface `scripts/redteam_coverage.py` finds.
#
# A surface id is `kind:name`. A group matches ids with fnmatch patterns and the first group
# that matches wins, so exact rows go above the globs. `count` pins how many surfaces the
# patterns match: the gate fails when it moves, so a new surface under a glob is looked at.
#
# status   covered    a test feeds hostile input to the real component and checks the outcome
#          partial    some of the hostile inputs are tested; the note says which are not
#          uncovered  no test attacks it; the note says what the attacker wants there
#          n/a        nothing untrusted reaches it; the note says why
# tests    `path` or `path::test_name`; the gate fails when either is gone.

[ratchet]
uncovered = 54
partial = 201

