[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mainspring-contracts"
version = "0.1.0"
description = "Shared contract data (model tiers, sampler schema, grammars) and its reader. Device tier: stdlib only."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/mainspring"]

# The contracts are ONE file on disk (repo-root `contracts/`), pulled into the wheel at
# build time. No copy is kept in the source tree, so there is nothing to drift.
[tool.hatch.build.targets.wheel.force-include]
"../../contracts" = "mainspring/contracts/_data"
