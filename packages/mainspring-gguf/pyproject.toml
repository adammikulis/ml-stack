[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mainspring-gguf"
version = "0.1.0"
description = "GGUF conversion, quantisation and tokenizer-metadata repair. Host tier."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["gguf>=0.10", "numpy>=1.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/mainspring"]
