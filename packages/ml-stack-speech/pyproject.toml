[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-stack-speech"
version = "0.1.6"  # x-release-please-version
description = "ASR, TTS and VAD behind three protocols and one resolver. "
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "a member" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["ml-stack-media"]

[project.urls]
Homepage = "https://github.com/adammikulis/ml-stack"
Repository = "https://github.com/adammikulis/ml-stack"
Changelog = "https://github.com/adammikulis/ml-stack/blob/main/CHANGELOG.md"

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
transformers = ["transformers>=4.40", "torch>=2.2"]
kokoro = ["kokoro-onnx>=0.3", "numpy>=1.24"]
piper = ["piper-tts>=1.2"]
silero = ["torch>=2.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/ml_stack"]
