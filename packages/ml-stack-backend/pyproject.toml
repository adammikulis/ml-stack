[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-stack-backend"
version = "0.1.5"  # x-release-please-version
description = "One array API over MLX and PyTorch, so model math is written once. "
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
torch = ["torch>=2.2"]
mlx = ["mlx>=0.20"]

[tool.hatch.build.targets.wheel]
packages = ["src/ml_stack"]
