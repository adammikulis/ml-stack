[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-stack-gguf"
version = "0.1.5"  # x-release-please-version
description = "GGUF conversion, quantisation and tokenizer-metadata repair. "
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "a member" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["gguf>=0.10", "numpy>=1.24"]

# verify_tokenizer_fidelity() serves the model and compares its /tokenize
# against a reference tokenizer, so it needs these. Optional rather than
# required because the metadata half (verify_metadata) is the common case and
# needs neither -- but a bare `pip install ml-stack-gguf` otherwise gives you a
# function that raises ImportError on its default path.

[project.urls]
Homepage = "https://github.com/adammikulis/ml-stack"
Repository = "https://github.com/adammikulis/ml-stack"
Changelog = "https://github.com/adammikulis/ml-stack/blob/main/CHANGELOG.md"
[project.optional-dependencies]
verify = ["ml-stack-serve", "ml-stack-client"]

[tool.hatch.build.targets.wheel]
packages = ["src/ml_stack"]
