[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-stack-gguf"
version = "0.1.0"
description = "GGUF conversion, quantisation and tokenizer-metadata repair. Host tier."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["gguf>=0.10", "numpy>=1.24"]

# verify_tokenizer_fidelity() serves the model and compares its /tokenize
# against a reference tokenizer, so it needs these. Optional rather than
# required because the metadata half (verify_metadata) is the common case and
# needs neither -- but a bare `pip install ml-stack-gguf` otherwise gives you a
# function that raises ImportError on its default path.
[project.optional-dependencies]
verify = ["ml-stack-serve", "ml-stack-client"]

[tool.hatch.build.targets.wheel]
packages = ["src/ml_stack"]
