[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-stack-train"
version = "0.1.6"  # x-release-please-version
description = "Training scaffolding: atomic checkpoints, schedules, guards, metrics, leak-safe splits. "
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "a member" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["ml-stack-backend", "ml-stack-fleet", "ml-stack-contracts", "numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/adammikulis/ml-stack"
Repository = "https://github.com/adammikulis/ml-stack"
Changelog = "https://github.com/adammikulis/ml-stack/blob/main/CHANGELOG.md"

[project.scripts]
ml-stack-train-run = "ml_stack.train.run:main"

[project.optional-dependencies]
# Temperature, clocks and throttle state on Apple silicon, without sudo. Optional:
# a box without it advertises less rather than failing to advertise.
telemetry = ["darwin-perf>=0.1; sys_platform == 'darwin'"]

# Registers the accelerator probe with ml-stack-fleet, which is device tier and so cannot
# import a framework to ask about CUDA itself. See ml_stack.train.accelerator.
[project.entry-points."ml_stack.device_report"]
accelerator = "ml_stack.train.accelerator:report"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_stack"]
