[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-stack-fleet"
version = "0.1.0"
description = "Find the other machines on the LAN and run work on them. Device tier."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
ml-stack-traind = "ml_stack.fleet.daemon:main"
ml-stack-peers = "ml_stack.fleet.peers:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_stack"]
