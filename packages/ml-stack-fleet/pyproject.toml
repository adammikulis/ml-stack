[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-stack-fleet"
version = "0.1.6"  # x-release-please-version
description = "Find the other machines on the LAN and run work on them. "
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "a member" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Homepage = "https://github.com/adammikulis/ml-stack"
Repository = "https://github.com/adammikulis/ml-stack"
Changelog = "https://github.com/adammikulis/ml-stack/blob/main/CHANGELOG.md"

[project.optional-dependencies]
app = ["pywebview>=5.0"]

[project.scripts]
# The one people double-click: starts the daemon and opens the browser on it.
ml-stack = "ml_stack.fleet.launch:main"
ml-stack-app = "ml_stack.fleet.app:main"
ml-stack-traind = "ml_stack.fleet.daemon:main"
ml-stack-peers = "ml_stack.fleet.peers:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_stack"]
