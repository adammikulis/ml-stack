[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mainspring-train"
version = "0.1.0"
description = "Training scaffolding: atomic checkpoints, schedules, guards, metrics, leak-safe splits. Lab tier."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["mainspring-backend"]

[project.scripts]
mainspring-traind = "mainspring.train.daemon:main"
mainspring-peers = "mainspring.train.peers:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mainspring"]
