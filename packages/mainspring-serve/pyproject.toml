[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mainspring-serve"
version = "0.1.0"
description = "Start, adopt and tear down local model servers. Host tier."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["mainspring-client", "psutil>=5.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/mainspring"]
