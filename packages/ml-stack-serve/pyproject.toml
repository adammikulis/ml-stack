[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-stack-serve"
version = "0.1.4"  # x-release-please-version
description = "Start, adopt and tear down local model servers. "
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["ml-stack-client", "psutil>=5.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/ml_stack"]
