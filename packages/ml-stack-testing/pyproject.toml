[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-stack-testing"
version = "0.1.1"
description = "Cross-backend numerical parity harness for MLX and PyTorch. "
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24", "pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/ml_stack"]
