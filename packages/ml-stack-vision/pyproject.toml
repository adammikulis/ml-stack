[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-stack-vision"
version = "0.1.6"  # x-release-please-version
description = "Vision-language payloads and a gate that verifies the model can see. "
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Adam Mikulis" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["ml-stack-media", "ml-stack-client", "numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/adammikulis/ml-stack"
Repository = "https://github.com/adammikulis/ml-stack"
Changelog = "https://github.com/adammikulis/ml-stack/blob/main/CHANGELOG.md"

[project.optional-dependencies]
resize = ["pillow>=10.0"]
heic = ["pillow>=10.0", "pillow-heif>=0.13"]

[tool.hatch.build.targets.wheel]
packages = ["src/ml_stack"]
