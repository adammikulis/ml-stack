[package]
name = "ml-stack-app"
version = "0.1.8"  # x-release-please-version
description = "A native window on the ml-stack interface."
edition = "2021"
rust-version = "1.82"
publish = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-shell = "=2.3.6"
tauri-plugin-window-state = "=2.4.1"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
