[package]
name = "poolhouse-node"
version = "0.2.2"  # x-release-please-version
description = "The node: the board's signed entries, identity, and the local API of one device."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "poolhouse_node"
path = "src/lib.rs"

[[bin]]
name = "poolhouse-node"
path = "src/main.rs"

[dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["std", "pkcs8"] }
getrandom = "=0.3.4"
hmac = "0.12.1"
rcgen = { version = "0.14.7", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
socket2 = { version = "0.6.5", features = ["all"] }
spake2 = "0.4.0"
x509-parser = "0.18.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
proptest = "1"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3"
