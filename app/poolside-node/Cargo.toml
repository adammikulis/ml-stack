[package]
name = "poolside-node"
version = "0.2.2"  # x-release-please-version
description = "The node: the board's signed entries, identity, and the local API of one device."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "poolside_node"
path = "src/lib.rs"

[[bin]]
name = "poolside-node"
path = "src/main.rs"

[dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
getrandom = "=0.3.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"

[dev-dependencies]
proptest = "1"
tempfile = "3"
