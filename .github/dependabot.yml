version: 2
updates:
  - package-ecosystem: pip
    directory: /
    target-branch: 0.2dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /app
    target-branch: 0.2dev
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /app/src-tauri
    target-branch: 0.2dev
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    target-branch: 0.2dev
    schedule:
      interval: weekly
