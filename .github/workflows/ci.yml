name: ci
on:
  push:
    branches: [main, "*dev"]
    paths-ignore: ["**.md", "docs/**"]
  # No path filter: a required check that never starts leaves a documentation-only
  # pull request unmergeable.
  pull_request:
  workflow_dispatch:
    inputs:
      macos-pytest:
        description: what the macOS job hands pytest
        type: string
        required: false
        default: tests/ -q --slow
  # 04:30 UTC: the macOS job, which nothing else starts.
  schedule:
    - cron: "30 4 * * *"

permissions:
  contents: read

# A newer push makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The `mcp` extra (mcp 2.3 or later, MCP revision 2026-07-28) is installed on every OS below;
  # the agent and ml-stack-mcp tests start real MCP servers with it.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.13"
            pytest: --slow
          # -n scatters a file across workers, so a test that only passes beside its
          # neighbours passes there and fails alone. This is the run that sees that.
          - os: ubuntu-latest
            python: "3.13"
            pytest: -n 0
          - os: ubuntu-latest
            python: "3.12"
            pytest: --slow
          - os: ubuntu-latest
            python: "3.14"
            pytest: --slow
          # a pre-release: a red here is reported and does not fail the run
          - os: ubuntu-latest
            python: "3.15"
            pytest: --slow
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: ${{ matrix.experimental || false }}

      # A pre-release Python is ahead of the wheels some dependencies publish (ladybug had
      # none for 3.15). The experimental job then says so and stops; every other job must install.
      - name: every dependency has a build for this Python
        id: ready
        run: |
          if python -m pip install --upgrade pip && python -m pip install --dry-run -e ".[test,store,hub,web,plot,privacy,guardrails,mcp,memory,fleet-onboard,pdf,fleet-update]" > "$RUNNER_TEMP/dry.txt" 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.experimental }}" = "true" ]; then
            tail -5 "$RUNNER_TEMP/dry.txt"
            echo "::notice::ml-stack cannot be installed on Python ${{ matrix.python }} yet; the experimental run stops here"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/dry.txt"
            exit 1
          fi

      - name: install test dependencies
        if: steps.ready.outputs.ok == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap rustc cargo
          python -m pip install --upgrade pip build
          python -m pip install pytest pytest-xdist pyyaml numpy psutil pillow networkx gguf safetensors
          # the store, the Hub client and the page reader: 150 tests build a real store,
          # and a title read without trafilatura is a different title
          python -m pip install -e ".[test,store,hub,web,plot,privacy,guardrails,mcp,memory,fleet-onboard,pdf,fleet-update]"
          python -m spacy download en_core_web_sm
          # CPU torch: 28 tests across backend, graph and recipes need a framework,
          # and without one they fail rather than skip.
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      # ml-stack's own packages are on no index. Without them the environment test
      # can build a venv, install torch, and still not import ml_stack.
      - name: build the wheels the environment test installs
        if: steps.ready.outputs.ok == 'true'
        run: python packaging/build.py

      - name: tests
        if: steps.ready.outputs.ok == 'true'
        run: python -m pytest tests/ -q -rfE --tb=short --durations=25 ${{ matrix.pytest }}

      # docs/FEATURES.md points at this as the proof each feature holds, and nothing else
      # runs it. --offline leaves out the three checks that reach a host off this machine.
      - name: every claim in FEATURES.md
        if: matrix.pytest == '--slow' && steps.ready.outputs.ok == 'true'
        run: python docs/verify_release.py --offline

  # Nightly, on demand, and on the release branch that ships the macOS app. A run takes
  # about three quarters of an hour, longer than the gap between two pushes.
  macos:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # ladybug's macOS wheels are tagged macosx_15_0; on an older runner pip falls back to
    # the sdist and compiles the graph database from source.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: install test dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install pytest pytest-xdist pyyaml numpy psutil pillow networkx gguf safetensors
          python -m pip install -e ".[test,store,hub,web,plot,privacy,guardrails,mcp,memory,fleet-onboard,pdf,fleet-update]"
          python -m spacy download en_core_web_sm
          # The CPU index carries no macOS arm64 wheel; the default one is CPU-only here.
          python -m pip install torch

      - name: build the wheels the environment test installs
        run: python packaging/build.py

      - name: tests
        run: |
          read -ra args <<< "$MACOS_PYTEST"
          python -m pytest "${args[@]}" --durations=40
        env:
          MACOS_PYTEST: ${{ inputs.macos-pytest || 'tests/ -q --slow' }}

      - name: what was still running
        if: always()
        run: |
          pids=$(pgrep -d, -if 'python|llama') && ps -o pid,ppid,rss,etime,command -p "$pids" || true
          vm_stat

  # Runs install.ps1 -Headless end to end: a virtualenv under a scratch prefix, the console
  # scripts on its own PATH, no network and no model, mirroring what
  # tests/test_packaging_install_runs.py does for install.sh on Linux and macOS.
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: build the wheel install.ps1 installs
        run: |
          python -m pip install --upgrade pip build
          python packaging/build.py

      # The node (app/poolside-node) is native on Windows: its local API is a named pipe limited to
      # the current user, its leases know a process by handle and creation time, its files are
      # owner-only by ACL. The crate's own tests run here, then the launcher starts the real
      # binary under its supervisor and stops it by the stop events (tests/test_node_windows.py).
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: crate tests of poolside-node
        shell: pwsh
        working-directory: app
        run: cargo test --locked -p poolside-node
      - name: the node starts under its supervisor and stops on its event
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install pytest pytest-xdist numpy psutil keyring cryptography pyyaml
          $env:PYTHONPATH = "src"
          python -m pytest tests/test_node_windows.py -q -n 0 -p no:cacheprovider
          if ($LASTEXITCODE -ne 0) { throw "the Windows node tests failed" }

      - name: install.ps1 -Headless against a scratch prefix
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $wheel = Get-ChildItem dist\ml_stack-*.whl | Select-Object -First 1
          if (-not $wheel) { throw "packaging/build.py left no wheel in dist/" }
          $env:ML_STACK_PREFIX = Join-Path $pwd "scratch"
          $env:ML_STACK_MODELS = "none"
          $env:ML_STACK_OFFLINE_ZIP = $wheel.FullName
          & .\packaging\install.ps1 -Headless

      - name: the venv it left behind runs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $py = Join-Path $pwd "scratch\venv\Scripts\python.exe"
          if (-not (Test-Path $py)) { throw "no virtualenv where ML_STACK_PREFIX said: $py" }
          & $py -c "from ml_stack.fleet import updates; print(updates.state()['version'])"
          if ($LASTEXITCODE -ne 0) { throw "the installed machine could not import ml_stack" }

      - name: install.ps1 -Headless -Uninstall takes the venv away
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:ML_STACK_PREFIX = Join-Path $pwd "scratch"
          $env:ML_STACK_MODELS = "none"
          $env:ML_STACK_OFFLINE_ZIP = (Get-ChildItem dist\ml_stack-*.whl | Select-Object -First 1).FullName
          & .\packaging\install.ps1 -Headless -Uninstall
          $venv = Join-Path $env:ML_STACK_PREFIX "venv"
          if (Test-Path $venv) { throw "the venv survived -Uninstall: $venv" }

  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      # On a pull request the checker code and the hooks come from the base commit; the
      # data beside them (pinned.txt, survivors.txt, budgets.json) is the pull request's own,
      # so a change to a checker lands before the numbers it moves.
      - name: the base commit's checkers
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted

      # The checkers are stdlib only apart from the two they shell out to, and those two
      # come from scripts/gates/pinned.txt: each ruff and pyright release finds sites the
      # last one did not, so an unpinned install scores the same tree differently here and
      # on a laptop. pytest-xdist is here because pyproject's addopts pass -n auto to every
      # pytest run, and numpy because tests/conftest.py imports ml_stack.graph.topology at
      # collection, and psutil, keyring and cryptography because it imports those too.
      - name: install pytest, and the pinned ruff and pyright
        run: |
          python -m pip install pytest pytest-xdist numpy psutil keyring cryptography
          python -m pip install -r scripts/gates/pinned.txt

      # The same check scripts/test runs first: a missing package fails here with its install line.
      - name: preflight
        run: python scripts/preflight gate

      - name: gate tests
        run: |
          files=()
          for f in tests/test_budgets.py tests/test_wiring.py tests/test_layers.py; do
            [ -f "$f" ] && files+=("$f")
          done
          python -m pytest "${files[@]}" -q

      - name: the base commit's gate over this tree
        if: github.event_name == 'pull_request'
        run: |
          rm -rf scripts/hooks scripts/budgets scripts/gates/*.py
          cp -R trusted/scripts/hooks scripts/
          cp trusted/scripts/gates/*.py scripts/gates/
          cp trusted/scripts/budgets scripts/budgets

      - name: budgets
        run: python scripts/budgets

      # The pre-commit hook that refuses a raised number is opt-in; this is the same
      # check on the branch, and it needs no install.
      - name: budgets.json only falls
        if: github.event_name == 'pull_request'
        run: python scripts/hooks/budgets-only-fall --against "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}

      - name: no guard test weakened without a second reviewer
        if: github.event_name == 'pull_request'
        run: |
          # The base commit's hooks are in place; the first pull request that adds the check has none to run.
          [ -f scripts/hooks/weakened-assertions ] || { echo "the base commit has no weakened-assertions check"; exit 0; }
          python scripts/hooks/weakened-assertions --against "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}

  # scripts/hooks/no-real-names and commit-msg, over a pushed range rather than a commit
  # being made, on a machine that always has the [privacy] extra.
  privacy:
    runs-on: ubuntu-latest
    # A promotion pull request carries a release's worth of files (2000 in 0.2.3) and the
    # recogniser reads each; 10 minutes cancelled it.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: the base commit's hooks
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted

      - name: install the name gate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[privacy]"
          python -m spacy download en_core_web_sm

      # A pull request compares against its base; a push (and any other trigger, which
      # carries neither) against the commit before it, or HEAD itself on a first commit.
      - name: find the base of this push or pull request
        id: base
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          [ -z "$BASE" ] && BASE="${{ github.event.before }}"
          case "$BASE" in
            ""|0000000000000000000000000000000000000000)
              BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)" ;;
          esac
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"

      - name: the base commit's hooks over this tree
        if: github.event_name == 'pull_request'
        run: |
          rm -rf scripts/hooks
          cp -R trusted/scripts/hooks scripts/

      - name: no name in the files this range changed
        run: scripts/hooks/no-real-names --against "${{ steps.base.outputs.sha }}"

      - name: no name in the commit messages this range adds
        run: |
          for sha in $(git rev-list "${{ steps.base.outputs.sha }}..HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/commit-msg.txt"
            scripts/hooks/commit-msg "$RUNNER_TEMP/commit-msg.txt"
          done

  # scripts/notices.py --check over the packages a bundle ships: fails on a GPL, AGPL, LGPL or
  # unknown licence. THIRD_PARTY_NOTICES.md is regenerated with `python scripts/notices.py`.
  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install ".[store,hub,web,plot,graph]"
      - run: python scripts/notices.py --check
