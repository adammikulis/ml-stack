name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The tier check runs FIRST and on bare Python. A device package that has grown a
      # dependency must fail here, before any install could paper over it.
      - name: tier isolation
        run: python scripts/check_tiers.py --live

      - name: tests
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest tests/ -q
