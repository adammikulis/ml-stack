name: ci
on:
  push:
    branches: [main, "*dev"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
  # 04:30 UTC: the macOS job, which nothing else starts.
  schedule:
    - cron: "30 4 * * *"
  # release-please opens its pull request with the action's own token, so a run on that
  # pull request waits for approval. release-please.yml calls this instead.
  workflow_call:
    inputs:
      ref:
        description: what to check out; the caller's own ref when empty
        type: string
        required: false
        default: ""

# A newer push makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.13"
            pytest: --slow
          # -n scatters a file across workers, so a test that only passes beside its
          # neighbours passes there and fails alone. This is the run that sees that.
          - os: ubuntu-latest
            python: "3.13"
            pytest: -n 0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install test dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install pytest pytest-xdist pyyaml numpy psutil pillow networkx gguf safetensors
          # the store, the Hub client and the page reader: 150 tests build a real store,
          # and a title read without trafilatura is a different title
          python -m pip install -e ".[store,hub,web,plot,privacy]"
          python -m spacy download en_core_web_sm
          # CPU torch: 28 tests across backend, graph and recipes need a framework,
          # and without one they fail rather than skip.
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      # ml-stack's own packages are on no index. Without them the environment test
      # can build a venv, install torch, and still not import ml_stack.
      - name: build the wheels the environment test installs
        run: python packaging/build.py

      - name: tests
        run: python -m pytest tests/ -q ${{ matrix.pytest }}

      # docs/FEATURES.md points at this as the proof each feature holds, and nothing else
      # runs it. --offline leaves out the three checks that reach a host off this machine.
      - name: every claim in FEATURES.md
        if: matrix.pytest == '--slow'
        run: python docs/verify_release.py --offline

  # Nightly, on demand, and on the release branch that ships the macOS app. A run takes
  # about three quarters of an hour, longer than the gap between two pushes.
  macos:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.ref != ''
    # ladybug's macOS wheels are tagged macosx_15_0; on an older runner pip falls back to
    # the sdist and compiles the graph database from source.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install test dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install pytest pytest-xdist pyyaml numpy psutil pillow networkx gguf safetensors
          python -m pip install -e ".[store,hub,web,plot,privacy]"
          python -m spacy download en_core_web_sm
          # The CPU index carries no macOS arm64 wheel; the default one is CPU-only here.
          python -m pip install torch

      - name: build the wheels the environment test installs
        run: python packaging/build.py

      - name: tests
        run: python -m pytest tests/ -q --slow

  # Runs install.ps1 -Headless end to end: a virtualenv under a scratch prefix, the console
  # scripts on its own PATH, no network and no model, mirroring what
  # tests/test_packaging_install_runs.py does for install.sh on Linux and macOS.
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: build the wheel install.ps1 installs
        run: |
          python -m pip install --upgrade pip build
          python packaging/build.py

      - name: install.ps1 -Headless against a scratch prefix
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $wheel = Get-ChildItem dist\ml_stack-*.whl | Select-Object -First 1
          if (-not $wheel) { throw "packaging/build.py left no wheel in dist/" }
          $env:ML_STACK_PREFIX = Join-Path $pwd "scratch"
          $env:ML_STACK_MODELS = "none"
          $env:ML_STACK_OFFLINE_ZIP = $wheel.FullName
          & .\packaging\install.ps1 -Headless

      - name: the venv it left behind runs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $py = Join-Path $pwd "scratch\venv\Scripts\python.exe"
          if (-not (Test-Path $py)) { throw "no virtualenv where ML_STACK_PREFIX said: $py" }
          & $py -c "from ml_stack.fleet import updates; print(updates.state()['version'])"
          if ($LASTEXITCODE -ne 0) { throw "the installed machine could not import ml_stack" }

      - name: install.ps1 -Headless -Uninstall takes the venv away
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:ML_STACK_PREFIX = Join-Path $pwd "scratch"
          $env:ML_STACK_MODELS = "none"
          $env:ML_STACK_OFFLINE_ZIP = (Get-ChildItem dist\ml_stack-*.whl | Select-Object -First 1).FullName
          & .\packaging\install.ps1 -Headless -Uninstall
          $venv = Join-Path $env:ML_STACK_PREFIX "venv"
          if (Test-Path $venv) { throw "the venv survived -Uninstall: $venv" }

  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The checkers are stdlib only apart from the two they shell out to, and those two
      # come from scripts/gates/pinned.txt: each ruff and pyright release finds sites the
      # last one did not, so an unpinned install scores the same tree differently here and
      # on a laptop. pytest-xdist is here because pyproject's addopts pass -n auto to every
      # pytest run, and numpy because tests/conftest.py imports ml_stack.graph.topology at
      # collection.
      - name: install pytest, and the pinned ruff and pyright
        run: |
          python -m pip install pytest pytest-xdist numpy
          python -m pip install -r scripts/gates/pinned.txt

      - name: budgets
        run: python scripts/budgets

      # The pre-commit hook that refuses a raised number is opt-in; this is the same
      # check on the branch, and it needs no install.
      - name: budgets.json only falls
        if: github.event_name == 'pull_request'
        run: python scripts/hooks/budgets-only-fall --against "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}

      - name: gate tests
        run: |
          files=()
          for f in tests/test_budgets.py tests/test_wiring.py tests/test_layers.py; do
            [ -f "$f" ] && files+=("$f")
          done
          python -m pytest "${files[@]}" -q

  # scripts/hooks/no-real-names and commit-msg, over a pushed range rather than a commit
  # being made, on a machine that always has the [privacy] extra.
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install the name gate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[privacy]"
          python -m spacy download en_core_web_sm

      # A pull request compares against its base; a push (and any other trigger, which
      # carries neither) against the commit before it, or HEAD itself on a first commit.
      - name: find the base of this push or pull request
        id: base
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          [ -z "$BASE" ] && BASE="${{ github.event.before }}"
          case "$BASE" in
            ""|0000000000000000000000000000000000000000)
              BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)" ;;
          esac
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"

      - name: no name in the files this range changed
        run: scripts/hooks/no-real-names --against "${{ steps.base.outputs.sha }}"

      - name: no name in the commit messages this range adds
        run: |
          for sha in $(git rev-list "${{ steps.base.outputs.sha }}..HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/commit-msg.txt"
            scripts/hooks/commit-msg "$RUNNER_TEMP/commit-msg.txt"
          done
