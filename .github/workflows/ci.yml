name: ci
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "packaging/install.*"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "packaging/install.*"]
  workflow_dispatch:

# A newer push makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install test dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install pytest numpy psutil pillow networkx gguf safetensors
          # CPU torch: 28 tests across backend, graph and recipes need a framework,
          # and without one they fail rather than skip.
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: tests
        run: python -m pytest tests/ -q
