name: ci
on:
  push:
    branches: [main, "*dev"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

# A newer push makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The classifiers claim 3.11 through 3.13, and the app ships for macOS as well as
    # Linux. `packaging/install.sh` is executed on both by tests/test_packaging_install_runs.py.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          # ladybug's macOS wheels are tagged macosx_15_0; on an older runner pip
          # falls back to the sdist and compiles the graph database from source.
          - os: macos-15
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: install test dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install pytest pytest-xdist numpy psutil pillow networkx gguf safetensors
          # the store, the Hub client and the page reader: 150 tests build a real store,
          # and a title read without trafilatura is a different title
          python -m pip install -e ".[store,hub,web,plot]"
          # CPU torch: 28 tests across backend, graph and recipes need a framework,
          # and without one they fail rather than skip. The CPU index carries no macOS
          # arm64 wheel; there torch comes from the default index, CPU-only anyway.
          if [ "${{ runner.os }}" = Linux ]; then
            python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          else
            python -m pip install torch
          fi

      # ml-stack's own packages are on no index. Without them the environment test
      # can build a venv, install torch, and still not import ml_stack.
      - name: build the wheels the environment test installs
        run: python packaging/build.py

      - name: tests
        run: python -m pytest tests/ -q --slow

  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The checkers are stdlib only apart from the two they shell out to, and those two
      # come from scripts/gates/pinned.txt: each ruff and pyright release finds sites the
      # last one did not, so an unpinned install scores the same tree differently here and
      # on a laptop. pytest-xdist is here because pyproject's addopts pass -n auto to every
      # pytest run, and numpy because tests/conftest.py imports ml_stack.graph.topology at
      # collection.
      - name: install pytest, and the pinned ruff and pyright
        run: |
          python -m pip install pytest pytest-xdist numpy
          python -m pip install -r scripts/gates/pinned.txt

      - name: budgets
        run: python scripts/budgets

      # The pre-commit hook that refuses a raised number is opt-in; this is the same
      # check on the branch, and it needs no install.
      - name: budgets.json only falls
        if: github.event_name == 'pull_request'
        run: python scripts/hooks/budgets-only-fall --against "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}

      - name: gate tests
        run: |
          files=""
          for f in tests/test_budgets.py tests/test_wiring.py tests/test_layers.py; do
            [ -f "$f" ] && files="$files $f"
          done
          python -m pytest $files -q
