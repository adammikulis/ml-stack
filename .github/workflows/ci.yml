name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The tier check runs FIRST and on bare Python. A device package that has grown a
      # dependency must fail here, before any install could paper over it.
      - name: tier isolation
        run: python scripts/check_tiers.py --live

      # The suite imports numpy, psutil and Pillow at module scope, so without these the
      # test modules ERROR at collection rather than skipping -- which reads as a broken
      # run, not as reduced coverage. torch and mlx are deliberately absent: the tests
      # that need them are marked and skip cleanly, and a CPU torch wheel costs more
      # install time than the parity tests are worth on every push.
      - name: install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy psutil pillow networkx gguf

      - name: tests
        run: python -m pytest tests/ -q
