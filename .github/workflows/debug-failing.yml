name: debug-failing
on:
  pull_request:

permissions:
  contents: read

jobs:
  failing:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap rustc cargo
          python -m pip install --upgrade pip build
          python -m pip install pytest pytest-xdist pyyaml numpy psutil pillow networkx gguf safetensors
          python -m pip install -e ".[test,store,hub,web,plot,privacy,guardrails,mcp,memory,fleet-onboard,pdf,fleet-update]"
          python -m spacy download en_core_web_sm
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: build the wheels the environment test installs
        run: python packaging/build.py
      - name: the tests that failed on the last runs, alone
        continue-on-error: true
        run: >-
          python -m pytest -n 0 -q --slow -rA --tb=long -p no:cacheprovider
          tests/test_fleet_bind.py tests/test_fleet_job_recovery.py tests/test_mesh.py
          tests/test_packaging_install_runs.py tests/test_pdf_render.py tests/test_workspace_dev_cli.py
          tests/test_workspace_files.py tests/test_workspace_live.py tests/test_workspace_load.py
          tests/test_fleet_sdk_chat.py 2>&1 | tee failing.txt
      - name: what they said
        if: always()
        run: grep -nE "^(FAILED|ERROR)|passed|failed" failing.txt | cut -c1-300 || true
