name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*.whl
          retention-days: 7

  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            asset: ml-stack-macos-arm64
          - os: ubuntu-latest
            asset: ml-stack-linux-x86_64
          - os: windows-latest
            asset: ml-stack-windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python packaging/build.py --bundle

      # The bundle has to run on a machine with no Python and no source tree.
      # The window needs a display, so CI checks the headless binary instead: same
      # daemon, same interface, and it is the half that can be tested without one.
      - name: it starts and serves the interface
        shell: bash
        run: |
          BIN=$(find dist/bundle -maxdepth 3 -name 'ml-stack-headless*' -type f | head -1)
          echo "starting $BIN"
          "$BIN" --port 8899 --no-browser &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8899/health >/dev/null && break || sleep 1
          done
          curl -sf http://127.0.0.1:8899/health
          curl -sf -o /dev/null -w 'ui %{http_code}\n' http://127.0.0.1:8899/ui/
          curl -sf -o /dev/null http://127.0.0.1:8899/ui/static/app.js

      # The screens, not just the assets. ml_stack.serve is reached through a lazy
      # import, so nothing static points at it and only a running bundle says whether
      # PyInstaller carried it.
      - name: the screens answer
        shell: bash
        run: |
          U='X-ML-Stack-UI: 1'; J='Content-Type: application/json'
          B=http://127.0.0.1:8899
          curl -sf -H "$J" -H "$U" -X POST \
            -d '{"passphrase":"correct horse battery staple","group":"ci"}' \
            $B/ui/setup/join > /dev/null
          C=$(curl -s -D- -o /dev/null -H "$J" -H "$U" -X POST \
            -d '{"passphrase":"correct horse battery staple"}' \
            $B/ui/session | tr -d '\r' | awk 'tolower($1)=="set-cookie:"{print $2}' \
            | cut -d';' -f1)
          test -n "$C" || { echo "no session cookie"; exit 1; }
          for p in /ui/chat /ui/models /ui/serving /ui/conversations /ui/uninstall; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' -H "$U" -H "Cookie: $C" "$B$p")
            echo "$p -> $code $(head -c 120 /tmp/body)"
            test "$code" = "200" || { echo "$p did not answer"; exit 1; }
          done
          curl -s -H "$U" -H "Cookie: $C" $B/ui/serving | grep -q '"can_serve": true' \
            || { echo "the bundle cannot run a model: ml_stack.serve is missing"; exit 1; }

      # Python rather than zip(1): Windows runners have no zip in bash.
      - name: package it
        shell: bash
        run: python packaging/pack.py dist/bundle "dist/${{ matrix.asset }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.zip
          retention-days: 7

  publish:
    needs: [wheels, bundle]
    # Publishes whatever built. A platform whose runner was unavailable should
    # not hold back the ones that are ready.
    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 0
      - name: collect the network installers
        run: cp repo/packaging/install.sh repo/packaging/install.ps1 artifacts/

      - name: what to download
        id: downloads
        shell: bash
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          here() { find artifacts -name "$1" -type f -print -quit | grep -q .; }
          section() {
            here "$2" || return 0
            printf '\n%s\n- [%s](%s/%s)\n' "$1" "$2" "$base" "$2"
          }
          wheels=$(find artifacts -name '*.whl' -type f | wc -l | tr -d ' ')
          {
            echo "body<<DOWNLOADS_EOF"
            echo "## Download"
            section "**macOS** — Apple silicon (M1 or later)" ml-stack-macos-arm64.zip
            section "**Windows** — 64-bit" ml-stack-windows-x86_64.zip
            section "**Linux** — 64-bit" ml-stack-linux-x86_64.zip
            echo
            echo "Each holds the app and \`ml-stack-headless\`, for a machine with no screen. Unzip it and open it."
            if here install.sh && here install.ps1; then
              echo
              echo "**Or install from a terminal**, which picks the right one for you:"
              echo
              echo "- macOS and Linux: \`curl -fsSL $base/install.sh | sh\`"
              echo "- Windows: \`irm $base/install.ps1 | iex\`"
            fi
            if [ "$wheels" -gt 0 ]; then
              echo
              echo "**If you write Python**, the $wheels \`ml_stack_*.whl\` files under Assets are the packages: \`pip install ml-stack-fleet\` and the rest."
            fi
            echo "DOWNLOADS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: what changed
        id: notes
        working-directory: repo
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          before=$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)
          range="$tag"
          [ -n "$before" ] && range="$before..$tag"
          # A commit that touched nothing but prose or a version number changed
          # nothing a person downloading this can see.
          worth_saying() {
            local file
            while read -r file; do
              case "$file" in
                "") ;;
                *.md|docs/*) ;;
                packages/*/pyproject.toml|packaging/ml-stack-app.spec) ;;
                *) return 0 ;;
              esac
            done < <(git show --name-only --pretty=format: "$1")
            return 1
          }
          {
            echo "body<<CHANGELOG_EOF"
            echo
            echo "## What changed"
            echo
            for sha in $(git log --no-merges --reverse --pretty=format:'%H' "$range"); do
              worth_saying "$sha" && git show -s --pretty=format:'- %s' "$sha" && echo
            done
            if [ -n "$before" ]; then
              echo
              echo "**Every commit**: https://github.com/${GITHUB_REPOSITORY}/compare/$before...$tag"
            fi
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body: ${{ steps.downloads.outputs.body }}${{ steps.notes.outputs.body }}
