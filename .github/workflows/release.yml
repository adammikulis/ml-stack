name: release
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: the release to build and publish; empty builds and smokes without publishing
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ inputs.tag }}

  # The tag must name the checked-out commit, and that commit must be reachable from main.
  guard:
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: the tagged commit is on main
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          head=$(git rev-parse HEAD)
          tagged=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" || true)
          test "$tagged" = "$head" || { echo "tag $TAG is $tagged, not the checked-out $head"; exit 1; }
          git merge-base --is-ancestor "$head" origin/main \
            || { echo "$head is not an ancestor of main"; exit 1; }

  # Trusted publishing: the action mints an OIDC token from `id-token: write` and PyPI
  # matches it against the publisher registered for this workflow filename and the
  # `release` environment. A `password:` here would be used instead of the token and the
  # match would never be attempted.
  pypi:
    needs: [build, guard]
    if: >-
      !cancelled()
      && needs.build.outputs.wheels == 'success'
      && needs.guard.result == 'success'
      && (inputs.tag != '' || startsWith(github.ref, 'refs/tags/'))
      && vars.PYPI_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      id-token: write
    steps:
      - name: the signing key is set before anything is published
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: test -n "$RELEASE_SIGNING_KEY" || { echo "RELEASE_SIGNING_KEY is not set in the release environment"; exit 1; }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wheels
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  publish:
    needs: [build, guard, pypi]
    # A platform whose runner was unavailable should not hold back the ones that are
    # ready, so a skipped or cancelled bundle still publishes. A bundle that ran and
    # failed does not: that is a broken zip on the release page. A pypi job that failed
    # does not hold it back either; the notes then leave the pip line out.
    if: >-
      !cancelled()
      && needs.build.outputs.wheels == 'success'
      && needs.build.outputs.bundle != 'failure'
      && needs.guard.result == 'success'
      && (inputs.tag != '' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: repo
          fetch-depth: 0
      - name: leave the smoke screenshots out
        run: rm -rf artifacts/*-smoke
      - name: collect the network installers
        run: cp repo/packaging/install.sh repo/packaging/install.ps1 artifacts/

      - name: sign the downloads
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          test -n "$RELEASE_SIGNING_KEY" || { echo "RELEASE_SIGNING_KEY is not set"; exit 1; }
          key="$RUNNER_TEMP/release_key"
          (umask 077; printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key")
          find artifacts -name 'poolhouse-*.zip' -type f | while read -r zip; do
            ssh-keygen -Y sign -f "$key" -n poolhouse-release "$zip"
          done
          rm -f "$key"
          test -n "$(find artifacts -name 'poolhouse-*.zip.sig' -type f -print -quit)"

      - name: what to download
        id: downloads
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          PYPI: ${{ needs.pypi.result }}
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          here() { find artifacts -name "$1" -type f -print -quit | grep -q .; }
          section() {
            local path name
            path=$(find artifacts -name "$2-*.zip" -type f -print -quit)
            [ -n "$path" ] || return 0
            name=$(basename "$path")
            printf '\n%s\n- [%s](%s/%s)\n' "$1" "$name" "$base" "$name"
          }
          wheel=$(find artifacts -name '*.whl' -type f -print -quit)
          # PEP 427: the wheel filename is <distribution>-<version>-..., and the
          # distribution is escaped, so `_` there is `-` on PyPI.
          dist=$(basename "${wheel:-}" | cut -d- -f1 | tr '_' '-')
          {
            echo "body<<DOWNLOADS_EOF"
            echo "## Download"
            section "**macOS** — Apple silicon (M1 or later)" poolhouse-macos-arm64
            section "**Windows** — 64-bit" poolhouse-windows-x86_64
            section "**Linux** — 64-bit" poolhouse-linux-x86_64
            echo
            echo "Each holds the app and \`poolhouse-headless\`, for a machine with no screen. Unzip it and open it."
            if here install.sh && here install.ps1; then
              echo
              echo "**Or install from a terminal**, which picks the right one for you:"
              echo
              echo "- macOS and Linux: \`curl -fsSL $base/install.sh | sh\`"
              echo "- Windows: \`irm $base/install.ps1 | iex\`"
            fi
            if [ -n "$wheel" ] && [ "$PYPI" = "success" ]; then
              echo
              echo "**If you write Python**: \`pip install $dist\`, and \`${dist}[train]\`, or \`[all]\` for what needs more than the core."
            fi
            echo "DOWNLOADS_EOF"
          } >> "$GITHUB_OUTPUT"

      # CHANGELOG.md is what the release page says. Composed rather than appended:
      # a re-run of this job has to leave the body the same, not twice as long.
      - name: what changed
        id: notes
        working-directory: repo
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          section=""
          if [ -f CHANGELOG.md ]; then
            section=$(awk -v want="${TAG#v}" '
              $0 ~ "^## \\[" want "\\]" { on = 1; print; next }
              on && /^## \[/ { exit }
              on { print }' CHANGELOG.md)
          fi
          # A tag cut by hand has no entry to read, so the subjects stand in for one.
          # A commit that touched nothing but prose or a version number changed nothing
          # a person downloading this can see.
          worth_saying() {
            local file
            while read -r file; do
              case "$file" in
                "") ;;
                *.md|docs/*) ;;
                pyproject.toml|app/src-tauri/Cargo.toml|app/poolhouse-node/Cargo.toml) ;;
                *) return 0 ;;
              esac
            done < <(git show --name-only --pretty=format: "$1")
            return 1
          }
          if [ -z "$section" ]; then
            before=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
            range="$TAG"
            [ -n "$before" ] && range="$before..$TAG"
            section=$(
              printf '## What changed\n\n'
              for sha in $(git log --no-merges --reverse --pretty=format:'%H' "$range"); do
                worth_saying "$sha" && git show -s --pretty=format:'- %s' "$sha" && echo
              done
              if [ -n "$before" ]; then
                printf '\n**Every commit**: https://github.com/%s/compare/%s...%s\n' \
                  "$GITHUB_REPOSITORY" "$before" "$TAG"
              fi
            )
          fi
          {
            echo "body<<CHANGELOG_EOF"
            printf '%s\n' "$section"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: artifacts/**/*
          body: ${{ steps.notes.outputs.body }}${{ steps.downloads.outputs.body }}
