name: audit
# Report only: findings go to the job summary and never fail a build.
on:
  schedule:
    - cron: "11 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths: ["pyproject.toml", "app/package-lock.json", "app/src-tauri/Cargo.lock"]

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: audit the packages a full install asks pip for
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          python -m pip install ".[store,hub,web,plot,graph,serve]"
          pip-audit --desc on 2>&1 | tee pip-audit.txt
          { echo '### pip-audit'; echo '```'; cat pip-audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: npm audit
        continue-on-error: true
        working-directory: app
        run: |
          npm audit 2>&1 | tee npm-audit.txt
          { echo '### npm audit'; echo '```'; cat npm-audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  cargo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: cargo audit
        continue-on-error: true
        working-directory: app/src-tauri
        run: |
          cargo install cargo-audit --locked
          cargo audit 2>&1 | tee cargo-audit.txt
          { echo '### cargo audit'; echo '```'; cat cargo-audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
