name: release-please
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      pr_branch: ${{ steps.pr.outputs.branch }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - id: pr
        env:
          PR: ${{ steps.rp.outputs.pr }}
        run: |
          if [ -n "$PR" ]; then
            printf 'branch=%s\n' "$(printf '%s' "$PR" | jq -r .headBranchName)" >> "$GITHUB_OUTPUT"
          fi

  # A run on the release pull request waits for approval (the action opens it with its own
  # token), and the version bump is the one change that a test covers
  # (tests/test_packaging.py reads version.txt against pyproject.toml). So the branch is tested
  # by dispatching ci.yml and the bundle build (release-dry-run.yml) on it: a workflow_dispatch
  # by GITHUB_TOKEN is the one event that starts a run. Neither workflow checks out a ref named
  # by an input, so nothing here runs a caller-chosen ref in the default branch's cache scope.
  # release-dry-run.yml builds and smoke-checks every bundle; nothing is uploaded.
  release-pr:
    needs: propose
    if: needs.propose.outputs.pr_branch != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: dispatch the tests and the bundle build on the release branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ needs.propose.outputs.pr_branch }}
        run: |
          gh workflow run ci.yml --ref "$BRANCH"
          gh workflow run release-dry-run.yml --ref "$BRANCH"

  # A tag pushed by the action's own token starts no workflow, so the build is
  # called from here rather than waiting for refs/tags to fire release.yml.
  build:
    needs: propose
    if: needs.propose.outputs.released == 'true'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.propose.outputs.tag }}
