name: redteam
# Report-only: nothing here gates a merge. It runs the parts of the red-team suite that need
# no local model (the fixtures, the scorers, the daemon attacks, and the chat route against a
# scripted stub) and keeps the report. The measurement against a real model is run by hand.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  redteam:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: install
        run: python -m pip install -e ".[redteam]" pytest-xdist pyyaml psutil
      - name: tests
        run: python -m pytest tests/test_redteam_*.py -q --redteam -n 0
      - name: attacks on a stub model
        run: >
          python -m ml_stack.redteam run --model stub --out redteam-stub
          --scenarios extraction,chat,fleet
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: redteam-report
          path: redteam-stub.*
